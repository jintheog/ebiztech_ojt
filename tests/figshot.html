<!doctype html>
<html lang="ko">
<head><base href="../">
<!-- 그림 스크린샷용 페이지. ?id=레슨<head>n=그 레슨의 몇 번째 .fig(0부터) 또는 h2=제목 일부(그 h2부터)<head>theme=light|dark<head>w=390(휴대폰 폭 흉내) , sel=tbl 이면 첫 .fig-ico가 든 표.
     headless 스크린샷은 스크롤하면 빈 화면이 찍히므로, 대상 앞의 본문 요소를 숨겨서 대상이 맨 위에 오게 한다. 사용법은 CLAUDE.md "검증 방법". -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zadara OJT 학습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Nanum+Pen+Script&display=swap">
<link rel="stylesheet" href="app/styles.css">
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><b>Zadara OJT 학습장</b><span>신입사원 기술 OJT</span></div>
  <div class="prog"><div class="bar" aria-hidden="true"><i id="pbar" style="width:0%"></i></div><span class="prog-num" id="pnum">0 레슨</span></div>
  <span class="sync" id="sync">이 브라우저에 저장</span>
  <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">목차</button>
</div></header>
<div class="shell">
  <nav id="nav" aria-label="목차"></nav>
  <main id="view"><p class="muted">불러오는 중…</p></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 내용: 커리큘럼 정의와 공부법. 레슨 파일(content/lessons/*.js)은 core.js가 순서대로 불러옵니다. -->
<script src="content/curriculum.js"></script>
<script src="content/guide.js"></script>
<!-- 앱 코드 -->
<script src="app/core.js"></script>
<script src="app/icons.js"></script>
<script src="app/widgets.js"></script>
<script src="app/home.js"></script>
<script src="app/lesson.js"></script>
<script src="app/cards.js"></script>
<script src="app/exam.js"></script>
<script src="app/qnote.js"></script>
<script src="app/terminal.js"></script>
<script>
const P=new URLSearchParams(location.search);document.documentElement.dataset.theme=P.get("theme")||"light";
if(P.get("w")){document.documentElement.style.width=P.get("w")+"px";document.documentElement.style.overflow="hidden";}
const go=()=>{ if(!LESSONS.length) return setTimeout(go,50); location.hash=P.get("id"); setTimeout(()=>{
  const el=P.get("h2")?[...document.querySelectorAll("#view h2")].find(h=>h.textContent.includes(P.get("h2"))):P.get("sel")==="tbl"?document.querySelector(".fig-ico").closest(".tbl-wrap"):document.querySelectorAll(".fig")[+(P.get("n")||0)];
  let t=el; while(t.parentElement && t.parentElement.id!=="view") t=t.parentElement;
  let p=t.previousElementSibling; while(p){ p.style.display="none"; p=p.previousElementSibling; }
},400);}; go();
</script>
</body>
</html>
