<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zadara OJT 학습장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: 학습 노트 콘셉트. 왼쪽 목차(레슨 진도), 오른쪽 본문 노트. 형광펜(노랑)은 '외울 것', 파란 펜은 '내 손으로 할 것'. */
:root{
  --paper:#F4F6F8; --card:#FFFFFF; --ink:#16202B; --muted:#5B6877; --line:#D8DFE6; --line-2:#E9EDF1;
  --accent:#1D56D1; --accent-ink:#FFFFFF; --accent-soft:#E4ECFB;
  --hl:#FFE45A; --hl-soft:rgba(255,228,90,.55);
  --good:#177A43; --good-soft:#E2F3E9; --warn:#9A6100; --warn-soft:#FBF0D9; --bad:#B83236; --bad-soft:#F9E3E3;
  --term-bg:#0E151D; --term-fg:#D5E1EC; --term-dim:#7F90A2; --term-green:#7AD58C; --term-blue:#7FB0FF; --term-red:#FF8A80; --term-yellow:#F3D36B;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --f-pen:"Nanum Pen Script","IBM Plex Sans KR",cursive;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10151B; --card:#171E26; --ink:#E3E9EF; --muted:#9AA7B5; --line:#2A3542; --line-2:#212A35;
  --accent:#86A9FF; --accent-ink:#0B1220; --accent-soft:#1C2942;
  --hl:#E9C93A; --hl-soft:rgba(233,201,58,.30);
  --good:#6FCF95; --good-soft:#15301F; --warn:#E3B565; --warn-soft:#352A14; --bad:#FF8F8F; --bad-soft:#3A1B1C;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#10151B; --card:#171E26; --ink:#E3E9EF; --muted:#9AA7B5; --line:#2A3542; --line-2:#212A35;
  --accent:#86A9FF; --accent-ink:#0B1220; --accent-soft:#1C2942;
  --hl:#E9C93A; --hl-soft:rgba(233,201,58,.30);
  --good:#6FCF95; --good-soft:#15301F; --warn:#E3B565; --warn-soft:#352A14; --bad:#FF8F8F; --bad-soft:#3A1B1C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.75;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit;cursor:pointer}
code,kbd,pre{font-family:var(--f-mono);font-size:.92em}
code{background:var(--line-2);padding:.08em .38em;border-radius:5px}
mark{background:linear-gradient(transparent 52%,var(--hl-soft) 52%);color:inherit;padding:0 .1em}
h1,h2,h3{line-height:1.35;text-wrap:balance;margin:0}
h1{font-size:clamp(1.55rem,1.2rem + 1.4vw,2.05rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.28rem;font-weight:700;margin-top:2.4rem;margin-bottom:.6rem;padding-top:1.2rem;border-top:1px solid var(--line)}
h3{font-size:1.05rem;font-weight:700;margin-top:1.5rem;margin-bottom:.3rem}
p{margin:.55rem 0}
ul,ol{padding-left:1.25rem;margin:.5rem 0}
li{margin:.22rem 0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--f-mono)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand b{font-size:.98rem;letter-spacing:-.01em}
.brand span{font-size:.74rem;color:var(--muted);font-family:var(--f-mono);letter-spacing:.04em}
.prog{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.bar{flex:1;height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;max-width:320px;margin-left:auto}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.prog-num{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sync{font-size:.74rem;color:var(--muted);white-space:nowrap}
.menu-btn{display:none;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 11px;font-size:.88rem}

/* shell */
.shell{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 80px}
nav#nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.nav-g{margin-bottom:18px}
.nav-g h4{margin:0 0 6px;font-size:.7rem;letter-spacing:.12em;color:var(--muted);font-family:var(--f-mono);font-weight:500;text-transform:uppercase}
.nav-a{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.9rem;line-height:1.35}
.nav-a:hover{background:var(--line-2)}
.nav-a.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav-a .dot{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.66rem;font-family:var(--f-mono);color:var(--muted)}
.nav-a .dot.done{background:var(--good);border-color:var(--good);color:var(--card)}
.nav-a .dot.due{border-color:var(--warn);color:var(--warn)}
main#view{min-width:0;max-width:780px}

/* generic blocks */
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.1em;color:var(--accent);text-transform:uppercase;margin-bottom:6px}
.lede{font-size:1.04rem;color:var(--muted);margin-top:.5rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.stack-v{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.box{border-radius:var(--r);padding:14px 16px;margin:1rem 0;border:1px solid var(--line);background:var(--card)}
.box > :first-child{margin-top:0}.box > :last-child{margin-bottom:0}
.box.analogy{border-color:transparent;background:var(--accent-soft)}
.box.analogy .lbl{font-family:var(--f-pen);font-size:1.35rem;color:var(--accent);line-height:1;display:block;margin-bottom:4px}
.box.warn{background:var(--warn-soft);border-color:transparent}
.box.warn .lbl{color:var(--warn);font-weight:700}
.box.mem{background:var(--card);border:1.5px dashed var(--hl)}
.box.mem .lbl{display:inline-block;background:var(--hl);color:#2B2300;font-weight:700;font-size:.8rem;padding:1px 8px;border-radius:4px;margin-bottom:4px}
.lbl{font-size:.82rem}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-size:.92rem;font-weight:500;text-decoration:none;color:var(--ink);line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.76rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tbl-wrap{overflow-x:auto;margin:1rem 0;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
th{font-size:.78rem;color:var(--muted);font-weight:500;background:var(--line-2);white-space:nowrap}
tr:last-child td{border-bottom:none}
td code{white-space:nowrap}
pre.code{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;overflow-x:auto;line-height:1.6;margin:1rem 0}
pre.code .c{color:var(--muted)}

/* terms preview */
.terms{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.term{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.term:last-child{border-bottom:none}
.term dt{font-weight:700}
.term dt small{display:block;font-weight:400;color:var(--muted);font-family:var(--f-mono);font-size:.74rem}
.term dd{margin:0}

/* steps (real sequence) */
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;margin:0}
.steps a{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;padding:4px 10px 4px 5px;border-radius:99px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.steps a::before{content:counter(s);width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.7rem;font-family:var(--f-mono)}

/* diagrams */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:1.1rem 0;overflow-x:auto}
.flow .n{flex:1 1 110px;min-width:96px;background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;text-align:center;font-size:.88rem;line-height:1.4}
.flow .n b{display:block;font-size:.95rem}
.flow .n small{color:var(--muted);font-size:.76rem}
.flow .n.k{border-color:var(--accent)}
.flow .ar{align-self:center;color:var(--muted);font-family:var(--f-mono);flex:none}
.layers{display:flex;flex-direction:column;gap:4px;margin:1.1rem 0;max-width:520px}
.layers div{border-radius:7px;padding:8px 12px;font-size:.9rem;display:flex;justify-content:space-between;gap:10px;border:1px solid var(--line);background:var(--card)}
.layers div span{color:var(--muted);font-size:.8rem;text-align:right}
.layers .l1{background:var(--accent-soft);border-color:transparent}
.layers .l0{background:var(--line-2)}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:1.1rem 0}
.zones > div{border:1.5px dashed var(--line);border-radius:10px;padding:10px;font-size:.86rem}
.zones h5{margin:0 0 6px;font-size:.78rem;color:var(--muted);font-family:var(--f-mono);font-weight:500;letter-spacing:.04em}
.tree{font-family:var(--f-mono);font-size:.86rem;line-height:1.7;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;overflow-x:auto;white-space:pre;margin:1rem 0}
.tree .d{color:var(--accent);font-weight:600}
.tree .c{color:var(--muted)}
.perm-anat{font-family:var(--f-mono);font-size:1.15rem;display:flex;flex-wrap:wrap;gap:3px;margin:1rem 0}
.perm-anat span{padding:6px 8px;border-radius:6px;text-align:center;line-height:1.2}
.perm-anat span small{display:block;font-family:var(--f-body);font-size:.68rem;color:var(--muted);margin-top:3px}
.pa-t{background:var(--line-2)}.pa-u{background:var(--accent-soft)}.pa-g{background:var(--good-soft)}.pa-o{background:var(--warn-soft)}.pa-r{background:var(--card);border:1px solid var(--line)}

/* summary */
.sum{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;position:relative}
.sum .pen{font-family:var(--f-pen);font-size:1.5rem;color:var(--accent);line-height:1}
.sum ol{margin-top:8px}

/* quiz */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:12px 0}
.q-h{display:flex;gap:10px;font-weight:500}
.q-h .qn{font-family:var(--f-mono);color:var(--muted);flex:none;font-size:.86rem;padding-top:2px}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.opt{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.93rem;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.expl{margin-top:10px;font-size:.9rem;padding:9px 12px;border-radius:8px;background:var(--line-2)}
.expl b.ok{color:var(--good)}.expl b.no{color:var(--bad)}
.score{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.score .big{font-family:var(--f-mono);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums}

/* essay */
.es textarea{width:100%;min-height:92px;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:.93rem;background:var(--paper);color:var(--ink);resize:vertical}
.model{margin-top:10px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:.92rem}
.grade{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.grade button{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:5px 11px;font-size:.85rem}
.grade button.on.g2{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.grade button.on.g1{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.grade button.on.g0{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

/* completion */
.done-box{border:2px solid var(--line);border-radius:12px;padding:18px;background:var(--card)}
.cond{display:flex;align-items:flex-start;gap:10px;padding:6px 0}
.cond .ck{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;margin-top:2px}
.cond.ok .ck{background:var(--good);border-color:var(--good);color:var(--card)}
.cond label{cursor:pointer}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:28px;flex-wrap:wrap}

/* home */
.hero-h{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.lesson-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.lrow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line-2);text-decoration:none;color:var(--ink)}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:var(--line-2)}
.lrow .wk{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.lrow .tt{font-weight:500;font-size:.94rem;line-height:1.4}
.lrow .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stat-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-mono);font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}

/* flashcards */
.fc{min-height:230px;border:1px solid var(--line);border-radius:14px;background:var(--card);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 22px;cursor:pointer;position:relative;transition:transform .25s}
.fc .side{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);position:absolute;top:12px;left:14px;letter-spacing:.08em}
.fc .from{position:absolute;top:12px;right:14px}
.fc .front{font-size:1.6rem;font-weight:700}
.fc .back{font-size:1.02rem;max-width:560px}
.fc.flipped{border-color:var(--accent)}
.fc-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.fc-actions button{border:1.5px solid var(--line);border-radius:10px;background:var(--card);padding:10px 6px;font-weight:500;font-size:.92rem}
.fc-actions .k0{color:var(--bad)}.fc-actions .k1{color:var(--warn)}.fc-actions .k2{color:var(--good)}
.fc-actions button:hover{border-color:currentColor}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--line-2);padding:3px;border-radius:9px}
.seg button{border:none;background:transparent;border-radius:7px;padding:5px 10px;font-size:.84rem;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
select,input[type=text],input[type=search]{font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card);color:var(--ink);max-width:100%}
.gl-list{border:1px solid var(--line);border-radius:var(--r);background:var(--card);max-height:460px;overflow:auto}
.gl-item{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line-2);font-size:.9rem}
.gl-item:last-child{border-bottom:none}
.gl-item b{font-weight:700}

/* terminal (always dark, like a real console) */
.term-wrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.tty{background:var(--term-bg);color:var(--term-fg);border-radius:12px;font-family:var(--f-mono);font-size:.86rem;line-height:1.55;height:460px;display:flex;flex-direction:column;overflow:hidden;border:1px solid #233142}
.tty-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#16212C;color:var(--term-dim);font-size:.74rem}
.tty-bar i{width:9px;height:9px;border-radius:50%;background:#33475B;display:inline-block}
.tty-out{flex:1;overflow:auto;padding:10px 14px;white-space:pre;tab-size:8}
.term-wrap .missions{max-height:560px;overflow:auto}
.tty-in{display:flex;gap:8px;padding:0 14px 12px}
.tty-in input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--term-fg);font:inherit;caret-color:var(--term-green);padding:0}
.t-p{color:var(--term-green)}.t-d{color:var(--term-blue);font-weight:600}.t-e{color:var(--term-red)}.t-y{color:var(--term-yellow)}.t-m{color:var(--term-dim)}
.missions{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.mi{display:flex;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:.88rem;line-height:1.5}
.mi:last-child{border-bottom:none}
.mi .ck{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.7rem;margin-top:1px;font-family:var(--f-mono);color:var(--muted)}
.mi.ok .ck{background:var(--good);border-color:var(--good);color:var(--card)}
.mi.cur{font-weight:500}
.mi.cur .ck{border-color:var(--accent);color:var(--accent)}
.mi.todo{color:var(--muted)}
.hint{font-size:.8rem;color:var(--muted);margin-top:3px;font-weight:400}

body:`
<h2 id="s1">컴퓨터는 결국 네 가지 일을 한다</h2>
<p>어떤 컴퓨터든 하는 일은 똑같습니다. 무언가를 <b>입력</b>받고, <b>처리</b>(계산)하고, 결과를 <b>저장</b>하고, 사람이나 다른 컴퓨터에게 <b>출력</b>합니다. 휴대폰도, 회사 노트북도, 데이터센터의 서버도 이 네 가지를 합니다. 차이는 크기와 용도뿐입니다.</p>
<div class="flow"><div class="n"><b>입력</b><small>키보드, 터치, 요청</small></div><span class="ar">→</span><div class="n k"><b>처리</b><small>CPU가 계산</small></div><span class="ar">→</span><div class="n"><b>저장</b><small>메모리, 디스크</small></div><span class="ar">→</span><div class="n"><b>출력</b><small>화면, 응답</small></div></div>

<h2 id="s2">하드웨어, 소프트웨어, 그리고 운영체제</h2>
<p><b>하드웨어</b>는 손으로 만질 수 있는 부품이고, <b>소프트웨어</b>는 그 위에서 돌아가는 프로그램입니다. 둘 사이에서 교통정리를 하는 것이 <b>운영체제(OS)</b>입니다.</p>
<div class="box analogy"><span class="lbl">비유로 보면</span>건물(하드웨어)이 있고, 입주한 가게들(앱)이 있습니다. 가게들이 전기·수도·엘리베이터를 마음대로 건드리면 건물이 엉망이 되겠죠. 그래서 <b>건물 관리사무소(운영체제)</b>가 "전기는 이만큼, 엘리베이터는 순서대로" 하고 나눠 줍니다.</div>
<p>앞으로 계속 보게 될 운영체제는 <b>Linux(리눅스)</b>입니다. 서버 세계에서는 Windows보다 리눅스를 훨씬 많이 씁니다. 2주차에 자세히 배웁니다.</p>

<h2 id="s3">서버와 클라이언트</h2>
<p><mark>서버는 특별한 기계 이름이 아니라 "역할"의 이름</mark>입니다. 요청을 받아서 서비스를 돌려주면 서버, 요청하는 쪽이면 클라이언트입니다. 내 노트북에 웹 서버 프로그램을 설치하면 내 노트북도 서버가 됩니다.</p>
<div class="box analogy"><span class="lbl">비유로 보면</span><b>식당</b>을 떠올리세요. 손님(클라이언트)이 "김치찌개 하나요"라고 주문(요청)하면, 주방(서버)이 음식을 만들어 내줍니다(응답). 주방은 손님 한 명만 상대하지 않고 여러 손님의 주문을 동시에 처리하며, 가게는 문을 닫지 않습니다.</div>
<p>그래서 업무용 서버는 보통 이런 특징이 있습니다.</p>
<ul><li><b>24시간 켜져 있다.</b> 꺼지면 서비스가 멈추기 때문입니다.</li><li><b>여러 요청을 동시에 처리한다.</b> 그래서 CPU·메모리가 크고 튼튼합니다.</li><li><b>화면 없이 원격으로 관리한다.</b> 엔지니어는 데이터센터에 가지 않고 자기 자리에서 네트워크로 접속해 관리합니다. (2주차에 배울 <code>SSH</code>가 그 방법)</li></ul>
<div class="flow"><div class="n"><b>클라이언트</b><small>내 휴대폰 앱</small></div><span class="ar">요청 →</span><div class="n"><b>네트워크</b><small>인터넷</small></div><span class="ar">→</span><div class="n k"><b>서버</b><small>데이터센터</small></div></div>

<h2 id="s4">IT 인프라의 3요소</h2>
<p>"인프라(Infrastructure)"는 기반 시설이라는 뜻입니다. 도시에 도로·수도·전기가 있어야 가게가 장사를 할 수 있듯, 서비스(앱)가 돌아가려면 바탕이 필요합니다. 그 바탕의 핵심이 세 가지입니다.</p>
<div class="tbl-wrap"><table><thead><tr><th>요소</th><th>하는 일</th><th>비유</th><th>실물 예시</th></tr></thead><tbody>
<tr><td><b>서버</b></td><td>계산하고 처리한다</td><td>일하는 사람(요리사)</td><td>랙에 꽂힌 서버, VM</td></tr>
<tr><td><b>네트워크</b></td><td>데이터를 실어 나른다</td><td>도로와 배달길</td><td>스위치, 라우터, 방화벽, 케이블</td></tr>
<tr><td><b>스토리지</b></td><td>데이터를 오래 보관한다</td><td>창고와 냉장고</td><td>디스크, 저장 장비, 저장 서비스</td></tr>
</tbody></table></div>
<p>여기에 <b>보안</b>(누가 들어올 수 있는지), <b>전원·냉각</b>(꺼지지 않게, 뜨거워지지 않게)까지 합쳐서 IT 인프라라고 부릅니다. 우리 회사 Zadara는 이 인프라를 "빌려 쓰는 서비스" 형태로 파는 회사입니다. (3일차에 자세히)</p>

<h2 id="s5">데이터센터: 서버들이 사는 집</h2>
<p>서버는 보통 사무실이 아니라 <b>데이터센터(IDC)</b>라는 전용 건물에 있습니다. 서버를 한곳에 모으는 이유는 서버가 좋아하는 환경을 만들기 쉬워서입니다.</p>
<ul><li><b>전원</b>: 정전에 대비해 전기를 두 갈래로 받고, 배터리(UPS)와 발전기를 둡니다.</li><li><b>냉각</b>: 서버는 열이 많이 나서 항상 시원하게 유지해야 합니다.</li><li><b>보안</b>: 출입 카드, CCTV, 출입 기록으로 아무나 못 들어가게 합니다.</li><li><b>네트워크</b>: 빠르고 안정적인 인터넷 회선이 여러 개 들어옵니다.</li></ul>
<p>서버는 <b>랙</b>이라는 철제 선반에 서랍처럼 꽂혀 있습니다. 데이터센터 사진을 검색해서 한 번 보세요. 머릿속 그림이 생기면 훨씬 덜 막막합니다.</p>

<h2 id="s6">단위 감 잡기: bit와 Byte</h2>
<p>컴퓨터는 모든 것을 0과 1로 저장합니다. 0이나 1 하나가 <b>bit</b>, bit 8개를 묶은 것이 <b>Byte</b>입니다.</p>
<div class="tbl-wrap"><table><thead><tr><th>단위</th><th>크기</th><th>감 잡기</th></tr></thead><tbody>
<tr><td>1 Byte (B)</td><td>8 bit</td><td>영문 한 글자</td></tr>
<tr><td>1 KB</td><td>약 1,000 B</td><td>짧은 메모 한 장</td></tr>
<tr><td>1 MB</td><td>약 1,000 KB</td><td>사진 1장 정도(2~5MB)</td></tr>
<tr><td>1 GB</td><td>약 1,000 MB</td><td>영화 1편 정도</td></tr>
<tr><td>1 TB</td><td>약 1,000 GB</td><td>요즘 노트북 디스크 1개</td></tr>
</tbody></table></div>
<p class="small muted">정확히는 1,024배씩 커지는 표기(KiB, MiB…)도 있습니다. 지금은 "약 1,000배씩"으로 기억해도 충분합니다.</p>
<div class="box mem"><span class="lbl">외울 것</span><p><b>저장 용량은 대문자 B(Byte)</b>, <b>네트워크 속도는 소문자 b(bit)</b>를 씁니다. 그래서 1Gbps(초당 1기가비트) 회선은 1초에 최대 <b>125MB</b>(= 1,000Mb ÷ 8)를 보냅니다. 인터넷이 "1기가"라는데 다운로드가 125MB/s로 보이는 이유가 이것입니다.</p></div>
`,
summary:['서버는 기계 이름이 아니라 "요청을 받아 응답하는" 역할 이름이다.','IT 인프라 3요소: 서버(처리) · 네트워크(전달) · 스토리지(보관).','OS는 하드웨어와 앱 사이의 관리사무소. 서버 OS는 대부분 Linux.','데이터센터는 전원·냉각·보안·네트워크가 갖춰진 서버의 집. 서버는 랙에 꽂는다.','8 bit = 1 Byte. 용량은 B, 속도는 b. 1Gbps ≈ 125MB/s.'],

{q:'서버와 클라이언트의 관계를 식당에 비유해서 설명해 보세요.',a:'손님(클라이언트)이 주문(요청)을 하면 주방(서버)이 음식을 만들어 내준다(응답). 주방은 여러 손님의 주문을 동시에 처리하고, 가게는 계속 문을 열어 둔다. 서버도 여러 클라이언트의 요청을 동시에 처리하고 24시간 켜져 있다. 서버는 기계 이름이 아니라 역할 이름이다.'},

body:`
<h2 id="s1">옛날 방식: 온프레미스</h2>
<p>클라우드 이전에는 회사가 서비스를 만들려면 이렇게 해야 했습니다. 서버를 몇 대 살지 계산하고 → 장비를 주문해서 몇 주~몇 달 기다리고 → 데이터센터에 설치하고 → 직접 운영합니다. 이것이 <b>온프레미스(On-Premises)</b>입니다.</p>
<ul><li><b>처음에 돈이 많이 든다.</b> 장비를 한꺼번에 사야 합니다.</li><li><b>느리다.</b> 서버가 필요해도 바로 생기지 않습니다.</li><li><b>남거나 모자란다.</b> 넉넉히 사면 장비가 놀고, 적게 사면 손님이 몰릴 때 서비스가 멈춥니다.</li></ul>
<p>대신 장비가 내 손안에 있어서 통제하기 쉽고, 데이터가 회사 밖으로 나가지 않는다는 장점이 있습니다.</p>

<h2 id="s2">새로운 방식: 클라우드</h2>
<p><b>클라우드</b>는 이 서버·네트워크·스토리지를 <mark>필요할 때, 필요한 만큼 빌려 쓰고, 쓴 만큼 돈을 내는</mark> 방식입니다.</p>
<div class="box analogy"><span class="lbl">비유로 보면</span>온프레미스는 <b>집을 사는 것</b>, 클라우드는 <b>호텔이나 렌터카를 쓰는 것</b>입니다. 집은 큰돈이 들고 수리도 내가 하지만 마음대로 고칠 수 있습니다. 호텔은 오늘 바로 쓸 수 있고, 쓴 날만큼 내고, 청소·수리는 호텔이 합니다.</div>
<p>클라우드의 특징을 다섯 가지로 정리하면 이렇습니다.</p>
<div class="tbl-wrap"><table><thead><tr><th>특징</th><th>뜻</th></tr></thead><tbody>
<tr><td>셀프서비스</td><td>웹 화면(콘솔)에서 클릭 몇 번으로 서버를 직접 만든다. 담당자에게 요청할 필요가 없다.</td></tr>
<tr><td>빠름</td><td>몇 달이 아니라 몇 분 만에 서버가 생긴다.</td></tr>
<tr><td>탄력성</td><td>손님이 몰리면 늘리고, 줄면 줄인다.</td></tr>
<tr><td>종량제</td><td>쓴 만큼만 낸다(Pay-as-you-go).</td></tr>
<tr><td>어디서나 접근</td><td>인터넷만 되면 어디서든 관리할 수 있다.</td></tr>
</tbody></table></div>

<h2 id="s3">어떻게 "몇 분 만에" 서버가 생길까: 가상화</h2>
<p>클라우드 회사가 고객마다 진짜 서버를 새로 사서 꽂는 게 아닙니다. 아주 큰 물리 서버를 미리 많이 갖춰 두고, <b>가상화</b> 기술로 한 대를 여러 개의 <b>VM(가상 머신)</b>으로 쪼개서 나눠 줍니다. 그래서 빠릅니다. 가상화는 2주차 2일에 제대로 배웁니다. 지금은 <mark>"클라우드 = 가상화로 쪼갠 자원을 빌려주는 것"</mark>까지만 기억하세요.</p>

<h2 id="s4">돈의 관점: CapEx와 OpEx</h2>
<p>회사 사람들(특히 고객사 결정권자)은 기술보다 돈으로 먼저 이해합니다. 영업·기술 미팅에서 자주 나오는 말이니 알아 두세요.</p>
<ul><li><b>CapEx(자본적 지출)</b>: 장비를 사는 것처럼 처음에 크게 쓰는 돈. 온프레미스 방식.</li><li><b>OpEx(운영비)</b>: 매달 쓴 만큼 내는 돈. 클라우드 방식.</li></ul>
<p>"초기 투자 없이 OpEx로 전환할 수 있다"는 것이 클라우드의 대표적인 장점이고, Zadara도 이 점을 강조합니다.</p>

<h2 id="s5">서비스 모델: IaaS · PaaS · SaaS</h2>
<p>클라우드는 "어디까지 빌려주느냐"에 따라 세 가지로 나뉩니다. 핵심 질문은 하나입니다. <mark>누가 어디까지 관리하는가?</mark></p>
<div class="box analogy"><span class="lbl">비유로 보면 (피자)</span><b>온프렘</b> = 재료 사서 집에서 직접 굽기 · <b>IaaS</b> = 반조리 피자 사서 내 오븐에 굽기 · <b>PaaS</b> = 배달 피자(식탁과 음료는 내가) · <b>SaaS</b> = 피자 가게에 가서 먹기(나는 먹기만)</div>
<div class="tbl-wrap"><table><thead><tr><th>관리 항목</th><th>온프렘</th><th>IaaS</th><th>PaaS</th><th>SaaS</th></tr></thead><tbody>
<tr><td>앱·데이터</td><td>고객</td><td>고객</td><td>고객</td><td>제공자</td></tr>
<tr><td>실행 환경·미들웨어</td><td>고객</td><td>고객</td><td>제공자</td><td>제공자</td></tr>
<tr><td>OS</td><td>고객</td><td>고객</td><td>제공자</td><td>제공자</td></tr>
<tr><td>가상화·서버·스토리지·네트워크</td><td>고객</td><td>제공자</td><td>제공자</td><td>제공자</td></tr>
</tbody></table></div>
<ul><li><b>IaaS 예</b>: AWS EC2, Zadara zCompute의 VM. 우리 OJT 5~7주차가 바로 IaaS를 다루는 과정입니다.</li><li><b>PaaS 예</b>: 관리형 데이터베이스, 관리형 쿠버네티스.</li><li><b>SaaS 예</b>: Gmail, Zoom, Notion, Microsoft 365.</li></ul>
<p class="small muted">4주차에 배우는 "책임 공유 모델(Shared Responsibility)"이 바로 이 표의 이야기입니다. 미리 눈에 익혀 두세요.</p>

<h2 id="s6">배포 모델: 누구와 함께 쓰나</h2>
<div class="tbl-wrap"><table><thead><tr><th>모델</th><th>뜻</th><th>예</th></tr></thead><tbody>
<tr><td><b>퍼블릭</b></td><td>여러 고객이 한 클라우드 회사의 자원을 나눠 쓴다</td><td>AWS, Azure, Google Cloud, KT Cloud, NAVER Cloud, NHN Cloud</td></tr>
<tr><td><b>프라이빗</b></td><td>한 조직만 쓰는 전용 클라우드</td><td>은행·공공기관 전용 클라우드</td></tr>
<tr><td><b>하이브리드</b></td><td>온프렘·프라이빗과 퍼블릭을 연결해 함께 쓴다</td><td>중요 데이터는 사내, 웹은 퍼블릭</td></tr>
<tr><td><b>멀티 클라우드</b></td><td>여러 클라우드 회사를 동시에 쓴다</td><td>AWS와 KT Cloud를 함께</td></tr>
</tbody></table></div>

<h2 id="s7">위치의 개념: 리전, 가용영역, 엣지</h2>
<ul><li><b>리전(Region)</b>: 클라우드 데이터센터가 모여 있는 지역. 예: "서울 리전", "도쿄 리전".</li><li><b>가용영역(AZ)</b>: 한 리전 안에 서로 떨어져 있는 데이터센터 묶음. 한 곳이 정전돼도 다른 곳에서 서비스가 계속되도록 나눠 둡니다.</li><li><b>엣지(Edge)</b>: 사용자나 데이터가 생기는 곳 가까이에 두는 자원. 공장, 병원, 지사, 지방 데이터센터 등. 거리가 가까우니 빠르고, 데이터가 멀리 나가지 않아 규제를 지키기 쉽습니다.</li></ul>
<div class="flow"><div class="n"><b>리전</b><small>서울</small></div><span class="ar">⊃</span><div class="n"><b>가용영역</b><small>AZ-a, AZ-b …</small></div><span class="ar">⊃</span><div class="n"><b>데이터센터</b><small>건물</small></div></div>
<p>Zadara는 스스로를 <b>"엣지 클라우드"</b>라고 소개합니다. 왜 그런지는 다음 레슨에서 이어집니다.</p>
`,
summary:['온프렘 = 직접 사서 운영(집 사기), 클라우드 = 빌려 쓰고 쓴 만큼 냄(호텔).','클라우드는 가상화로 쪼갠 자원을 빌려주는 것이라 몇 분 만에 서버가 생긴다.','CapEx = 처음에 크게 쓰는 투자, OpEx = 매달 쓴 만큼 내는 비용.','IaaS(인프라) / PaaS(플랫폼까지) / SaaS(완성된 소프트웨어): 누가 어디까지 관리하나.','리전 ⊃ 가용영역 ⊃ 데이터센터. 엣지 = 사용자·데이터 가까운 곳.'],

<div class="box warn"><span class="lbl">먼저 읽어 주세요</span><p>이 레슨은 Zadara 공식 웹사이트와 공개 보도자료를 바탕으로 정리했습니다. 회사에서 받은 소개서·교육 자료가 있다면 <b>그쪽이 우선</b>입니다. 다른 점을 발견하면 질문 노트에 적어 두세요.</p></div>

<h2 id="s1">한 문장으로 말하면</h2>
<p>Zadara는 <mark>컴퓨트·스토리지·네트워킹을 "완전 관리형 서비스"로, 쓴 만큼 내는 방식으로 제공하는 엣지 클라우드 회사</mark>입니다. 고객의 데이터센터(온프렘), 코로케이션, 파트너의 데이터센터 등 <b>원하는 위치</b>에 클라우드를 둘 수 있다는 점이 특징입니다.</p>
<p>본사는 미국 캘리포니아에 있고, 여러 나라에 거점이 있습니다. 처음에는 스토리지 서비스로 시작해 컴퓨트까지 넓혔습니다.</p>

<h2 id="s2">어제 배운 개념으로 Zadara 읽기</h2>
<div class="tbl-wrap"><table><thead><tr><th>어제 배운 개념</th><th>Zadara에서는</th></tr></thead><tbody>
<tr><td>클라우드 = 빌려 쓰고 쓴 만큼 냄</td><td>100% 사용량 기반 과금(OpEx). 초기 장비 구매 부담이 없다.</td></tr>
<tr><td>IaaS</td><td>zCompute(VM·네트워크), zStorage(저장소)가 IaaS에 해당한다.</td></tr>
<tr><td>엣지</td><td>고객이 원하는 곳에 설치해서, 가깝고 데이터가 밖으로 나가지 않는다.</td></tr>
<tr><td>프라이빗/하이브리드</td><td>고객 전용으로 둘 수도, 퍼블릭 클라우드와 연결해 쓸 수도 있다.</td></tr>
</tbody></table></div>

<h2 id="s3">일반 퍼블릭 클라우드와 다른 점</h2>
<ol>
<li><b>위치를 고를 수 있다.</b> AWS 같은 퍼블릭 클라우드는 정해진 리전에서만 씁니다. Zadara는 고객 데이터센터나 지역 데이터센터에 설치할 수 있어서, 데이터를 국내나 사내에 둬야 하는 고객(금융, 공공, 제조 등)에게 맞습니다. 이것을 <b>데이터 주권</b>이라고 합니다.</li>
<li><b>완전 관리형이다.</b> 장비가 고객 데이터센터에 있어도 운영·모니터링·장애 대응은 Zadara 운영팀이 원격으로 맡습니다. 고객은 IT 운영 부담 없이 서비스를 씁니다.</li>
<li><b>파트너를 통해 판매된다.</b> 통신사, 데이터센터 회사, MSP 같은 파트너가 Zadara를 바탕으로 자기 이름의 클라우드 서비스를 만들기도 합니다.</li>
<li><b>익숙한 클라우드 개념을 그대로 쓴다.</b> VPC, Security Group, Load Balancer처럼 AWS와 비슷한 구조라서, AWS 개념을 배워 두면 그대로 통합니다.</li>
</ol>

<h2 id="s4">제품 두 기둥: zCompute와 zStorage</h2>
<p>Zadara 기술 문서는 <b>zStorage가 아래를 받치고, 그 위에 zCompute가 올라가는</b> 구조로 설명합니다. 둘은 필요에 따라 각각 따로 늘릴 수 있습니다.</p>
<div class="layers">
<div class="l1"><b>zCompute</b><span>VM · VPC · Security Group · Load Balancer · Auto Scaling · Kubernetes · GPU</span></div>
<div><b>zStorage</b><span>VPSA(Block · File) · Object Storage(S3 호환)</span></div>
<div class="l0"><b>물리 장비</b><span>서버 · 디스크 · 네트워크 (데이터센터)</span></div>
</div>
<h3>zCompute (5~6주차)</h3>
<p>가상 서버(VM)를 만들고, 가상 네트워크(VPC)를 짜고, 방화벽 규칙(Security Group)과 로드밸런서를 붙이는 서비스입니다. AWS로 치면 EC2·VPC·ELB에 해당하는 영역입니다. 사용량에 따라 서버 수를 자동으로 늘리는 오토스케일링, 컨테이너를 위한 쿠버네티스, AI용 GPU도 제공합니다.</p>
<h3>zStorage (7주차)</h3>
<p>저장소를 서비스로 제공합니다. 핵심 단위는 <b>VPSA</b>(고객 전용 가상 스토리지 장비)입니다. 저장 방식 세 가지를 모두 다룹니다. 4주차에 자세히 배우니 지금은 이름만 눈에 익히세요.</p>
<ul><li><b>Block</b>: 서버에 디스크처럼 붙여서 쓰는 방식 (iSCSI)</li><li><b>File</b>: 공유 폴더처럼 쓰는 방식 (NFS, SMB)</li><li><b>Object</b>: 인터넷 주소로 파일을 올리고 받는 방식 (S3 호환)</li></ul>
<p>공개 자료에는 zStorage 99.999%, zCompute 99.5%의 SLA가 소개되어 있습니다. 실제 계약 조건은 회사 자료로 확인하세요.</p>

<h2 id="s5">한국에서의 Zadara</h2>
<ul>
<li>2015년, 국내 파트너 <b>이비즈테크</b>와 함께 KT의 클라우드 고객에게 VPSA 스토리지를 제공하기 시작했습니다.</li>
<li>2016년, KINX 데이터센터에 VPSA를 두고 AWS 서울 리전 사용 고객을 지원했습니다.</li>
<li>2022년, KINX의 멀티 클라우드 연결 플랫폼 <b>CloudHub</b>에 zStorage를 제공하는 파트너십을 맺었습니다.</li>
<li>최근에는 한진정보통신과의 파트너십, 클라우드 엔지니어 커뮤니티 협력 등이 보도되었습니다.</li>
</ul>
<p>OJT 일정표 마지막에 "주요 고객사·KT Cloud/AWS 연계 환경"이 후속 교육으로 잡혀 있는 이유가 이 배경입니다.</p>

<h2 id="s6">내 OJT 일정과 연결하기</h2>
<div class="tbl-wrap"><table><thead><tr><th>지금 배우는 개념</th><th>나중에 실습하는 곳</th></tr></thead><tbody>
<tr><td>서버, VM, 가상화</td><td>5주차: zCompute에서 VM 만들기</td></tr>
<tr><td>Linux, SSH, 계정·권한</td><td>5주차: VM에 SSH로 접속해 웹 서버 설치</td></tr>
<tr><td>네트워크, Subnet, 방화벽</td><td>5~6주차: VPC·Subnet·Security Group 구성</td></tr>
<tr><td>3-Tier, 이중화, 로드밸런서</td><td>6주차: 웹 서버 2대 + 로드밸런서 구성</td></tr>
<tr><td>Block·File·Object, 스냅샷</td><td>7주차: VPSA 연결, 스냅샷·복구 실습</td></tr>
</tbody></table></div>
<p>지금 배우는 모든 기초가 <b>5~7주차에 실제 손으로 하는 작업</b>으로 이어집니다. 기초를 대충 넘기면 그때 막힙니다.</p>

<h2 id="s7">회사에서 자주 듣게 될 말</h2>
<ul><li><b>고객사 / 파트너사</b>: 서비스를 쓰는 회사 / 함께 파는 회사.</li><li><b>PoC</b>: 계약 전에 고객 환경에서 시험 구축해 검증하는 것.</li><li><b>구축</b>: 처음 설치하고 설정하는 작업. <b>운영</b>: 구축 후 안정적으로 돌아가게 관리하는 일.</li><li><b>장애</b>: 서비스가 멈추거나 느려지는 문제. <b>장애 대응</b>: 원인을 찾고 복구하는 일.</li></ul>

body:`
<h2 id="s1">신입 엔지니어에게 기대하는 것</h2>
<p>신입에게 처음부터 정답을 기대하지 않습니다. 대신 이 네 가지는 첫날부터 기대합니다.</p>
<ol><li><b>정확하게</b>: 모르면 추측하지 말고 확인합니다.</li><li><b>기록하기</b>: 한 일을 남깁니다.</li><li><b>빨리 공유하기</b>: 문제가 생기면 숨기지 말고 바로 알립니다.</li><li><b>제대로 묻기</b>: 혼자 오래 붙잡지 말고, 정리해서 묻습니다.</li></ol>

<h2 id="s2">보고는 두괄식으로</h2>
<p>상대가 바쁘다고 생각하고 <mark>결론 → 이유 → 다음 할 일</mark> 순서로 말합니다.</p>
<div class="grid2">
<div class="box"><span class="lbl muted">이렇게 하지 않기</span><p>"아침에 접속을 해 봤는데요, 안 돼서 이것저것 찾아봤는데, 처음엔 비밀번호 문제인 줄 알았는데 그게 아니라서…"</p></div>
<div class="box" style="border-color:var(--good)"><span class="lbl" style="color:var(--good)">이렇게 하기</span><p>"서버 접속 문제는 해결했습니다. 원인은 방화벽에서 22번 포트가 막혀 있었던 것이고, 허용 규칙을 추가했습니다. 지금 정상 접속됩니다."</p></div>
</div>

<h2 id="s3">질문은 "15분 규칙"과 템플릿으로</h2>
<p>모르는 게 생기면 <b>15분 정도는 혼자 찾아봅니다</b>(이 페이지, 검색, 매뉴얼). 그래도 막히면 아래 형식으로 정리해서 묻습니다. 하루 종일 혼자 붙잡는 것도, 아무것도 안 해 보고 바로 묻는 것도 좋지 않습니다.</p>
<pre class="code"><span class="c"># 질문 템플릿</span>
1. 하려던 것   : VM에 SSH로 접속하려고 했습니다.
2. 해 본 것    : ssh -i mykey.pem rocky@10.0.1.10 실행
3. 나온 결과   : Permission denied (publickey)   <span class="c">← 에러 메시지는 그대로 복사</span>
4. 내 추측     : 키 파일 권한 문제 같아서 chmod 600을 했는데 같습니다.
5. 질문       : 사용자 이름이 rocky가 맞는지 확인해 주실 수 있을까요?</pre>
<p>이 페이지의 <a href="#qnote">질문 노트</a>에 모아 두었다가 <b>하루 한 번 묶어서</b> 사수에게 물으면 서로 시간이 절약됩니다. 단, 고객 서비스에 영향을 주는 급한 문제는 바로 알립니다(에스컬레이션).</p>

<h2 id="s4">메일과 메신저, 파일 이름</h2>
<ul><li>메일 제목 앞에 성격을 붙입니다: <code>[보고]</code> <code>[요청]</code> <code>[공유]</code> <code>[질문]</code></li><li>메일 하나에 주제 하나. 본문 첫 줄에 용건(두괄식).</li><li>파일 이름은 날짜·주제·이름·버전을 넣습니다: <code>20261105_IT용어정리_홍길동_v02.docx</code></li><li>"최종", "진짜최종", "새 문서(3)" 같은 이름은 쓰지 않습니다.</li></ul>

<h2 id="s5">엔지니어의 기본 습관: 작업 로그</h2>
<p>실습이든 실제 업무든, 작업할 때마다 간단히 적습니다. 이 기록이 나중에 <b>설정 내역서, 구축 작업서, 보고서</b>(5~7주차 산출물)의 재료가 됩니다.</p>
<pre class="code">2026-11-05 14:10  VM 접속 시도: ssh rocky@10.0.1.10 → 시간 초과
2026-11-05 14:25  Security Group 확인 → 22번 포트 규칙 없음
2026-11-05 14:30  22번 허용 규칙 추가(내 IP만) → 접속 성공</pre>

<h2 id="s6">보안 기본: 신입이 가장 실수하기 쉬운 것</h2>
<div class="box warn"><span class="lbl">하지 않기</span><ul><li>비밀번호, SSH 개인키 파일, API 키를 메신저나 메일로 보내기</li><li>고객 정보나 고객 화면 캡처를 개인 기기·외부 서비스로 옮기기</li><li>자리를 비울 때 화면을 잠그지 않기</li><li>운영(실제 고객) 서버에서 확인 없이 명령어 실행하기. 특히 삭제 명령(<code>rm</code>)은 되돌릴 수 없습니다.</li></ul></div>
<p>보안의 기본 원칙은 <b>최소 권한</b>입니다. 일에 필요한 만큼만 권한을 갖고, 필요 없으면 쓰지 않습니다. 2주차 리눅스 계정·권한 수업이 바로 이 원칙을 기술로 구현하는 방법입니다.</p>

<h2 id="s7">1주차 산출물 만들기</h2>
<h3>필독서 과제 1</h3>
<p>책 한 권을 하루 20~30분씩 나눠 읽습니다. 하루 분량을 읽을 때마다 손노트에 세 줄만 적습니다.</p>
<pre class="code">[날짜 / 읽은 범위]
1. 핵심 내용 (한 줄)
2. 내 업무에 적용할 점 (한 줄)
3. 질문이나 생각 (한 줄)</pre>
<p>제출할 때는 이 세 줄 메모를 모아 <b>책 전체 요약 + 나에게 적용할 점 3가지</b>로 정리합니다.</p>
<h3>IT 용어 정리</h3>
<p>온라인 노트에 아래 표 형식으로 정리합니다. 이 페이지의 <a href="#cards">용어 카드</a> 화면에서 "전체 용어 복사"를 누르면 지금까지 배운 용어가 표 형식으로 복사됩니다. <mark>복사한 뒤 "내 비유" 칸은 반드시 직접 채우세요.</mark> 그 칸을 채우는 과정이 공부입니다.</p>
<div class="tbl-wrap"><table><thead><tr><th>용어</th><th>한 줄 정의</th><th>내 비유</th><th>관련 용어</th></tr></thead><tbody><tr><td>서버</td><td>요청을 받아 서비스를 돌려주는 컴퓨터</td><td>식당 주방</td><td>클라이언트, 데이터센터</td></tr></tbody></table></div>

<h2 id="s1">아키텍처와 구성도</h2>
<p><b>아키텍처</b>는 "무엇이 있고, 서로 어떻게 연결되어 있나"를 정리한 설계입니다. 엔지니어는 이것을 그림으로 그린 <b>구성도</b>로 대화합니다. 고객의 구축 요청을 받으면 가장 먼저 그리는 것도, 장애가 나면 가장 먼저 펼쳐 보는 것도 구성도입니다. 6주차 산출물인 "인프라 아키텍처 구성도"도 오늘 배우는 내용으로 그립니다.</p>
<p>구성도에는 보통 이런 약속이 있습니다. 회사마다 아이콘은 달라도 의미는 비슷합니다.</p>
<div class="tbl-wrap"><table><thead><tr><th>그림</th><th>뜻</th></tr></thead><tbody>
<tr><td>구름</td><td>인터넷(바깥 세상)</td></tr>
<tr><td>사각형 + 이름</td><td>서버 (Web 01, WAS 01 …)</td></tr>
<tr><td>원통</td><td>DB나 스토리지</td></tr>
<tr><td>점선 상자</td><td>네트워크 영역 (Public, Private, VPC 등)</td></tr>
<tr><td>화살표 + 숫자</td><td>요청이 가는 방향과 포트 번호 (예: → 443)</td></tr>
</tbody></table></div>
<p>오늘의 목표는 이 레슨 맨 끝에 있는 구성도를 <mark>안 보고 손으로 다시 그릴 수 있게</mark> 되는 것입니다.</p>

<h2 id="s2">인프라 3요소를 장비로 보기</h2>
<p>1주차에 배운 서버·네트워크·스토리지를 이번에는 <b>실제 장비와 역할</b>로 구체적으로 봅니다.</p>
<h3>서버: 일을 처리하는 컴퓨터</h3>
<p>물리 서버일 수도 있고 VM일 수도 있습니다. 실무에서는 <b>하는 일</b>로 이름을 붙입니다. 웹 서버, WAS 서버, DB 서버, 배치 서버(정해진 시간에 작업 실행), 모니터링 서버처럼요. 같은 컴퓨터라도 무엇을 설치하느냐에 따라 역할이 정해집니다.</p>
<h3>네트워크: 데이터를 실어 나르는 길</h3>
<div class="tbl-wrap"><table><thead><tr><th>장비</th><th>하는 일</th><th>비유</th></tr></thead><tbody>
<tr><td><b>스위치</b> (L2)</td><td>같은 네트워크 안의 장비들을 케이블로 연결</td><td>한 건물 안의 복도</td></tr>
<tr><td><b>라우터</b> (L3)</td><td>서로 다른 네트워크를 연결하고 목적지까지 길을 찾음</td><td>건물과 건물을 잇는 교차로와 표지판</td></tr>
<tr><td><b>방화벽</b></td><td>규칙에 따라 통신을 허용·차단</td><td>출입구 경비원</td></tr>
<tr><td><b>로드밸런서</b> (L4/L7)</td><td>들어온 요청을 여러 서버에 나눠 줌</td><td>은행 번호표 안내원</td></tr>
</tbody></table></div>
<p class="small muted">L2, L3 같은 숫자는 3주차에 배우는 "OSI 7계층"의 층 번호입니다. 지금은 "숫자가 클수록 더 많은 정보를 보고 판단한다" 정도로 알아 두세요.</p>
<h3>스토리지: 데이터를 오래 보관하는 곳</h3>
<div class="tbl-wrap"><table><thead><tr><th>방식</th><th>뜻</th><th>비유</th></tr></thead><tbody>
<tr><td><b>DAS</b></td><td>서버에 직접 꽂힌 디스크</td><td>내 책상 서랍</td></tr>
<tr><td><b>NAS</b></td><td>네트워크로 연결하는 공유 폴더 (파일 단위)</td><td>사무실 공용 캐비닛</td></tr>
<tr><td><b>SAN</b></td><td>전용 네트워크로 연결해 서버가 자기 디스크처럼 쓰는 저장소 (블록 단위)</td><td>창고를 통째로 빌려 내 창고처럼 쓰기</td></tr>
</tbody></table></div>
<p class="small muted">4주차(Storage 기초)와 7주차(zStorage)에서 자세히 배웁니다. DB 서버는 빠른 스토리지가 특히 중요하다는 것만 기억하세요.</p>

<h2 id="s3">요청과 응답: 웹사이트 하나가 동작하는 과정</h2>
<p>쇼핑몰에서 "내 주문 내역" 버튼을 누르면 무슨 일이 일어날까요?</p>
<div class="flow"><div class="n"><b>사용자</b><small>브라우저</small></div><span class="ar">→</span><div class="n"><b>인터넷</b><small>네트워크</small></div><span class="ar">→</span><div class="n k"><b>Web</b><small>:443</small></div><span class="ar">→</span><div class="n k"><b>WAS</b><small>:8080</small></div><span class="ar">→</span><div class="n k"><b>DB</b><small>:3306</small></div></div>
<ol>
<li>브라우저가 <code>https://shop.example.com/orders</code> 로 <b>HTTPS 요청</b>을 보냅니다. 서버 IP의 443번 포트로 갑니다.</li>
<li><b>웹 서버</b>가 요청을 받습니다. 암호화를 풀고, 요청한 것이 로고 이미지 같은 정적 파일이면 바로 돌려줍니다. 주문 내역처럼 계산이 필요한 요청이면 WAS(8080번 포트)로 넘깁니다.</li>
<li><b>WAS</b>가 "이 사람 로그인했나? 이 사람의 주문은?"을 계산하며 DB(3306번 포트)에 SQL로 물어봅니다.</li>
<li><b>DB</b>가 저장된 주문 데이터를 찾아 돌려줍니다.</li>
<li>WAS가 결과로 화면(HTML)이나 데이터(JSON)를 만들어 웹 서버에 주고, 웹 서버가 암호화해서 사용자에게 <b>응답</b>합니다.</li>
</ol>
<p>응답에는 결과를 알려 주는 <b>상태 코드</b>가 붙습니다. 장애 대응 때 자주 보니 대표적인 것만 알아 두세요.</p>
<div class="tbl-wrap"><table><thead><tr><th>코드</th><th>뜻</th><th>보통 어디 문제?</th></tr></thead><tbody>
<tr><td><code>200</code></td><td>성공</td><td>-</td></tr>
<tr><td><code>404</code></td><td>요청한 것이 없음</td><td>주소 오타, 파일 없음</td></tr>
<tr><td><code>500</code></td><td>서버 내부 오류</td><td>WAS 프로그램 오류인 경우가 많음</td></tr>
<tr><td><code>502</code> / <code>504</code></td><td>뒤쪽 서버 응답 이상 / 시간 초과</td><td>웹 서버는 살아 있는데 WAS가 죽었거나 느림</td></tr>
</tbody></table></div>

<h2 id="s4">Web 서버: 맨 앞에서 손님을 맞는 층</h2>
<p><b>웹 서버</b>는 사용자의 요청을 가장 먼저 받는 서버입니다. 하는 일은 크게 다섯 가지입니다.</p>
<ol>
<li><b>요청 접수</b>: 80(HTTP), 443(HTTPS) 포트에서 요청을 기다립니다.</li>
<li><b>정적 파일 제공</b>: 이미지, CSS, JavaScript, HTML 파일처럼 이미 만들어진 파일은 직접 빠르게 돌려줍니다.</li>
<li><b>WAS로 전달 (리버스 프록시)</b>: 계산이 필요한 요청은 뒤쪽 WAS에 대신 전달하고, 받은 결과를 사용자에게 돌려줍니다. 사용자는 WAS가 있는지도 모릅니다.</li>
<li><b>HTTPS 암호화 처리</b>: 인증서를 가지고 암호화·복호화를 맡습니다. (4주차 TLS)</li>
<li><b>접속 기록</b>: 누가 언제 무엇을 요청했는지 access log, 오류는 error log에 남깁니다.</li>
</ol>
<div class="tbl-wrap"><table><thead><tr><th>대표 소프트웨어</th><th>특징</th></tr></thead><tbody>
<tr><td><b>Nginx</b> (엔진엑스)</td><td>가볍고 동시 접속 처리에 강함. 요즘 가장 많이 씀. 5주차 실습에서 설치</td></tr>
<tr><td><b>Apache httpd</b></td><td>오래되고 기능이 많음. 리눅스 서비스 이름은 httpd</td></tr>
<tr><td><b>WebtoB</b></td><td>국내(티맥스) 제품. 공공기관·금융권에서 자주 보임</td></tr>
</tbody></table></div>
<p>Nginx 설정 파일 일부를 보면 웹 서버가 하는 일이 그대로 보입니다. 지금 문법을 외울 필요는 없고, 의미만 읽어 보세요.</p>
<pre class="code">server {
    listen 443 ssl;                          <span class="c"># 443번 포트에서 HTTPS 요청을 받는다</span>
    location /images/ {
        root /usr/share/nginx/html;          <span class="c"># 이미지는 이 디렉터리에서 직접 돌려준다 (정적)</span>
    }
    location / {
        proxy_pass http://10.0.2.11:8080;    <span class="c"># 나머지 요청은 WAS(10.0.2.11의 8080)로 넘긴다 (리버스 프록시)</span>
    }
}</pre>

<h2 id="s5">WAS: 계산하고 판단하는 층</h2>
<p><b>WAS(Web Application Server)</b>는 개발자가 만든 프로그램을 실행하는 서버입니다. "이 사람이 로그인했나?", "재고가 있나?", "할인을 적용하면 얼마지?" 같은 판단과 계산(<b>비즈니스 로직</b>)을 합니다.</p>
<ul>
<li><b>프로그램 실행</b>: Java, Python, Node.js 등으로 만든 애플리케이션을 돌립니다.</li>
<li><b>DB 연결 관리</b>: DB에 연결을 미리 여러 개 열어 두고 돌려 씁니다(커넥션 풀). 매번 새로 연결하면 느리기 때문입니다.</li>
<li><b>세션 관리</b>: "이 사용자는 로그인한 상태"라는 정보를 기억합니다.</li>
</ul>
<div class="tbl-wrap"><table><thead><tr><th>대표 소프트웨어</th><th>특징</th></tr></thead><tbody>
<tr><td><b>Apache Tomcat</b></td><td>Java WAS의 대표. 무료. 기본 포트 8080</td></tr>
<tr><td><b>JEUS</b></td><td>국내(티맥스) 제품. WebtoB와 짝으로 공공·금융권에서 많이 씀</td></tr>
<tr><td><b>WebLogic, JBoss(WildFly)</b></td><td>대기업용 Java WAS</td></tr>
<tr><td>Node.js, Python(Django 등) 앱</td><td>자바가 아닌 언어로 만든 앱 서버. 하는 역할은 같음</td></tr>
</tbody></table></div>
<h3>WAS도 웹 요청을 받을 수 있는데, 왜 웹 서버를 따로 둘까?</h3>
<ol>
<li><b>효율</b>: 이미지 같은 단순한 파일까지 WAS가 처리하면 비싼 계산 자원을 낭비합니다. 단순한 일은 웹 서버가 빠르게 처리합니다.</li>
<li><b>보안</b>: WAS를 인터넷에 직접 노출하지 않고 웹 서버 뒤에 숨깁니다.</li>
<li><b>분배</b>: 웹 서버가 여러 대의 WAS에 요청을 나눠 줄 수 있습니다.</li>
</ol>

<h2 id="s6">DB: 데이터를 기억하는 층</h2>
<p><b>데이터베이스(DB)</b>는 회원 정보, 상품, 주문 내역처럼 서비스가 기억해야 할 데이터를 체계적으로 저장하는 곳입니다. DB를 관리하는 소프트웨어를 <b>DBMS</b>라고 하지만, 보통 둘 다 "DB"라고 부릅니다.</p>
<div class="box analogy"><span class="lbl">비유로 보면</span>DB는 <b>엑셀 파일</b>과 비슷합니다. 시트 하나가 <b>테이블</b>, 가로 한 줄이 데이터 한 건(<b>행</b>), 세로 칸이 항목(<b>열</b>)입니다. 다만 엑셀과 달리 수천 명이 동시에 읽고 써도 데이터가 꼬이지 않도록 관리해 줍니다.</div>
<div class="tbl-wrap"><table><thead><tr><th>order_id</th><th>user_id</th><th>상품</th><th>금액</th><th>주문일</th></tr></thead><tbody>
<tr><td>5001</td><td>1001</td><td>키보드</td><td>59,000</td><td>2026-11-02</td></tr>
<tr><td>5002</td><td>1002</td><td>마우스</td><td>32,000</td><td>2026-11-03</td></tr>
</tbody></table></div>
<p>WAS는 <b>SQL</b>이라는 언어로 DB에 일을 시킵니다.</p>
<pre class="code">SELECT * FROM orders WHERE user_id = 1001;   <span class="c"># orders 테이블에서 1001번 회원의 주문을 모두 꺼내라</span></pre>
<h3>DB의 종류</h3>
<div class="tbl-wrap"><table><thead><tr><th>종류</th><th>대표 제품 (기본 포트)</th><th>특징</th></tr></thead><tbody>
<tr><td><b>관계형 (RDBMS)</b></td><td>MySQL·MariaDB (3306), PostgreSQL (5432), Oracle (1521), MS SQL Server (1433)</td><td>표 형태, SQL 사용. 주문·결제처럼 정확해야 하는 데이터</td></tr>
<tr><td><b>NoSQL</b></td><td>MongoDB, Redis</td><td>표가 아닌 형태. 대량·빠른 처리, 캐시 등</td></tr>
</tbody></table></div>
<h3>DB가 특별히 중요한 이유</h3>
<ul>
<li><b>정확성</b>: 계좌 이체에서 "출금은 됐는데 입금이 안 된" 상태가 생기면 안 됩니다. DB는 이런 작업을 <b>트랜잭션</b>으로 묶어 "전부 되거나 전부 취소"되게 합니다.</li>
<li><b>스토리지 성능</b>: DB는 디스크를 아주 많이 읽고 씁니다. 그래서 DB 서버에는 빠른 스토리지(높은 IOPS)를 붙입니다. Zadara zStorage 같은 스토리지가 활약하는 곳입니다.</li>
<li><b>백업과 이중화</b>: 서버는 다시 만들 수 있어도 데이터는 잃으면 끝입니다. 그래서 DB는 백업을 하고, 보통 <b>Active(주)–Standby(대기)</b> 두 대로 구성해 데이터를 계속 복제(Replication)합니다.</li>
</ul>

<h2 id="s7">1-Tier, 2-Tier, 3-Tier 비교</h2>
<div class="tbl-wrap"><table><thead><tr><th>구조</th><th>모양</th><th>장점</th><th>단점</th><th>예</th></tr></thead><tbody>
<tr><td><b>1-Tier</b></td><td>한 대에 화면·로직·데이터 전부</td><td>단순, 저렴</td><td>한 대가 죽으면 끝, 확장 불가</td><td>개인 PC 프로그램, 테스트 서버</td></tr>
<tr><td><b>2-Tier</b></td><td>클라이언트(또는 Web+WAS 한 대) ↔ DB</td><td>데이터는 분리됨</td><td>앞단이 무겁고 보안·확장에 한계</td><td>소규모 사내 시스템</td></tr>
<tr><td><b>3-Tier</b></td><td>Web ↔ WAS ↔ DB</td><td>보안·확장·장애 격리</td><td>구성이 복잡, 서버가 많음</td><td>대부분의 기업 웹 서비스</td></tr>
</tbody></table></div>
<div class="box analogy"><span class="lbl">비유로 보면 (식당)</span><b>홀 직원(Web)</b>이 주문을 받고, 물·반찬처럼 이미 준비된 것은 바로 가져다줍니다(정적). 요리가 필요한 주문은 <b>주방(WAS)</b>에 넘깁니다. 주방은 <b>창고·냉장고(DB)</b>에서 재료를 꺼내 요리합니다. 손님은 주방이나 창고에 직접 들어갈 수 없습니다. 1-Tier는 혼자 주문받고 요리하고 장보는 포장마차입니다.</div>
<div class="tbl-wrap"><table><thead><tr><th>계층</th><th>다른 이름</th><th>하는 일</th><th>대표 SW</th><th>기본 포트</th></tr></thead><tbody>
<tr><td><b>Web</b></td><td>Presentation</td><td>요청 접수, 정적 파일, WAS 전달</td><td>Nginx, Apache, WebtoB</td><td>80, 443</td></tr>
<tr><td><b>WAS</b></td><td>Application</td><td>비즈니스 로직 실행</td><td>Tomcat, JEUS</td><td>8080 (흔한 값)</td></tr>
<tr><td><b>DB</b></td><td>Data</td><td>데이터 저장·조회</td><td>MySQL, PostgreSQL, Oracle</td><td>3306, 5432, 1521</td></tr>
</tbody></table></div>

<h2 id="s8">왜 굳이 나눌까</h2>
<ol>
<li><b>보안</b>: DB에는 가장 중요한 데이터가 있습니다. 그래서 DB는 인터넷에서 직접 닿지 않는 <b>내부망(Private)</b>에 두고, WAS만 DB에 접근하게 합니다.</li>
<li><b>확장</b>: 손님이 몰리면 부족한 층만 늘리면 됩니다. 예: 웹 서버만 2대에서 4대로.</li>
<li><b>장애 격리</b>: 한 층에 문제가 생겨도 원인을 찾기 쉽고 다른 층에 영향이 덜 갑니다. 예: 502 오류 → WAS 쪽부터 확인.</li>
<li><b>역할별 관리</b>: 웹, 애플리케이션, DB 담당이 각자 맡은 부분을 관리하고 따로 업데이트합니다.</li>
</ol>
<div class="zones">
<div><h5>PUBLIC 영역 (인터넷에서 접근)</h5><b>로드밸런서</b><br><span class="muted small">외부 요청의 유일한 입구</span></div>
<div><h5>PRIVATE 영역</h5><b>Web · WAS</b><br><span class="muted small">LB를 거친 요청만 받음</span></div>
<div><h5>PRIVATE 영역 (가장 안쪽)</h5><b>DB</b><br><span class="muted small">WAS만 접근 가능</span></div>
</div>
<p class="small muted">이 Public/Private 구분은 3주차(네트워크)와 6주차 과제 3("Public/Private Subnet 구분")에서 직접 구성합니다.</p>

<h2 id="s9">이중화, SPOF, 로드밸런서</h2>
<p>웹 서버가 1대뿐이면 그 서버가 고장 나는 순간 서비스 전체가 멈춥니다. 이렇게 <mark>하나가 망가지면 전체가 멈추는 지점을 SPOF</mark>라고 합니다. 해결책은 같은 역할을 2대 이상 두는 <b>이중화</b>입니다.</p>
<p>서버가 2대면 사용자는 어디로 접속해야 할까요? 앞에 <b>로드밸런서(LB)</b>를 둡니다. LB는 요청을 서버들에 나눠 주고, 몇 초마다 각 서버에 "살아 있니?"라고 확인(<b>Health Check</b>)해서 응답이 없는 서버로는 보내지 않습니다.</p>
<div class="flow"><div class="n"><b>사용자</b></div><span class="ar">→</span><div class="n k"><b>LB</b><small>나눠 주기</small></div><span class="ar">→</span><div class="n"><b>Web 1</b><small>정상</small></div><div class="n" style="opacity:.55"><b>Web 2</b><small>고장 → 제외</small></div></div>
<h3>계층마다 SPOF 점검하기</h3>
<div class="tbl-wrap"><table><thead><tr><th>계층</th><th>SPOF를 없애는 방법</th></tr></thead><tbody>
<tr><td>LB</td><td>LB 자체도 2대(또는 클라우드의 관리형 LB 사용)</td></tr>
<tr><td>Web</td><td>2대 이상 + LB로 분배</td></tr>
<tr><td>WAS</td><td>2대 이상 + 웹 서버나 내부 LB가 분배</td></tr>
<tr><td>DB</td><td>Active–Standby 2대 + 데이터 복제, 정기 백업</td></tr>
<tr><td>네트워크·전원</td><td>스위치·회선·전원 이중화 (데이터센터·클라우드가 담당)</td></tr>
</tbody></table></div>
<h3>Scale-up과 Scale-out</h3>
<ul><li><b>Scale-up(수직 확장)</b>: 서버 한 대를 더 좋게(CPU·메모리 증설). 간단하지만 한계가 있고, 여전히 1대라 SPOF. DB에 자주 씀.</li><li><b>Scale-out(수평 확장)</b>: 같은 서버를 여러 대로. LB와 함께 쓰며, Web·WAS에 주로 씀. 클라우드의 오토스케일링이 이것을 자동으로 해 줍니다.</li></ul>
<p>6주차 실습 과제 2가 정확히 이것입니다. "웹 서버 2대 + LB를 만들고, 1대를 멈춰도 서비스가 계속되는지 확인하기."</p>

<h2 id="s10">종합: 구성도 한 장으로 정리</h2>
<p>아래는 오늘 배운 것을 모두 합친 전형적인 웹 서비스 구성도입니다. 손노트에 <b>직접 따라 그린 뒤, 다음 날 안 보고 다시 그려 보세요.</b></p>
<div class="tree">                 [ 인터넷 / 사용자 ]
                          │  HTTPS 443
               ┌──────────▼──────────┐   <span class="c">PUBLIC 영역</span>
               │   Load Balancer     │
               └─────┬─────────┬─────┘
          ┌──────────┼─────────┼──────────────────────┐ <span class="c">PRIVATE 영역</span>
          │    ┌─────▼───┐ ┌───▼─────┐                │
          │    │ Web 01  │ │ Web 02  │  <span class="c">Nginx :80</span>     │
          │    └─────┬───┘ └───┬─────┘                │
          │          │  8080   │                      │
          │    ┌─────▼───┐ ┌───▼─────┐                │
          │    │ WAS 01  │ │ WAS 02  │  <span class="c">Tomcat :8080</span>  │
          │    └─────┬───┘ └───┬─────┘                │
          │          │  3306   │                      │
          │    ┌─────▼─────────▼─────┐                │
          │    │ DB (Active) ⇄ (Standby)│ <span class="c">MySQL :3306</span> │
          │    └──────────┬──────────┘                │
          │               │ 스토리지 연결 (Block)       │
          │        [ 스토리지 / 백업 ]                  │
          └───────────────────────────────────────────┘</div>
<p>구성도를 그릴 때 빠뜨리지 말아야 할 것: <b>① 사용자 진입점 ② 계층별 서버와 대수 ③ 화살표 방향과 포트 ④ Public/Private 영역 ⑤ 이중화 표시 ⑥ 스토리지·백업</b>.</p>

summary:['인프라 장비: 서버(역할별 이름) · 네트워크(스위치·라우터·방화벽·LB) · 스토리지(DAS·NAS·SAN).','요청 흐름: 사용자 → 인터넷 → Web(443) → WAS(8080) → DB(3306), 응답은 거꾸로. 상태 코드 200·404·500·502.','Web = 요청 접수, 정적 파일, WAS로 전달(리버스 프록시), HTTPS, 로그 (Nginx·Apache·WebtoB).','WAS = 비즈니스 로직, DB 연결 관리, 세션 (Tomcat·JEUS). DB = 테이블·SQL·트랜잭션, 백업과 Active-Standby (MySQL·PostgreSQL·Oracle).','3-Tier로 나누는 이유: 보안(DB는 가장 안쪽) · 확장 · 장애 격리 · 역할별 관리.','SPOF는 이중화로 없앤다. 여러 대 앞에 LB(Health Check). Scale-up = 한 대 키움, Scale-out = 대수 늘림.'],
essay:[
{q:'쇼핑몰에서 "주문하기" 버튼을 눌렀을 때부터 완료 화면이 뜰 때까지, Web·WAS·DB가 각각 무엇을 하는지 포트 번호와 함께 순서대로 설명해 보세요.',a:'브라우저가 HTTPS(443)로 주문 요청을 보내면 웹 서버가 받아 암호화를 풀고, 계산이 필요한 요청이므로 WAS(8080)로 전달한다. WAS는 로그인 여부, 재고, 결제 금액을 계산하고 SQL로 DB(3306)에 주문 데이터를 저장한다. DB는 트랜잭션으로 정확히 저장한 뒤 결과를 돌려준다. WAS가 완료 화면을 만들어 웹 서버에 주고, 웹 서버가 사용자에게 응답한다.'},

body:`
<h2 id="s1">서버는 "24시간 일하는 튼튼한 컴퓨터"</h2>
<p>서버 안의 부품은 노트북과 종류가 같습니다. 다른 점은 <b>멈추지 않도록</b> 만들어졌다는 것입니다.</p>
<div class="tbl-wrap"><table><thead><tr><th></th><th>내 노트북</th><th>서버</th></tr></thead><tbody>
<tr><td>사용 시간</td><td>하루 몇 시간</td><td>24시간 365일</td></tr>
<tr><td>부품 이중화</td><td>없음</td><td>전원(PSU)·디스크·NIC를 2개씩</td></tr>
<tr><td>메모리</td><td>일반 메모리</td><td>오류를 스스로 고치는 ECC 메모리, 수백 GB까지</td></tr>
<tr><td>관리</td><td>앞에 앉아서</td><td>원격으로. 꺼져 있어도 BMC(iDRAC·iLO)로 켜고 화면을 봄</td></tr>
<tr><td>모양</td><td>노트북</td><td>랙에 꽂는 납작한 형태. 높이는 1U(≈4.45cm), 2U …</td></tr>
</tbody></table></div>

<h2 id="s2">4대 부품: 주방으로 이해하기</h2>
<div class="box analogy"><span class="lbl">비유로 보면</span><b>CPU</b>는 요리사, <b>메모리</b>는 조리대, <b>디스크</b>는 냉장고·창고, <b>NIC</b>는 주문이 들어오고 음식이 나가는 배달 창구입니다.</div>
<div class="tbl-wrap"><table><thead><tr><th>부품</th><th>하는 일</th><th>주로 보는 숫자</th><th>부족하면</th></tr></thead><tbody>
<tr><td><b>CPU</b></td><td>계산</td><td>코어 수, 스레드 수, 클럭(GHz)</td><td>처리가 느려지고 요청이 밀린다</td></tr>
<tr><td><b>메모리</b></td><td>작업 중인 데이터를 잠깐 올려 둠</td><td>GB (16, 64, 512 …)</td><td>스왑을 써서 매우 느려지거나, 프로그램이 강제 종료된다</td></tr>
<tr><td><b>디스크</b></td><td>데이터를 오래 보관</td><td>용량(GB·TB), IOPS, 처리량</td><td>저장이 안 되거나, 읽기·쓰기가 느리다</td></tr>
<tr><td><b>NIC</b></td><td>네트워크 연결</td><td>속도(Gbps), 포트 수</td><td>통신이 느리거나 끊긴다</td></tr>
</tbody></table></div>

<h2 id="s3">CPU: 소켓, 코어, 스레드</h2>
<p>CPU 성능은 "몇 명이(코어), 얼마나 빨리(클럭)" 일하느냐로 봅니다.</p>
<ul>
<li><b>소켓</b>: 메인보드에 CPU를 꽂는 자리. 서버는 CPU를 1~2개(소켓 1~2개) 꽂습니다.</li>
<li><b>코어</b>: CPU 안에 들어 있는 실제 계산 단위. 요리사의 수입니다. 서버 CPU는 한 개에 16~64코어 이상도 흔합니다.</li>
<li><b>스레드</b>: 코어 하나가 동시에 처리하는 작업 흐름. 하이퍼스레딩(SMT) 기술로 보통 코어 1개 = 스레드 2개. 요리사 한 명이 양손을 쓰는 것과 비슷합니다.</li>
<li><b>클럭(GHz)</b>: 요리사의 손 빠르기. 3.0GHz는 1초에 30억 번 박자를 칩니다.</li>
</ul>
<div class="box mem"><span class="lbl">계산해 보기</span><p>CPU 2개(소켓 2) × 각 16코어 × 코어당 2스레드 = <b>논리 CPU 64개</b>. 리눅스의 <code>nproc</code>, <code>lscpu</code> 명령으로 보이는 숫자가 이 "논리 CPU" 수입니다. 클라우드의 <b>vCPU 1개는 보통 이 논리 CPU(스레드) 1개</b>에 해당합니다.</p></div>
<p>서버용 CPU는 Intel <b>Xeon</b>, AMD <b>EPYC</b>가 대표적입니다. 요즘은 ARM 계열 서버 CPU도 쓰입니다.</p>

<h2 id="s4">메모리: 넓은 조리대</h2>
<p>프로그램은 디스크에 저장되어 있다가, 실행되면 <b>메모리로 올라와서</b> 동작합니다. 메모리는 디스크보다 수천 배 이상 빠르지만, <mark>전원이 꺼지면 내용이 사라집니다(휘발성)</mark>.</p>
<p>메모리가 모자라면 이런 순서로 문제가 커집니다.</p>
<ol>
<li>리눅스는 남는 메모리를 파일 캐시(buff/cache)로 쓰다가, 필요하면 비워서 내줍니다. 여기까지는 정상입니다.</li>
<li>그래도 모자라면 디스크 일부를 메모리처럼 쓰는 <b>스왑(Swap)</b>을 씁니다. 디스크는 느려서 서버 전체가 굼떠집니다.</li>
<li>스왑까지 모자라면 리눅스의 <b>OOM Killer</b>가 메모리를 많이 쓰는 프로그램을 강제로 종료시킵니다. 갑자기 서비스가 죽는 원인 중 하나입니다.</li>
</ol>
<p>메모리 사용량은 일차 05에서 <code>free -h</code>, <code>top</code> 명령으로 직접 확인합니다.</p>

<h2 id="s5">디스크: 냉장고와 창고</h2>
<div class="tbl-wrap"><table><thead><tr><th>종류</th><th>원리</th><th>속도</th><th>용량당 가격</th><th>주 용도</th></tr></thead><tbody>
<tr><td><b>HDD</b></td><td>회전하는 원판에 자기로 기록</td><td>느림</td><td>쌈</td><td>대용량 보관, 백업</td></tr>
<tr><td><b>SSD (SATA/SAS)</b></td><td>반도체(플래시)에 기록</td><td>빠름</td><td>중간</td><td>일반 서버, OS</td></tr>
<tr><td><b>NVMe SSD</b></td><td>PCIe로 CPU에 가깝게 연결한 SSD</td><td>매우 빠름</td><td>비쌈</td><td>DB, 고성능 스토리지</td></tr>
</tbody></table></div>
<p>스토리지 성능은 용량만으로 말하지 않습니다. 이 세 숫자를 함께 봅니다.</p>
<ul>
<li><b>IOPS</b>: 1초에 몇 번 읽고 쓸 수 있나. 작은 데이터를 자주 읽고 쓰는 DB에 중요.</li>
<li><b>처리량(Throughput, MB/s)</b>: 1초에 얼마나 많은 양을 옮기나. 동영상·백업처럼 큰 파일에 중요.</li>
<li><b>지연시간(Latency, ms)</b>: 요청 하나에 답이 오기까지 걸리는 시간. 짧을수록 좋음.</li>
</ul>
<div class="box analogy"><span class="lbl">비유로 보면 (택배)</span>IOPS는 하루에 배달하는 <b>건수</b>, 처리량은 하루에 나르는 <b>무게</b>, 지연시간은 주문부터 도착까지 <b>걸리는 시간</b>입니다.</div>
<p>서버는 디스크 고장에 대비해 여러 디스크를 묶는 <b>RAID</b>를 씁니다(예: 두 디스크에 똑같이 기록하는 RAID 1). 4주차 Storage 기초에서 자세히 배웁니다.</p>

<h2 id="s6">NIC: 배달 창구</h2>
<ul>
<li><b>속도</b>: 1Gbps, 10Gbps, 25Gbps, 100Gbps. 데이터센터 서버는 10G 이상이 흔합니다.</li>
<li><b>포트 여러 개와 본딩</b>: NIC 포트 2개를 묶어(본딩) 하나가 끊겨도 통신이 이어지게 하거나, 속도를 합칩니다.</li>
<li><b>망 분리</b>: 서비스용, 관리용(BMC), 스토리지용 네트워크를 서로 다른 NIC로 나누기도 합니다. 스토리지 트래픽이 서비스 트래픽을 방해하지 않게 하기 위해서입니다.</li>
<li>NIC마다 고유한 하드웨어 주소(<b>MAC 주소</b>)가 있습니다. IP 주소와의 관계는 3주차에 배웁니다.</li>
</ul>

<h2 id="s7">서버 사양서 읽기: 물리 서버의 자원과 역할</h2>
<p>실무에서는 이런 사양표를 자주 봅니다. 한 줄씩 읽어 보세요.</p>
<div class="tbl-wrap"><table><thead><tr><th>항목</th><th>사양</th><th>해석</th></tr></thead><tbody>
<tr><td>폼팩터</td><td>2U 랙 서버</td><td>랙에서 2칸(약 9cm) 차지</td></tr>
<tr><td>CPU</td><td>Xeon 2소켓 × 24코어, 2.8GHz</td><td>48코어, 하이퍼스레딩으로 논리 CPU 96개</td></tr>
<tr><td>메모리</td><td>DDR5 ECC 512GB</td><td>VM 수십 대에 나눠 줄 만큼 큰 조리대</td></tr>
<tr><td>디스크</td><td>NVMe SSD 3.84TB × 4</td><td>빠른 디스크 4개. RAID로 묶어 쓰면 실제 용량은 줄어듦</td></tr>
<tr><td>NIC</td><td>25GbE × 2 (본딩), 1GbE 관리 포트</td><td>서비스용 25G 2개 이중화 + BMC 관리용</td></tr>
<tr><td>전원</td><td>PSU 1600W × 2 (이중화)</td><td>전원 장치 하나가 고장 나도 계속 동작</td></tr>
</tbody></table></div>
<p>이런 서버 한 대를 <b>통째로 웹 서버 하나에 쓰면 대부분 놉니다.</b> 그래서 등장한 것이 가상화입니다.</p>

<h2 id="s8">가상화가 왜 필요할까</h2>
<p>예전에는 "서비스 하나에 물리 서버 한 대"였습니다. 웹 서버 한 대, DB 서버 한 대, 메일 서버 한 대… 그런데 대부분의 서버가 하루 대부분을 놀고 있었습니다. 성능 좋은 서버를 사 놓고 일부만 쓰니 돈·전기·공간·관리 인력이 낭비됐고, 새 서버가 필요하면 장비를 주문해서 몇 주를 기다려야 했습니다.</p>
<p><b>가상화</b>는 물리 서버 한 대를 소프트웨어로 나눠서 <mark>여러 대의 가상 서버(VM)처럼</mark> 쓰는 기술입니다. VM은 각자 자기만의 CPU·메모리·디스크·NIC를 가진 것처럼 동작하고, 서로 격리되어 있어서 옆 VM이 무엇을 하는지 모릅니다.</p>
<div class="flow"><div class="n"><b>가상화 전</b><small>서버 3대, 각각 사용률 10~20%</small></div><span class="ar">→</span><div class="n k"><b>가상화 후</b><small>서버 1대에 VM 3대, 사용률 60%</small></div></div>

<h2 id="s9">하이퍼바이저: 자원을 나눠 주는 관리자</h2>
<p><b>하이퍼바이저(Hypervisor)</b>는 물리 서버 위에서 VM들을 만들고 돌리는 소프트웨어입니다. 하는 일은 네 가지입니다.</p>
<ol>
<li><b>자원 분배</b>: 물리 CPU·메모리·디스크·NIC를 VM들에게 나눠 주고, 서로 차례를 정해 줍니다(스케줄링).</li>
<li><b>격리</b>: VM끼리 서로의 메모리나 디스크를 볼 수 없게 막습니다. 한 VM이 죽어도 다른 VM은 영향받지 않습니다.</li>
<li><b>가상 장치 제공</b>: 각 VM에게 가상 CPU(vCPU), 가상 메모리, 가상 디스크, 가상 NIC를 진짜 장치처럼 보여 줍니다. VM끼리는 하이퍼바이저 안의 <b>가상 스위치</b>로 연결됩니다.</li>
<li><b>생명주기 관리</b>: VM 생성, 시작, 정지, 삭제, 스냅샷, 다른 서버로 이동.</li>
</ol>
<div class="tbl-wrap"><table><thead><tr><th>종류</th><th>설치 위치</th><th>예</th><th>주로 쓰는 곳</th></tr></thead><tbody>
<tr><td><b>Type 1</b> (베어메탈)</td><td>물리 서버 위에 바로. 하이퍼바이저가 곧 OS 역할</td><td>KVM, VMware ESXi, Microsoft Hyper-V, Xen</td><td>데이터센터, 클라우드</td></tr>
<tr><td><b>Type 2</b> (호스트형)</td><td>Windows·macOS 같은 OS 위에 프로그램처럼</td><td>VirtualBox, VMware Workstation</td><td>개인 PC에서 연습·테스트</td></tr>
</tbody></table></div>
<p><b>KVM</b>은 리눅스 커널에 들어 있는 오픈소스 하이퍼바이저로, 많은 클라우드와 오픈소스 가상화 플랫폼의 기반입니다. <b>VMware ESXi</b>는 기업 데이터센터에서 오래 쓰여 온 상용 제품입니다.</p>

<h2 id="s10">계층 구조: 서버 · Hypervisor · VM</h2>
<div class="layers">
<div><b>애플리케이션</b><span>Nginx, Tomcat, MySQL…</span></div>
<div><b>게스트 OS</b><span>VM마다 따로 설치 (Linux, Windows)</span></div>
<div class="l1"><b>VM 1 · VM 2 · VM 3</b><span>vCPU · vRAM · 가상 디스크 · vNIC</span></div>
<div class="l1"><b>하이퍼바이저</b><span>KVM, VMware ESXi, Hyper-V</span></div>
<div class="l0"><b>물리 서버 (호스트)</b><span>CPU · 메모리 · 디스크 · NIC</span></div>
</div>
<div class="box analogy"><span class="lbl">비유로 보면</span><b>건물</b>(물리 서버) 안에 <b>관리사무소</b>(하이퍼바이저)가 있고, 관리사무소가 공간과 전기·수도를 나눠 <b>여러 호실</b>(VM)을 만듭니다. 각 호실에는 <b>입주자</b>(게스트 OS와 앱)가 따로 삽니다. 옆 호실 사람이 내 방에 들어올 수 없습니다(격리).</div>
<h3>계층마다 누가 관리할까 (클라우드 기준)</h3>
<div class="tbl-wrap"><table><thead><tr><th>계층</th><th>관리 주체 (IaaS, 예: Zadara zCompute)</th></tr></thead><tbody>
<tr><td>앱, 게스트 OS</td><td><b>고객</b>: OS 업데이트, 앱 설치, 계정·권한, 방화벽 규칙</td></tr>
<tr><td>VM 설정</td><td><b>고객</b>이 콘솔에서 선택 (vCPU 수, 메모리, 디스크, 네트워크)</td></tr>
<tr><td>하이퍼바이저, 물리 서버</td><td><b>클라우드 사업자</b>: 장비 교체, 하이퍼바이저 관리, 장애 시 VM 이동</td></tr>
</tbody></table></div>
<p>1주차에 배운 IaaS 표가 바로 이 이야기입니다. 이 경계가 4주차의 "책임 공유 모델"입니다.</p>

<h2 id="s11">VM을 만들 때 고르는 것</h2>
<ul>
<li><b>vCPU 수와 메모리</b>: 클라우드에서는 <b>인스턴스 타입</b>이라는 규격으로 묶여 있습니다. 예: 2 vCPU + 4GB (작은 웹 서버), 8 vCPU + 32GB (DB).</li>
<li><b>디스크(볼륨)</b>: OS가 들어갈 부팅 디스크 + 필요하면 데이터 디스크를 추가로 붙입니다. VM 입장에서는 <code>/dev/vda</code>, <code>/dev/vdb</code> 같은 진짜 디스크로 보입니다(일차 06).</li>
<li><b>이미지</b>: 어떤 OS를 설치된 상태로 시작할지 고르는 틀 (Rocky Linux 9, Ubuntu 24.04 …).</li>
<li><b>네트워크</b>: 어떤 가상 네트워크(VPC, Subnet)에 연결할지, 어떤 방화벽 규칙(Security Group)을 적용할지.</li>
</ul>
<p><b>오버커밋</b>: 하이퍼바이저는 실제 물리 자원보다 많은 vCPU를 나눠 줄 수 있습니다. 모든 VM이 동시에 CPU를 100% 쓰지는 않는다는 가정입니다. 너무 많이 나누면 모든 VM이 함께 느려집니다.</p>
<div class="box warn"><span class="lbl">헷갈리기 쉬운 점</span><p>VM을 많이 만든다고 물리 CPU 성능이 늘어나는 것은 아닙니다. 물리 서버의 자원을 <b>나눠 쓰는 것</b>일 뿐입니다.</p></div>

<h2 id="s12">가상화로 얻는 기능</h2>
<div class="tbl-wrap"><table><thead><tr><th>기능</th><th>뜻</th><th>어디서 다시 나오나</th></tr></thead><tbody>
<tr><td><b>빠른 생성</b></td><td>장비 주문 없이 몇 분 만에 VM 생성</td><td>5주차 VM 생성</td></tr>
<tr><td><b>이미지·템플릿</b></td><td>잘 설치된 VM을 틀로 저장해 똑같이 찍어 냄</td><td>5주차 Image</td></tr>
<tr><td><b>스냅샷</b></td><td>특정 시점의 상태를 저장하고 되돌리기</td><td>4주차, 7주차</td></tr>
<tr><td><b>라이브 마이그레이션</b></td><td>실행 중인 VM을 멈추지 않고 다른 물리 서버로 옮김 (장비 점검 때)</td><td>클라우드 사업자 운영</td></tr>
<tr><td><b>HA (고가용성)</b></td><td>물리 서버가 고장 나면 그 위의 VM을 다른 서버에서 자동 재시작</td><td>클라우드 사업자 운영</td></tr>
</tbody></table></div>

<h2 id="s13">VM과 컨테이너</h2>
<div class="tbl-wrap"><table><thead><tr><th></th><th>VM</th><th>컨테이너</th></tr></thead><tbody>
<tr><td>격리 단위</td><td>OS까지 통째로 (게스트 OS가 따로 있음)</td><td>앱과 실행 환경만 (호스트 OS의 커널을 공유)</td></tr>
<tr><td>크기·시작 시간</td><td>GB 단위, 수십 초~분</td><td>MB 단위, 수 초</td></tr>
<tr><td>대표 기술</td><td>KVM, ESXi</td><td>Docker, Kubernetes</td></tr>
<tr><td>비유</td><td>아파트 각 호실 (벽, 수도, 전기가 따로)</td><td>공유 오피스의 칸막이 자리 (건물 설비는 공유)</td></tr>
</tbody></table></div>
<p class="small muted">Zadara zCompute는 VM과 함께 Kubernetes도 제공합니다. 컨테이너는 OJT 이후에 따로 배웁니다.</p>

<h2 id="s14">계층으로 생각하기: "VM이 느려요"</h2>
<p>고객이 "VM이 느리다"고 하면 엔지니어는 계층별로 나눠서 봅니다.</p>
<ol>
<li><b>앱·게스트 OS</b>: VM 안에서 <code>top</code>, <code>free</code>, <code>df</code>로 CPU·메모리·디스크 사용량 확인 (일차 05·06). 대부분 여기서 원인이 나옵니다.</li>
<li><b>VM 설정</b>: vCPU·메모리가 서비스에 비해 너무 작은지 확인 → 인스턴스 타입 키우기(Scale-up).</li>
<li><b>하이퍼바이저·물리 서버</b>: 같은 물리 서버의 다른 VM들이 자원을 많이 쓰는지, 디스크 지연이 큰지 → 클라우드 사업자(운영팀) 영역.</li>
</ol>
`,
summary:['서버 = 24시간용: 부품 이중화(PSU·디스크·NIC), ECC 메모리, BMC 원격 관리, 랙 U 단위.','CPU = 요리사: 소켓 × 코어 × 스레드 = 논리 CPU. vCPU 1개 ≈ 논리 CPU 1개.','메모리 = 조리대(휘발성). 모자라면 캐시 축소 → 스왑(느려짐) → OOM Killer(강제 종료).','디스크 = 창고: HDD < SSD < NVMe. 성능은 IOPS·처리량·지연시간. NIC = 창구: Gbps, 본딩으로 이중화.','하이퍼바이저 = 자원 분배·격리·가상 장치 제공·VM 관리. Type 1(KVM·ESXi·Hyper-V) vs Type 2(VirtualBox).','계층: 물리 서버 → 하이퍼바이저 → VM → 게스트 OS → 앱. IaaS에서 VM 위는 고객, 하이퍼바이저 아래는 사업자.'],
essay:[
{q:'CPU·메모리·디스크·NIC를 식당 주방에 비유해서 각각 설명하고, 각각 부족할 때 어떤 증상이 생기는지 말해 보세요.',a:'CPU는 요리사로, 부족하면 처리가 느려지고 요청이 밀린다. 메모리는 조리대로, 부족하면 스왑을 써서 서버 전체가 느려지고 심하면 OOM Killer가 프로그램을 강제 종료한다. 디스크는 냉장고·창고로, 용량이 차면 저장이 안 되고 IOPS가 부족하면 읽기·쓰기가 느리다. NIC는 배달 창구로, 속도가 부족하거나 끊기면 통신이 느려지거나 끊긴다.'},
{q:'"Xeon 2소켓 × 16코어(하이퍼스레딩), 256GB ECC, NVMe 1.92TB × 2, 25GbE × 2" 사양을 읽고 설명해 보세요. 논리 CPU는 몇 개인가요?',a:'CPU가 2개 꽂혀 있고 각각 16코어라 물리 코어 32개, 하이퍼스레딩으로 코어당 2스레드라 논리 CPU 64개다. 메모리는 오류를 고치는 ECC 256GB, 디스크는 빠른 NVMe SSD 1.92TB 2개(RAID 1로 묶으면 실제 1.92TB), 네트워크는 25Gbps 포트 2개로 본딩해 이중화할 수 있다.'},
{q:'가상화가 없던 시절의 문제점과, 하이퍼바이저가 하는 일 네 가지를 설명해 보세요.',a:'예전엔 서비스 하나에 물리 서버 한 대를 써서 서버가 대부분 놀았고 돈·전기·공간이 낭비됐으며, 새 서버를 받으려면 몇 주를 기다려야 했다. 하이퍼바이저는 ① 물리 자원을 VM들에게 나눠 주고 ② VM끼리 격리하며 ③ 각 VM에 vCPU·가상 디스크·vNIC 같은 가상 장치를 보여 주고 ④ VM 생성·정지·스냅샷·이동을 관리한다.'},
{q:'물리 서버·하이퍼바이저·VM·게스트 OS·앱 계층을 아래에서 위로 설명하고, 클라우드(IaaS)에서 각 계층을 누가 관리하는지 말해 보세요.',a:'맨 아래 물리 서버(건물)가 있고, 그 위의 하이퍼바이저(관리사무소)가 자원을 나눠 VM(호실)을 만든다. 각 VM 안에 게스트 OS가 설치되고, 그 위에서 Nginx 같은 앱이 돈다. IaaS에서 물리 서버와 하이퍼바이저는 클라우드 사업자가 관리하고, VM 설정 선택과 게스트 OS·앱·계정·방화벽 규칙은 고객이 관리한다.'}

body:`
<h2 id="s1">리눅스란</h2>
<p>1970년대에 <b>유닉스(UNIX)</b>라는 서버용 운영체제가 있었습니다. 안정적이었지만 비싸고 자유롭게 쓸 수 없었습니다. 1991년 핀란드 대학생 <b>리누스 토르발스</b>가 유닉스와 비슷하게 동작하는 <b>커널</b>을 만들어 무료로 공개했고, 전 세계 개발자들이 함께 키웠습니다. 이것이 <b>리눅스</b>입니다.</p>
<h3>서버에서 리눅스를 쓰는 이유</h3>
<ul>
<li><b>무료·오픈소스</b>: 서버 수백 대에 설치해도 라이선스 비용이 없습니다(기업용 지원 계약은 별도).</li>
<li><b>안정성</b>: 몇 달, 몇 년씩 재부팅 없이 돌아가는 서버가 흔합니다.</li>
<li><b>가볍다</b>: 화면(GUI) 없이 꼭 필요한 것만 설치할 수 있습니다.</li>
<li><b>원격 관리와 자동화</b>: 모든 것을 명령어로 할 수 있어 SSH로 원격 관리하고 스크립트로 자동화하기 좋습니다.</li>
</ul>
<p>그래서 <mark>서버와 클라우드 VM 대부분이 리눅스</mark>입니다. 5주차에 zCompute에서 만드는 VM도 리눅스입니다.</p>
<h3>배포판</h3>
<p>커널만으로는 쓸 수 없어서, 커널에 셸·명령어·패키지 관리자 등을 묶어 완성한 제품을 <b>배포판</b>이라고 합니다. 기업 서버에서 자주 보는 것은 두 계열입니다.</p>
<div class="tbl-wrap"><table><thead><tr><th>계열</th><th>배포판</th><th>패키지 관리자</th><th>특징</th></tr></thead><tbody>
<tr><td>Red Hat 계열</td><td>RHEL(유료 지원), Rocky Linux·AlmaLinux(무료 호환판), CentOS(개발 종료)</td><td><code>dnf</code> (예전 <code>yum</code>)</td><td>기업·공공에서 많이 씀</td></tr>
<tr><td>Debian 계열</td><td>Ubuntu, Debian</td><td><code>apt</code></td><td>클라우드·개발 환경에서 많이 씀</td></tr>
</tbody></table></div>
<p class="small muted">배포판마다 로그 파일 이름 같은 세부가 조금 다릅니다. 이 레슨은 Red Hat 계열(Rocky Linux) 기준이고, 다른 점은 괄호로 표시했습니다.</p>

<h2 id="s2">커널, 셸, 터미널</h2>
<div class="layers">
<div><b>사용자</b><span>명령어를 입력</span></div>
<div><b>터미널</b><span>입력하고 결과를 보는 창</span></div>
<div class="l1"><b>셸 (bash)</b><span>명령어를 해석해서 전달</span></div>
<div class="l1"><b>커널</b><span>하드웨어를 실제로 제어</span></div>
<div class="l0"><b>하드웨어</b><span>CPU · 메모리 · 디스크 · NIC</span></div>
</div>
<div class="box analogy"><span class="lbl">비유로 보면</span>해외 공장에 일을 시킨다고 생각하세요. <b>터미널</b>은 내가 쓰는 메신저 창, <b>셸</b>은 내 말을 공장 언어로 바꿔 주는 통역사, <b>커널</b>은 실제로 기계를 돌리는 공장장입니다.</div>
<p>커널이 하는 일은 크게 네 가지입니다. ① 프로세스 관리(어떤 프로그램이 언제 CPU를 쓸지), ② 메모리 관리, ③ 장치 관리(디스크, NIC 드라이버), ④ 파일 시스템 관리. 셸은 bash 외에도 zsh, sh 등이 있지만 서버에서는 대부분 <b>bash</b>입니다.</p>

<h2 id="s3">왜 마우스가 아니라 명령어일까</h2>
<ul><li><b>가볍다</b>: 화면을 그릴 자원을 서비스에 씁니다.</li><li><b>원격에 강하다</b>: 글자만 주고받으니 멀리서도 빠릅니다.</li><li><b>자동화</b>: 명령어를 파일에 적어 두면(스크립트) 100대 서버에 똑같이 실행할 수 있습니다.</li><li><b>기록이 남는다</b>: 무엇을 했는지 그대로 복사해 작업 로그·작업서에 붙일 수 있습니다.</li></ul>
<h3>프롬프트 읽는 법</h3>
<pre class="code">[trainee@ojt-web01 ~]$  <span class="c">← Red Hat 계열 모양: [사용자명@서버이름 현재위치]$</span>
trainee@ojt-web01:~$    <span class="c">← Ubuntu 모양: 사용자명@서버이름:현재위치$</span>
[root@ojt-web01 ~]#     <span class="c">← 끝이 # 이면 root(관리자). 실수하면 피해가 크니 더 조심</span></pre>
<p><code>~</code>는 내 홈 디렉터리를 뜻합니다. 맨 끝 기호가 <mark><code>$</code>면 일반 사용자, <code>#</code>면 root</mark>입니다.</p>

<h2 id="s4">디렉터리 구조: 모든 것은 / 에서 시작한다</h2>
<p>Windows는 <code>C:\\</code>, <code>D:\\</code>처럼 드라이브별로 시작하지만, 리눅스는 <b>단 하나의 꼭대기 <code>/</code>(루트)</b>에서 나무처럼 뻗어 나갑니다. 새 디스크를 붙여도 드라이브 문자가 생기지 않고, 이 나무의 한 가지(예: <code>/data</code>)에 연결합니다(일차 06 마운트). "디렉터리"는 폴더와 같은 말입니다.</p>
<div class="tree">/                <span class="c"># 루트: 모든 것의 시작</span>
├── <span class="d">bin</span>          <span class="c"># 기본 명령어 실행 파일 (ls, cp, cat …)</span>
├── <span class="d">sbin</span>         <span class="c"># 관리자용 명령어 (useradd, reboot, mkfs …)</span>
├── <span class="d">boot</span>         <span class="c"># 부팅에 필요한 파일: 커널(vmlinuz), initramfs, GRUB 설정</span>
├── <span class="d">dev</span>          <span class="c"># 장치 파일: 디스크(/dev/sda, VM은 /dev/vda), /dev/null</span>
├── <span class="d">etc</span>          <span class="c"># ★ 설정 파일 모음</span>
├── <span class="d">home</span>         <span class="c"># ★ 일반 사용자 홈 (/home/trainee)</span>
├── <span class="d">root</span>         <span class="c"># root 사용자의 홈 (/home 아님!)</span>
├── <span class="d">tmp</span>          <span class="c"># 임시 파일. 누구나 쓸 수 있고, 재부팅 때 지워질 수 있음</span>
├── <span class="d">usr</span>          <span class="c"># 설치된 프로그램과 라이브러리 (/usr/bin, /usr/lib)</span>
├── <span class="d">var</span>          <span class="c"># 계속 변하는 데이터</span>
│   ├── <span class="d">log</span>      <span class="c"># ★ 로그 파일</span>
│   ├── <span class="d">lib</span>      <span class="c">#   프로그램 데이터 (DB 데이터 /var/lib/mysql 등)</span>
│   └── <span class="d">spool</span>    <span class="c">#   대기 중인 작업 (메일, 예약 작업)</span>
├── <span class="d">opt</span>          <span class="c"># 추가로 설치한 별도 프로그램 (상용 SW 등)</span>
├── <span class="d">mnt</span>          <span class="c"># 디스크를 임시로 연결(마운트)하는 자리</span>
├── <span class="d">proc</span>         <span class="c"># 실행 중인 시스템 정보 (CPU, 메모리, 프로세스). 진짜 파일이 아님</span>
└── <span class="d">run</span>          <span class="c"># 실행 중에만 필요한 임시 정보 (PID 파일 등)</span></div>
<div class="box mem"><span class="lbl">외울 것 (★ 3개 먼저)</span><p><b>/etc</b> = 설정, <b>/var/log</b> = 로그, <b>/home</b> = 사용자 집. 장애가 나면 엔지니어는 거의 항상 <code>/var/log</code>부터 봅니다. 그다음 /root, /tmp, /boot, /dev, /usr, /proc 순서로 외우세요.</p></div>
<p class="small muted">요즘 배포판은 <code>/bin</code>이 <code>/usr/bin</code>을 가리키는 바로가기(링크)인 경우가 많습니다. 둘 다 "명령어가 있는 곳"으로 이해하면 됩니다.</p>

<h2 id="s5">파일의 종류와 리눅스의 규칙</h2>
<p>리눅스에는 <b>"모든 것은 파일이다"</b>라는 말이 있습니다. 설정도 파일, 로그도 파일, 디스크 장치(<code>/dev/vda</code>)도 파일처럼 다룹니다. 그래서 파일을 읽고 고치는 법만 알면 대부분을 관리할 수 있습니다.</p>
<div class="tbl-wrap"><table><thead><tr><th><code>ls -l</code> 맨 앞 글자</th><th>종류</th><th>예</th></tr></thead><tbody>
<tr><td><code>-</code></td><td>일반 파일</td><td>/etc/hostname, memo.txt</td></tr>
<tr><td><code>d</code></td><td>디렉터리</td><td>/etc, /home</td></tr>
<tr><td><code>l</code></td><td>링크(바로가기)</td><td>/bin → /usr/bin</td></tr>
<tr><td><code>b</code> / <code>c</code></td><td>장치 파일 (블록 / 문자)</td><td>/dev/vda (디스크), /dev/null</td></tr>
</tbody></table></div>
<ul>
<li><b>대소문자를 구분합니다.</b> <code>Memo.txt</code>와 <code>memo.txt</code>는 다른 파일입니다.</li>
<li><b>확장자는 그냥 이름의 일부</b>입니다. Windows처럼 확장자로 프로그램이 정해지지 않습니다. 실행 가능 여부는 권한(x)이 정합니다(일차 04).</li>
<li><b>점(.)으로 시작하면 숨김 파일</b>입니다. <code>.bashrc</code>, <code>.ssh</code> 같은 개인 설정이 숨김 파일로 되어 있고, <code>ls -a</code>로 봐야 보입니다.</li>
<li>파일 이름에 띄어쓰기는 피합니다. 명령어에서 다루기 불편합니다. <code>my_file.txt</code>처럼 밑줄을 씁니다.</li>
</ul>

<h2 id="s6">꼭 알아야 할 기본 파일</h2>
<div class="tbl-wrap"><table><thead><tr><th>파일</th><th>내용</th><th>어디서 다시 나오나</th></tr></thead><tbody>
<tr><td><code>/etc/hostname</code></td><td>이 서버의 이름</td><td></td></tr>
<tr><td><code>/etc/os-release</code></td><td>배포판 이름과 버전</td><td>장애 문의 때 먼저 확인</td></tr>
<tr><td><code>/etc/hosts</code></td><td>이름 → IP 주소를 직접 적어 두는 메모장</td><td>3주차 DNS</td></tr>
<tr><td><code>/etc/resolv.conf</code></td><td>이름을 물어볼 DNS 서버 주소</td><td>3주차 DNS</td></tr>
<tr><td><code>/etc/passwd</code></td><td>사용자 계정 목록 (비밀번호는 없음)</td><td>일차 04</td></tr>
<tr><td><code>/etc/shadow</code></td><td>암호화된 비밀번호 (root만 읽기 가능)</td><td>일차 04</td></tr>
<tr><td><code>/etc/group</code></td><td>그룹 목록</td><td>일차 04</td></tr>
<tr><td><code>/etc/sudoers</code></td><td>누가 sudo를 쓸 수 있는지</td><td>일차 04</td></tr>
<tr><td><code>/etc/ssh/sshd_config</code></td><td>SSH 접속 설정</td><td>일차 04</td></tr>
<tr><td><code>/etc/fstab</code></td><td>부팅할 때 자동으로 연결할 디스크 목록</td><td>일차 06</td></tr>
<tr><td><code>/etc/systemd/system/</code></td><td>서비스 설정(유닛 파일)</td><td>일차 05</td></tr>
<tr><td><code>/var/log/messages</code> <span class="muted small">(Ubuntu: syslog)</span></td><td>시스템 전반 로그</td><td>일차 05</td></tr>
<tr><td><code>/var/log/secure</code> <span class="muted small">(Ubuntu: auth.log)</span></td><td>로그인·인증·sudo 기록</td><td>일차 04, 05</td></tr>
<tr><td><code>~/.bashrc</code></td><td>내 셸의 개인 설정 (별칭 등)</td><td></td></tr>
</tbody></table></div>

<h2 id="s7">경로: 절대경로와 상대경로</h2>
<ul><li><b>절대경로</b>: <code>/</code>로 시작하는 전체 주소. 어디서 말해도 같은 곳. 예: <code>/etc/ssh/sshd_config</code></li><li><b>상대경로</b>: 지금 위치를 기준으로 한 주소. 예: 지금 <code>/etc</code>에 있다면 <code>ssh/sshd_config</code></li></ul>
<div class="tbl-wrap"><table><thead><tr><th>기호</th><th>뜻</th><th>예</th></tr></thead><tbody>
<tr><td><code>/</code></td><td>루트(맨 꼭대기), 또는 경로 구분자</td><td><code>cd /</code></td></tr>
<tr><td><code>.</code></td><td>지금 있는 곳</td><td><code>./script.sh</code></td></tr>
<tr><td><code>..</code></td><td>한 단계 위</td><td><code>cd ..</code>, <code>cd ../..</code>(두 단계 위)</td></tr>
<tr><td><code>~</code></td><td>내 홈 디렉터리</td><td><code>cd ~</code> (그냥 <code>cd</code>만 쳐도 같음)</td></tr>
</tbody></table></div>
<div class="box analogy"><span class="lbl">비유로 보면</span>절대경로는 "서울시 강남구 테헤란로 123", 상대경로는 "여기서 두 블록 위". 상대경로는 지금 어디 있느냐에 따라 뜻이 달라집니다. 작업서나 스크립트에는 실수를 줄이기 위해 <b>절대경로</b>를 씁니다.</div>
<h3>연습 문제</h3>
<p>지금 <code>/var/log</code>에 있습니다. <code>/etc/hosts</code>를 상대경로로 쓰면? → <code>../../etc/hosts</code> (한 단계 위 /var, 두 단계 위 /, 거기서 etc/hosts)</p>

<h2 id="s8">부팅 순서: 전원 버튼부터 로그인까지</h2>
<div class="flow"><div class="n"><b>① BIOS/UEFI</b><small>하드웨어 점검(POST)</small></div><span class="ar">→</span><div class="n"><b>② 부트로더</b><small>GRUB2가 커널 선택</small></div><span class="ar">→</span><div class="n k"><b>③ 커널</b><small>하드웨어 인식, 루트(/) 연결</small></div><span class="ar">→</span><div class="n k"><b>④ systemd</b><small>PID 1, 서비스 실행</small></div><span class="ar">→</span><div class="n"><b>⑤ 로그인</b><small>target 도달</small></div></div>
<h3>① BIOS / UEFI</h3>
<p>전원을 켜면 메인보드에 들어 있는 펌웨어가 먼저 실행됩니다. CPU·메모리·디스크가 정상인지 점검(<b>POST</b>, Power-On Self Test)하고, 정해진 순서대로 부팅할 디스크를 찾습니다. <b>UEFI</b>는 오래된 BIOS를 대체한 최신 방식으로, 큰 디스크(2TB 이상)와 빠른 부팅을 지원합니다.</p>
<div class="tbl-wrap"><table><thead><tr><th></th><th>BIOS (Legacy)</th><th>UEFI</th></tr></thead><tbody>
<tr><td>디스크 파티션 방식</td><td>MBR (2TB까지)</td><td>GPT (매우 큰 디스크 가능)</td></tr>
<tr><td>부트로더 위치</td><td>디스크 맨 앞 작은 영역</td><td>EFI 시스템 파티션(/boot/efi)</td></tr>
</tbody></table></div>
<h3>② 부트로더 (GRUB2)</h3>
<p>디스크에서 <b>GRUB2</b>가 실행되어 <code>/boot</code>에 있는 <b>커널 파일(vmlinuz)</b>과 <b>initramfs</b>를 메모리에 올립니다. 커널이 여러 버전 설치되어 있으면 어느 것으로 부팅할지 고르는 메뉴가 여기서 나옵니다. 업데이트 후 문제가 생기면 이 메뉴에서 이전 커널을 고르거나 복구 모드로 들어갑니다.</p>
<h3>③ 커널</h3>
<p>커널이 실행되어 CPU·메모리·장치를 인식합니다. 아직 진짜 디스크를 읽을 드라이버가 준비되지 않았을 수 있어서, 임시 파일 시스템인 <b>initramfs</b>의 도움을 받아 드라이버를 올린 뒤, 진짜 <b>루트 파일 시스템(/)</b>을 연결합니다. 그리고 첫 번째 프로그램인 systemd를 실행합니다.</p>
<h3>④ systemd</h3>
<p>커널이 가장 먼저 실행하는 프로그램이라 프로세스 번호(PID)가 <b>1</b>입니다. 모든 프로세스의 조상입니다. <code>/etc/fstab</code>을 읽어 디스크를 연결하고, 네트워크, SSH(sshd), 웹 서버 같은 서비스를 <b>정해진 의존 순서대로</b> 실행합니다. 서비스 관리 명령(<code>systemctl</code>)은 일차 05에서 배웁니다.</p>
<h3>⑤ target 도달과 로그인</h3>
<p>systemd는 목표 상태(<b>target</b>)까지 서비스를 올리면 부팅을 마칩니다. 서버는 보통 <code>multi-user.target</code>입니다. 이제 로그인 프롬프트가 뜨고 SSH 접속도 받을 수 있습니다.</p>
<div class="tbl-wrap"><table><thead><tr><th>target</th><th>뜻</th><th>예전 이름 (runlevel)</th></tr></thead><tbody>
<tr><td><code>multi-user.target</code></td><td>네트워크 포함 일반 서버 모드 (화면 없음)</td><td>3</td></tr>
<tr><td><code>graphical.target</code></td><td>화면(GUI)까지 켬</td><td>5</td></tr>
<tr><td><code>rescue.target</code></td><td>복구용 최소 모드 (root 혼자)</td><td>1</td></tr>
<tr><td><code>emergency.target</code></td><td>아주 최소한만 켠 응급 모드</td><td>-</td></tr>
</tbody></table></div>
<div class="box analogy"><span class="lbl">비유로 보면 (가게 문 열기)</span>① 건물 전기·설비 점검 → ② 열쇠로 문 열기 → ③ 점장 출근 → ④ 점장이 직원들을 순서대로 출근시킴 → ⑤ 영업 시작(손님 받기)</div>
<div class="box mem"><span class="lbl">외우는 법</span><p>앞 글자만 따서 <b>"바·부·커·시·로"</b> (BIOS → 부트로더 → 커널 → systemd → 로그인). 소리 내서 다섯 번 말하세요.</p></div>
<h3>부팅이 어디서 멈췄는지 알아보기</h3>
<p>부팅 순서를 아는 이유는 <b>장애 위치를 찾기 위해서</b>입니다. 클라우드 VM은 콘솔 화면으로 이 단계를 볼 수 있습니다.</p>
<div class="tbl-wrap"><table><thead><tr><th>보이는 증상</th><th>멈춘 단계</th><th>흔한 원인</th></tr></thead><tbody>
<tr><td>아무 화면도 없음, 하드웨어 오류 메시지</td><td>① BIOS/UEFI</td><td>하드웨어 고장, 부팅 디스크를 못 찾음</td></tr>
<tr><td><code>grub&gt;</code> 프롬프트에서 멈춤</td><td>② 부트로더</td><td>GRUB 설정·/boot 손상</td></tr>
<tr><td><code>Kernel panic</code> 메시지</td><td>③ 커널</td><td>커널·initramfs 문제, 루트 디스크를 못 찾음</td></tr>
<tr><td><code>emergency mode</code> 진입</td><td>④ systemd</td><td><b>/etc/fstab을 잘못 적어</b> 디스크 연결 실패 (일차 06에서 꼭 기억!)</td></tr>
<tr><td>부팅은 됐는데 웹이 안 뜸</td><td>⑤ 이후</td><td>서비스가 자동 시작으로 설정되지 않음 (일차 05)</td></tr>
</tbody></table></div>
<p>부팅 관련 확인 명령 (일차 05에서 직접 써 봅니다): <code>uptime</code>(켜진 지 얼마나), <code>systemctl get-default</code>(기본 target), <code>journalctl -b</code>(이번 부팅의 로그), <code>dmesg</code>(커널 메시지).</p>

<h2 id="s9">직접 해 보기</h2>
<p>디렉터리와 경로는 눈으로 읽는 것보다 직접 돌아다녀 보는 게 훨씬 빨리 외워집니다. <b>연습 터미널의 "미션 A: 파일 시스템 탐험"</b>을 끝까지 해 보세요. 이 페이지 안에서만 동작하니 마음껏 틀려도 됩니다.</p>
<div class="btn-row"><a class="btn pri" href="#term">연습 터미널 열기 (미션 A)</a></div>
`,
summary:['리눅스 = 유닉스를 본뜬 오픈소스 OS. 무료·안정·가볍고 원격·자동화에 강해 서버 표준. RHEL·Rocky(dnf) / Ubuntu(apt).','커널 = 하드웨어 제어(공장장), 셸(bash) = 명령 해석(통역사), 터미널 = 입력 창. 프롬프트 $ = 일반, # = root.','/etc 설정, /var/log 로그, /home 사용자, /root root의 집, /tmp 임시, /boot 커널, /dev 장치, /usr 프로그램, /proc 시스템 정보.','모든 것은 파일. 대소문자 구분, 확장자는 이름일 뿐, 점(.)으로 시작하면 숨김 파일.','절대경로(/부터) vs 상대경로(지금 위치 기준). . 여기, .. 위, ~ 홈.','부팅: BIOS/UEFI(POST) → GRUB2(커널·initramfs 로드) → 커널(루트 연결) → systemd(PID 1, 서비스) → target·로그인. "바부커시로". fstab 오류 = emergency mode.'],
essay:[
{q:'리눅스가 서버에서 많이 쓰이는 이유를 3가지 말하고, Red Hat 계열과 Debian 계열 배포판의 차이를 설명해 보세요.',a:'무료 오픈소스라 비용이 없고, 오래 켜 둬도 안정적이며, 화면 없이 가볍고 명령어로 원격 관리·자동화하기 좋다. Red Hat 계열(RHEL, Rocky Linux)은 기업·공공에서 많이 쓰고 패키지 관리자로 dnf를 쓰며, Debian 계열(Ubuntu)은 클라우드·개발 환경에서 많이 쓰고 apt를 쓴다. 로그 파일 이름 같은 세부도 조금 다르다.'},
{q:'커널, 셸, 터미널의 관계를 비유를 들어 설명해 보세요.',a:'터미널은 내가 명령어를 입력하고 결과를 보는 창(메신저 창)이다. 셸(bash)은 내가 입력한 명령어를 해석해 커널에 전달하는 통역사다. 커널은 실제로 CPU·메모리·디스크 같은 하드웨어를 제어하고 프로세스·메모리·장치·파일 시스템을 관리하는 공장장이다.'},
