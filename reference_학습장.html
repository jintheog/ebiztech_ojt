body:`
<h2 id="s1">명령어의 문법과 꼭 알아야 할 키</h2>
<pre class="code">ls     -l      /etc
<span class="c">명령어  옵션    대상</span></pre>
<p>명령어는 <b>동사</b>, 옵션은 <b>부사</b>(어떻게), 대상은 <b>목적어</b>(무엇을)라고 생각하면 됩니다. 옵션은 <code>-l -a</code>처럼 따로 써도, <code>-la</code>처럼 붙여 써도 됩니다. 긴 옵션은 <code>--help</code>처럼 줄 두 개로 씁니다.</p>
<div class="tbl-wrap"><table><thead><tr><th>키·기호</th><th>하는 일</th></tr></thead><tbody>
<tr><td><kbd>Tab</kbd></td><td>파일·명령 이름 자동 완성. 오타를 줄여 주니 습관처럼 누르세요.</td></tr>
<tr><td><kbd>↑</kbd> <kbd>↓</kbd></td><td>이전에 입력한 명령 다시 불러오기</td></tr>
<tr><td><kbd>Ctrl</kbd>+<kbd>C</kbd></td><td>실행 중인 명령 강제로 멈추기</td></tr>
<tr><td><code>명령어 --help</code>, <code>man 명령어</code></td><td>사용법 보기 (man 화면은 q로 나감)</td></tr>
<tr><td><code>|</code> (파이프)</td><td>앞 명령의 결과를 뒤 명령에 넘김. 예: <code>cat /etc/passwd | grep trainee</code></td></tr>
<tr><td><code>&gt;</code> / <code>&gt;&gt;</code></td><td>결과를 파일에 덮어쓰기 / 이어 쓰기</td></tr>
</tbody></table></div>

<h2 id="s2">기본 명령어</h2>
<div class="tbl-wrap"><table><thead><tr><th>명령어</th><th>뜻 (어원)</th><th>예</th><th>설명</th></tr></thead><tbody>
<tr><td><code>pwd</code></td><td>print working directory</td><td><code>pwd</code></td><td>지금 내 위치 보기</td></tr>
<tr><td><code>ls</code></td><td>list</td><td><code>ls -la</code></td><td>목록 보기. -l 자세히, -a 숨김 파일까지, -h 크기를 KB·MB로</td></tr>
<tr><td><code>cd</code></td><td>change directory</td><td><code>cd /var/log</code></td><td>이동. <code>cd</code>만 치면 홈으로</td></tr>
<tr><td><code>mkdir</code></td><td>make directory</td><td><code>mkdir -p a/b/c</code></td><td>디렉터리 만들기. -p는 중간 디렉터리까지 한 번에</td></tr>
<tr><td><code>touch</code></td><td>(건드리다)</td><td><code>touch note.txt</code></td><td>빈 파일 만들기 (있으면 수정 시각만 바꿈)</td></tr>
<tr><td><code>cp</code></td><td>copy</td><td><code>cp -r dir1 dir2</code></td><td>복사. 디렉터리는 -r. 설정 파일을 고치기 전에는 <code>cp 파일 파일.bak</code>으로 백업하는 습관</td></tr>
<tr><td><code>mv</code></td><td>move</td><td><code>mv a.txt old/</code></td><td>이동, 또는 이름 바꾸기</td></tr>
<tr><td><code>rm</code></td><td>remove</td><td><code>rm a.txt</code></td><td>삭제. <b>휴지통이 없어서 되돌릴 수 없음</b>. 디렉터리는 <code>rm -r</code></td></tr>
<tr><td><code>cat</code></td><td>concatenate</td><td><code>cat /etc/hostname</code></td><td>파일 내용 출력</td></tr>
<tr><td><code>less</code></td><td>-</td><td><code>less /var/log/messages</code></td><td>긴 파일을 한 화면씩 보기. 스페이스 다음 장, /글자 검색, q 나가기</td></tr>
<tr><td><code>head</code> / <code>tail</code></td><td>머리 / 꼬리</td><td><code>tail -n 20 파일</code></td><td>앞부분 / 뒷부분만 보기. 로그는 최신이 뒤에 있어서 tail을 많이 씀. <code>tail -f</code>는 실시간으로 계속 보기</td></tr>
<tr><td><code>grep</code></td><td>글자 찾기</td><td><code>grep -i error /var/log/messages</code></td><td>특정 글자가 들어간 줄만 보기. -i 대소문자 무시, -v 제외</td></tr>
<tr><td><code>echo</code></td><td>메아리</td><td><code>echo hello &gt; a.txt</code></td><td>글자 출력. 파일에 쓰기</td></tr>
<tr><td><code>whoami</code> / <code>id</code></td><td>who am I</td><td><code>id</code></td><td>나는 누구? / 내 UID와 그룹</td></tr>
<tr><td><code>history</code></td><td>-</td><td><code>history</code></td><td>지금까지 입력한 명령 목록</td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">rm 사고를 막는 습관</span><ul><li>지우기 전에 <code>pwd</code>로 내 위치를, <code>ls</code>로 지울 대상을 먼저 확인합니다.</li><li><code>rm -rf</code>는 묻지도 않고 전부 지웁니다. 운영 서버에서는 특히 조심하고, 경로는 절대경로로 씁니다.</li></ul></div>

<h2 id="s3">계정: 누가 이 서버를 쓰나</h2>
<p>리눅스는 처음부터 <b>여러 사람과 여러 서비스가 한 서버를 함께 쓰도록</b> 만들어졌습니다. 그래서 "누가 무엇을 할 수 있나"를 꼼꼼하게 나눕니다.</p>
<div class="tbl-wrap"><table><thead><tr><th>종류</th><th>UID</th><th>예</th><th>특징</th></tr></thead><tbody>
<tr><td><b>root</b></td><td>0</td><td>root</td><td>모든 권한. 실수 한 번이 시스템 전체를 망가뜨릴 수 있어 평소에는 쓰지 않음</td></tr>
<tr><td><b>시스템 계정</b></td><td>1~999</td><td>sshd, nginx, mysql</td><td>서비스가 쓰는 계정. 로그인 셸이 <code>/sbin/nologin</code>이라 사람이 로그인할 수 없음. 서비스가 해킹돼도 피해를 그 계정 권한 안으로 줄임</td></tr>
<tr><td><b>일반 계정</b></td><td>1000~</td><td>trainee, kim</td><td>사람이 쓰는 계정. 자기 홈과 허락받은 파일만 다룸</td></tr>
</tbody></table></div>
<h3>계정 정보가 저장되는 파일</h3>
<pre class="code"><span class="c"># /etc/passwd : 계정 목록 (누구나 읽을 수 있음)</span>
trainee:x:1000:1000:OJT Trainee:/home/trainee:/bin/bash
<span class="c">이름   :비번:UID :GID :설명       :홈 디렉터리   :로그인 셸
        └ x = 비밀번호는 /etc/shadow에 따로 보관</span>

<span class="c"># /etc/shadow : 암호화된 비밀번호 (root만 읽을 수 있음)</span>
trainee:$6$Xy...(암호화된 값):20395:0:99999:7:::
<span class="c">이름   :비밀번호 해시          :마지막 변경일:최소:최대 사용 일수:만료 경고일</span>

<span class="c"># /etc/group : 그룹 목록</span>
wheel:x:10:trainee,kim
<span class="c">그룹명:비번:GID:소속 사용자들</span></pre>
<h3>계정 관리 명령 (root 또는 sudo 필요)</h3>
<div class="tbl-wrap"><table><thead><tr><th>명령</th><th>하는 일</th></tr></thead><tbody>
<tr><td><code>sudo useradd kim</code></td><td>사용자 kim 만들기 (홈 /home/kim, 같은 이름의 기본 그룹도 생성). Ubuntu에서는 대화형 <code>adduser</code>도 많이 씀</td></tr>
<tr><td><code>sudo passwd kim</code></td><td>kim의 비밀번호 설정 (설정 전에는 비밀번호로 로그인 불가)</td></tr>
<tr><td><code>sudo userdel -r kim</code></td><td>kim 삭제 (-r: 홈 디렉터리도 함께)</td></tr>
<tr><td><code>sudo chage -l kim</code></td><td>비밀번호 만료 정책 확인</td></tr>
<tr><td><code>id kim</code>, <code>groups kim</code></td><td>kim의 UID와 소속 그룹 확인</td></tr>
<tr><td><code>who</code>, <code>w</code>, <code>last</code></td><td>지금 로그인한 사람 / 하는 일 / 최근 로그인 기록</td></tr>
</tbody></table></div>

<h2 id="s4">그룹과 sudo: 권한을 나눠 주는 방법</h2>
<p><b>그룹</b>은 여러 사용자에게 같은 권한을 한 번에 주기 위한 묶음입니다. 개발자 5명이 같은 디렉터리를 써야 한다면, 5명에게 따로 권한을 주지 않고 <code>dev</code> 그룹에 넣고 디렉터리를 그 그룹 소유로 만듭니다.</p>
<ul><li><b>기본 그룹</b>: 사용자마다 1개. 보통 사용자 이름과 같습니다. 새 파일을 만들면 이 그룹 소유가 됩니다.</li><li><b>보조 그룹</b>: 여러 개 가입 가능. 예: wheel, dev, docker.</li></ul>
<div class="tbl-wrap"><table><thead><tr><th>명령</th><th>하는 일</th></tr></thead><tbody>
<tr><td><code>sudo groupadd dev</code></td><td>그룹 dev 만들기</td></tr>
<tr><td><code>sudo usermod -aG dev kim</code></td><td>kim을 dev 그룹에 <b>추가</b>. <b>-a를 빼먹으면 기존 보조 그룹이 지워지고</b> dev만 남으니 주의. 그룹 변경은 다시 로그인해야 적용</td></tr>
<tr><td><code>sudo gpasswd -d kim dev</code></td><td>kim을 dev 그룹에서 빼기</td></tr>
</tbody></table></div>
<h3>sudo와 su</h3>
<ul><li><code>sudo 명령어</code>: 허락받은 사용자가 그 명령 <b>한 번만</b> 관리자 권한으로 실행합니다. 처음에 <b>자기</b> 비밀번호를 묻고, 누가 언제 무엇을 했는지 <code>/var/log/secure</code>에 기록이 남습니다. <mark>실무에서는 root로 직접 로그인하지 않고 sudo를 씁니다.</mark></li><li><code>su - 사용자</code>: 그 사용자로 아예 전환합니다. <b>상대방의</b> 비밀번호가 필요합니다. <code>sudo -i</code>는 root로 전환(프롬프트가 <code>#</code>로 바뀜), <code>exit</code>로 돌아옵니다.</li></ul>
<p>누가 sudo를 쓸 수 있는지는 <code>/etc/sudoers</code>에 적혀 있습니다. Red Hat 계열은 <b>wheel</b> 그룹, Ubuntu는 <b>sudo</b> 그룹에 넣으면 sudo를 쓸 수 있습니다.</p>
<pre class="code">%wheel  ALL=(ALL)  ALL        <span class="c"># wheel 그룹은 모든 명령을 sudo로 실행 가능</span>
sudo visudo                   <span class="c"># sudoers는 반드시 visudo로 수정 (문법 오류를 검사해 줌)</span></pre>
<div class="box analogy"><span class="lbl">비유로 보면</span>root는 건물의 <b>마스터키</b>. 마스터키를 항상 들고 다니면 잃어버리거나 실수로 아무 문이나 열게 됩니다. sudo는 "필요할 때 관리실에서 마스터키를 빌리고, 대장에 이름을 적는 것"입니다. wheel 그룹은 "마스터키를 빌릴 수 있는 사람 명단"입니다.</div>

<h2 id="s5">파일 권한: 누가 무엇을 할 수 있나</h2>
<p><code>ls -l</code>을 치면 이런 줄이 나옵니다. 맨 앞 10글자가 권한입니다.</p>
<pre class="code">-rw-r--r--  1  trainee  trainee  120  Nov  4 10:00  memo.txt
<span class="c">권한        링크 소유자   소유 그룹 크기  수정 시각     이름</span></pre>
<div class="perm-anat"><span class="pa-t">-<small>종류</small></span><span class="pa-u">rw-<small>소유자 (u)</small></span><span class="pa-g">r--<small>그룹 (g)</small></span><span class="pa-o">r--<small>기타 (o)</small></span></div>
<ul><li><b>첫 글자</b>: <code>-</code> 일반 파일, <code>d</code> 디렉터리, <code>l</code> 링크</li><li><b>그다음 3글자씩</b>: 소유자(user) / 소유 그룹(group) / 그 밖의 모든 사람(others)</li></ul>
<div class="tbl-wrap"><table><thead><tr><th>글자</th><th>파일일 때</th><th>디렉터리일 때</th><th>숫자</th></tr></thead><tbody>
<tr><td><code>r</code> read</td><td>내용 읽기</td><td>목록 보기(ls)</td><td><b>4</b></td></tr>
<tr><td><code>w</code> write</td><td>내용 고치기</td><td>안에 파일 만들기·지우기·이름 바꾸기</td><td><b>2</b></td></tr>
<tr><td><code>x</code> execute</td><td>프로그램으로 실행</td><td>안으로 들어가기(cd)</td><td><b>1</b></td></tr>
<tr><td><code>-</code></td><td colspan="2">권한 없음</td><td>0</td></tr>
</tbody></table></div>
<h3>리눅스가 권한을 판단하는 순서</h3>
<ol><li>내가 <b>root</b>면 → 거의 무조건 허용</li><li>내가 파일의 <b>소유자</b>면 → 소유자 칸(앞 3글자)<b>만</b> 본다</li><li>내가 파일의 <b>그룹</b>에 속하면 → 그룹 칸(가운데 3글자)만 본다</li><li>둘 다 아니면 → 기타 칸(뒤 3글자)을 본다</li></ol>
<p class="small muted">그래서 소유자 칸이 <code>---</code>이고 기타 칸이 <code>rwx</code>여도, 소유자 본인은 읽을 수 없습니다. 위에서부터 처음 해당하는 칸 하나만 봅니다.</p>
<h3>숫자로 바꾸기: 더하기만 하면 된다</h3>
<p>세 자리를 각각 더합니다. <code>rw-</code> = 4+2+0 = <b>6</b>, <code>r-x</code> = 4+0+1 = <b>5</b>, <code>rwx</code> = 4+2+1 = <b>7</b>.</p>
<div class="box mem"><span class="lbl">외울 것: 자주 쓰는 권한</span>
<div class="tbl-wrap" style="margin:.5rem 0 0"><table><tbody>
<tr><td><code>755</code></td><td><code>rwxr-xr-x</code></td><td>디렉터리, 실행 파일. 나는 다 하고, 남은 읽기·실행만</td></tr>
<tr><td><code>644</code></td><td><code>rw-r--r--</code></td><td>일반 파일. 나는 읽고 쓰고, 남은 읽기만</td></tr>
<tr><td><code>600</code></td><td><code>rw-------</code></td><td>비밀 파일, <b>SSH 개인키</b>, authorized_keys. 나만 읽고 쓰기</td></tr>
<tr><td><code>700</code></td><td><code>rwx------</code></td><td>나만 쓰는 디렉터리 (예: ~/.ssh)</td></tr>
<tr><td><code>770</code></td><td><code>rwxrwx---</code></td><td>팀 공유 디렉터리 (소유자와 그룹만)</td></tr>
</tbody></table></div></div>
<div data-widget="permcalc"></div>
<h3>새 파일의 기본 권한: umask</h3>
<p>새로 만든 파일이 왜 644, 디렉터리가 왜 755일까요? 시작값(파일 666, 디렉터리 777)에서 <b>umask</b> 값(보통 <code>022</code>)을 빼기 때문입니다. 666 − 022 = <b>644</b>, 777 − 022 = <b>755</b>. <code>umask</code> 명령으로 현재 값을 볼 수 있습니다.</p>
<h3>특수 권한 (이름만 알아 두기)</h3>
<ul><li><b>sticky bit</b> (<code>t</code>): <code>/tmp</code>는 <code>drwxrwxrwt</code>입니다. 누구나 파일을 만들 수 있지만, <b>남의 파일은 지울 수 없게</b> 막습니다.</li><li><b>setuid</b> (<code>s</code>): <code>/usr/bin/passwd</code>는 <code>-rwsr-xr-x</code>입니다. 일반 사용자가 실행해도 잠깐 root 권한으로 동작해서 자기 비밀번호를 바꿀 수 있습니다.</li></ul>

<h2 id="s6">chmod와 chown</h2>
<pre class="code">chmod 600 mykey.pem          <span class="c"># 숫자 방식: 나만 읽고 쓰기</span>
chmod u+x deploy.sh          <span class="c"># 기호 방식: 소유자(u)에게 실행(x) 추가(+)</span>
chmod go-w report.txt        <span class="c"># 그룹(g)과 기타(o)에게서 쓰기(w) 빼기(-)</span>
chmod -R 750 /srv/app        <span class="c"># -R: 디렉터리 안의 모든 파일까지 한 번에</span>
sudo chown kim note.txt      <span class="c"># 소유자를 kim으로 (root만 가능 → sudo)</span>
sudo chown kim:dev note.txt  <span class="c"># 소유자는 kim, 그룹은 dev로</span>
sudo chown -R nginx:nginx /usr/share/nginx/html   <span class="c"># 웹 파일을 nginx 계정 소유로</span></pre>
<ul><li><b>chmod</b>는 파일 <b>소유자</b>나 root만 할 수 있습니다.</li><li><b>chown</b>은 <b>root만</b> 할 수 있습니다. 일반 사용자가 남에게 파일을 떠넘기지 못하게 하기 위해서입니다.</li></ul>
<div class="box warn"><span class="lbl">하지 말 것: chmod 777</span><p>안 되면 일단 777로 다 열어 버리는 것은 가장 흔한 나쁜 습관입니다. 누구나 고치고 지울 수 있게 됩니다. <b>필요한 사람에게 필요한 권한만</b>(최소 권한 원칙) 주세요.</p></div>

<h2 id="s7">SSH: 멀리 있는 서버에 들어가는 문</h2>
<p>데이터센터나 클라우드에 있는 서버에는 화면도 키보드도 없습니다. 엔지니어는 자기 PC에서 <b>SSH</b>로 접속합니다. SSH는 내 PC와 서버 사이에 <b>암호화된 통로</b>를 만들어서, 중간에서 누가 엿봐도 내용을 알 수 없게 합니다. (예전에 쓰던 telnet은 암호화가 없어서 지금은 쓰지 않습니다.)</p>
<div class="flow"><div class="n"><b>내 PC</b><small>ssh (클라이언트)</small></div><span class="ar">→ 22번 포트 →</span><div class="n k"><b>서버</b><small>sshd (서버 데몬)</small></div></div>
<pre class="code">ssh trainee@10.0.1.10                       <span class="c"># 사용자명@서버IP (기본 22번 포트)</span>
ssh -p 2222 trainee@10.0.1.10               <span class="c"># 22가 아닌 포트로 접속할 때</span>
ssh -i ~/keys/ojt.pem rocky@203.0.113.10    <span class="c"># 개인키 파일을 지정해서 접속 (클라우드 VM)</span>
exit                                        <span class="c"># 접속 끊기</span></pre>
<p><b>포트</b>는 한 서버(IP 주소 = 건물 주소) 안에서 서비스를 구분하는 <b>호실 번호</b>입니다. SSH의 기본 포트는 <mark>22</mark>입니다. (웹 80·443, 3주차에 자세히)</p>
<h3>인증 방법 두 가지</h3>
<ol><li><b>비밀번호</b>: 간단하지만 무작위로 계속 대입하는 공격(Brute Force)에 약합니다. 인터넷에 열린 서버의 <code>/var/log/secure</code>를 보면 이런 시도가 끊임없이 찍혀 있습니다.</li><li><b>키(Key) 인증</b>: 실무와 클라우드의 표준. 비밀번호 로그인을 아예 꺼 두는 경우가 많습니다.</li></ol>
<h3>키 인증의 원리: 자물쇠와 열쇠</h3>
<div class="box analogy"><span class="lbl">비유로 보면</span><b>공개키는 자물쇠</b>, <b>개인키는 그 자물쇠에 맞는 유일한 열쇠</b>입니다. 자물쇠는 여러 개 복사해서 여러 서버 문에 달아도 괜찮습니다(공개해도 됨). 하지만 열쇠는 나만 가지고 있어야 합니다. 접속할 때 서버가 "이 자물쇠에 맞는 열쇠를 가졌는지 증명해 봐"라고 문제를 내고, 내 PC가 개인키로 답을 만들어 보냅니다. 개인키 자체는 네트워크로 전송되지 않습니다.</div>
<div class="flow"><div class="n"><b>내 PC</b><small>~/.ssh/id_ed25519 (개인키, 600)</small></div><span class="ar">SSH →</span><div class="n k"><b>서버</b><small>~/.ssh/authorized_keys에<br>공개키 등록 (600)</small></div></div>
<pre class="code">ssh-keygen -t ed25519                <span class="c"># 내 PC에서 키 한 쌍 만들기 → id_ed25519(개인키), id_ed25519.pub(공개키)</span>
ssh-copy-id trainee@10.0.1.10        <span class="c"># 내 공개키를 서버의 authorized_keys에 자동 등록 (처음 한 번은 비밀번호 필요)</span>
ssh trainee@10.0.1.10                <span class="c"># 이후로는 키로 접속</span></pre>
<h3>SSH 관련 파일과 권한</h3>
<div class="tbl-wrap"><table><thead><tr><th>위치</th><th>파일</th><th>권한</th><th>내용</th></tr></thead><tbody>
<tr><td>내 PC</td><td><code>~/.ssh/id_ed25519</code></td><td><b>600</b></td><td>개인키(열쇠). 너무 열려 있으면 SSH가 사용을 거부</td></tr>
<tr><td>내 PC</td><td><code>~/.ssh/known_hosts</code></td><td>644</td><td>접속해 본 서버들의 지문</td></tr>
<tr><td>서버</td><td><code>~/.ssh/</code></td><td><b>700</b></td><td>디렉터리 자체</td></tr>
<tr><td>서버</td><td><code>~/.ssh/authorized_keys</code></td><td><b>600</b></td><td>접속을 허락할 공개키 목록</td></tr>
<tr><td>서버</td><td><code>/etc/ssh/sshd_config</code></td><td>600</td><td>SSH 서버 설정</td></tr>
</tbody></table></div>
<h3>처음 접속할 때 나오는 질문</h3>
<pre class="code">The authenticity of host '10.0.1.10' can't be established.
ED25519 key fingerprint is SHA256:abc123...
Are you sure you want to continue connecting (yes/no)? <span class="c">← 처음 보는 서버가 맞는지 묻는 것. yes → known_hosts에 저장</span></pre>
<p>나중에 같은 IP인데 지문이 바뀌면 <code>WARNING: REMOTE HOST IDENTIFICATION HAS CHANGED!</code> 경고가 뜹니다. 서버를 새로 만들었다면 정상이고, 아니라면 중간에서 누가 가로채는 것일 수 있으니 사수에게 확인합니다.</p>
<h3>sshd_config 주요 설정</h3>
<pre class="code">Port 22                      <span class="c"># 접속 포트</span>
PermitRootLogin no           <span class="c"># root로 직접 SSH 로그인 금지 (일반 계정 + sudo 사용)</span>
PasswordAuthentication no    <span class="c"># 비밀번호 로그인 금지, 키만 허용</span>
PubkeyAuthentication yes     <span class="c"># 키 인증 허용</span></pre>
<div class="box warn"><span class="lbl">설정을 바꿀 때 절대 규칙</span><p><code>sudo cp /etc/ssh/sshd_config /etc/ssh/sshd_config.bak</code>으로 백업 → 수정 → <code>sudo sshd -t</code>로 문법 확인 → <code>sudo systemctl restart sshd</code> → <b>지금 창은 닫지 말고 새 창으로 접속되는지 확인</b>. 잘못 고친 채로 끊기면 다시 들어갈 방법이 없을 수 있습니다.</p></div>
<h3>파일 주고받기: scp</h3>
<pre class="code">scp ./app.conf trainee@10.0.1.10:/tmp/       <span class="c"># 내 PC → 서버</span>
scp trainee@10.0.1.10:/var/log/app.log ./    <span class="c"># 서버 → 내 PC</span></pre>
<h3>Windows에서 SSH 쓰기</h3>
<p>Windows 10/11의 PowerShell이나 터미널에서 <code>ssh</code> 명령을 바로 쓸 수 있습니다. 회사에 따라 PuTTY, MobaXterm, Xshell 같은 프로그램도 씁니다. 팀에서 쓰는 도구를 사수에게 물어보세요.</p>
<h3>클라우드와 연결하기</h3>
<p>5주차에 zCompute에서 VM을 만들 때 <b>Key Pair</b>를 지정합니다. 클라우드가 VM을 만들면서 공개키를 VM 안의 authorized_keys에 넣어 주고, 나는 내려받은 개인키(.pem)로 <code>ssh -i</code> 접속합니다. 오늘 배운 원리 그대로입니다.</p>
<div class="box warn"><span class="lbl">접속이 안 될 때 흔한 원인 (5주차에 꼭 다시 보기)</span><ul><li><code>Permission denied (publickey)</code>: 사용자명이 틀렸거나(이미지마다 기본 사용자가 다름: rocky, ubuntu 등), 다른 키를 썼거나, 개인키·authorized_keys 권한이 너무 열려 있음</li><li><code>Connection timed out</code>: 방화벽·Security Group에서 22번 포트가 막혀 있거나 IP가 틀림</li><li><code>Connection refused</code>: 서버에서 SSH 서비스(sshd)가 꺼져 있음 → <code>systemctl status sshd</code> (일차 05)</li></ul></div>

<h2 id="s8">실습 시나리오: 계정 생성부터 SSH 접속까지</h2>
<p>실무에서 자주 받는 요청입니다. <b>"신규 개발자 kim에게 서버 접속 권한을 주세요. 개발팀(dev) 공유 폴더 /srv/dev도 쓸 수 있게요."</b> 순서를 손노트에 그대로 적어 두세요.</p>
<pre class="code">sudo useradd kim                          <span class="c"># 1. 계정 만들기</span>
sudo groupadd dev                         <span class="c"># 2. 팀 그룹 만들기 (이미 있으면 생략)</span>
sudo usermod -aG dev kim                  <span class="c"># 3. kim을 dev 그룹에 추가 (-a 잊지 않기!)</span>
sudo mkdir -p /srv/dev                    <span class="c"># 4. 공유 디렉터리 만들기</span>
sudo chown root:dev /srv/dev              <span class="c"># 5. 그룹 소유를 dev로</span>
sudo chmod 770 /srv/dev                   <span class="c"># 6. 소유자·dev 그룹만 읽기·쓰기·들어가기</span>
sudo mkdir -p /home/kim/.ssh              <span class="c"># 7. kim의 SSH 디렉터리</span>
sudo vi /home/kim/.ssh/authorized_keys    <span class="c"># 8. kim에게 받은 "공개키"를 붙여 넣기</span>
sudo chmod 700 /home/kim/.ssh             <span class="c"># 9. 권한 맞추기</span>
sudo chmod 600 /home/kim/.ssh/authorized_keys
sudo chown -R kim:kim /home/kim/.ssh      <span class="c"># 10. 소유자를 kim으로</span>
id kim                                    <span class="c"># 11. 확인: dev 그룹에 들어갔나</span>
<span class="c"># 12. kim이 자기 PC에서: ssh kim@서버IP → 접속되면 완료</span></pre>
<p class="small muted"><code>vi</code>는 리눅스의 기본 텍스트 편집기입니다. 기본 사용법(i로 입력, Esc 후 :wq로 저장·종료)은 3주차 전에 따로 연습해 두면 좋습니다.</p>

<h2 id="s9">직접 해 보기</h2>
<p>연습 터미널의 <b>"미션 B: 계정과 권한"</b>을 끝까지 하세요. 사용자 만들기, 권한 바꾸기, sudo 쓰기, 키 만들기를 실제처럼 해 볼 수 있습니다.</p>

summary:['명령어 [옵션] [대상]. Tab 자동완성, ↑ 이전 명령, Ctrl+C 중단, | 파이프, grep 글자 찾기.','pwd·ls·cd·mkdir·touch·cp·mv·rm·cat·less·tail·grep. rm은 되돌릴 수 없다 → pwd·ls로 먼저 확인.','계정: root(0) / 시스템 계정(1~999, nologin) / 일반(1000~). /etc/passwd·shadow·group.','그룹으로 권한을 묶어 준다. usermod -aG(-a 필수). sudo = 한 번만 관리자 권한 + 기록, wheel 그룹, visudo.','권한: 소유자/그룹/기타 × r4 w2 x1, 처음 해당하는 칸만 본다. 755·644·600·700. umask 022. chmod(소유자·root), chown(root만). 777 금지.','SSH 포트 22. 공개키 = 자물쇠(서버 authorized_keys 600), 개인키 = 열쇠(내 PC 600). PermitRootLogin no, PasswordAuthentication no. 설정 변경 후 새 창으로 확인.'],

{q:'root, 시스템 계정, 일반 계정의 차이를 설명하고, 서비스(nginx 등)를 root가 아닌 시스템 계정으로 실행하는 이유를 말해 보세요.',a:'root는 UID 0으로 모든 권한을 가진 관리자다. 시스템 계정(UID 1~999)은 sshd, nginx처럼 서비스가 쓰는 계정으로 로그인 셸이 nologin이라 사람이 로그인할 수 없다. 일반 계정(UID 1000~)은 사람이 쓰는 계정이다. 서비스를 시스템 계정으로 돌리면 서비스가 해킹당해도 공격자가 그 계정 권한 안에서만 움직일 수 있어 피해가 줄어든다.'},
{q:'root로 항상 작업하면 안 되는 이유와, 실무에서 sudo를 쓰는 이유를 설명하고, 사용자를 sudo 가능하게 만드는 방법을 말해 보세요.',a:'root는 권한 제한 없이 모든 파일을 고치고 지울 수 있어서, 오타 하나로 시스템 전체를 망가뜨릴 수 있다. sudo를 쓰면 평소에는 일반 사용자로 안전하게 작업하다가 필요한 명령 한 번만 관리자 권한으로 실행하고, 누가 언제 무엇을 실행했는지 /var/log/secure에 기록이 남는다. Red Hat 계열은 sudo usermod -aG wheel 사용자 로 wheel 그룹에 넣으면 sudo를 쓸 수 있다(sudoers의 %wheel 설정).'},
{q:'SSH 키 인증의 원리를 자물쇠와 열쇠에 비유해 설명하고, 관련 파일의 위치와 권한을 말해 보세요.',a:'공개키는 자물쇠, 개인키는 그 자물쇠에 맞는 유일한 열쇠다. 공개키를 서버의 ~/.ssh/authorized_keys에 등록해 두면, 접속할 때 서버가 낸 문제를 내 PC가 개인키로 풀어 증명하고 접속된다. 개인키는 네트워크로 보내지 않는다. 내 PC의 개인키는 600, 서버의 ~/.ssh 디렉터리는 700, authorized_keys는 600으로 둔다. 개인키는 메신저나 메일로 절대 보내지 않는다.'},
{q:'신규 직원 kim에게 서버 접속 권한과 팀 공유 디렉터리(/srv/dev) 쓰기 권한을 주는 절차를 순서대로 말해 보세요.',a:'① sudo useradd kim ② sudo groupadd dev(없으면) ③ sudo usermod -aG dev kim ④ sudo mkdir -p /srv/dev ⑤ sudo chown root:dev /srv/dev ⑥ sudo chmod 770 /srv/dev ⑦ /home/kim/.ssh 를 만들고 kim의 공개키를 authorized_keys에 넣기 ⑧ .ssh는 700, authorized_keys는 600, 소유자는 kim으로 ⑨ id kim으로 그룹 확인 ⑩ kim이 ssh kim@서버IP로 접속 확인.'}

body:`
<h2 id="s1">프로그램과 프로세스</h2>
<p><b>프로그램</b>은 디스크에 저장된 실행 파일입니다(<code>/usr/sbin/nginx</code>). 이것을 실행하면 메모리에 올라와 CPU를 쓰며 일하는 상태가 되는데, 이것이 <b>프로세스</b>입니다. 같은 프로그램을 세 번 실행하면 프로세스가 세 개 생깁니다.</p>
<div class="box analogy"><span class="lbl">비유로 보면</span>프로그램은 <b>레시피 책</b>, 프로세스는 <b>지금 불 위에서 끓고 있는 냄비</b>입니다. 레시피 하나로 냄비 여러 개를 동시에 끓일 수 있습니다.</div>
<ul>
<li><b>PID</b>: 프로세스마다 붙는 고유 번호. 프로세스를 지목할 때 씁니다.</li>
<li><b>PPID</b>: 나를 실행시킨 부모 프로세스의 번호. 모든 프로세스는 부모가 있고, 거슬러 올라가면 맨 위에 <b>PID 1 systemd</b>가 있습니다(일차 03 부팅 순서).</li>
<li><b>소유자</b>: 프로세스도 어떤 사용자의 권한으로 돕니다. nginx는 nginx 계정, 내가 실행한 것은 내 계정(일차 04).</li>
</ul>
<div class="tree">systemd(1)
├── sshd(1021)              <span class="c"># SSH 접속을 기다리는 데몬</span>
│   └── sshd(3305)          <span class="c"># trainee의 접속 세션</span>
│       └── bash(3311)      <span class="c"># trainee의 셸</span>
│           └── ps(5120)    <span class="c"># 방금 친 명령도 잠깐 프로세스가 된다</span>
├── crond(870)
└── nginx(2301)
    └── nginx(2302)         <span class="c"># 마스터가 일꾼(worker)을 낳는다</span></div>
<p class="small muted"><code>pstree</code> 명령으로 실제 서버에서 이런 나무를 볼 수 있습니다.</p>

<h2 id="s2">프로세스 확인과 종료: ps, kill</h2>
<pre class="code">ps aux                   <span class="c"># 모든 사용자의 모든 프로세스를 자세히</span>
ps -ef                   <span class="c"># 같은 목적, 다른 형식 (PPID가 보임)</span>
ps aux | grep nginx      <span class="c"># 파이프로 nginx가 들어간 줄만 찾기 (가장 많이 쓰는 형태)</span>
pgrep -l nginx           <span class="c"># 이름으로 PID만 찾기</span></pre>
<h3>ps aux 결과 읽기</h3>
<pre class="code">USER       PID %CPU %MEM    VSZ   RSS TTY   STAT START   TIME COMMAND
root         1  0.0  0.3 171820 13420 ?     Ss   Nov01   0:04 /usr/lib/systemd/systemd
root      1021  0.0  0.2  16112  9020 ?     Ss   Nov01   0:00 sshd: /usr/sbin/sshd -D
trainee   4120 97.8  0.0   7600  1200 pts/0 R    12:51  12:41 stress-test --cpu 1</pre>
<div class="tbl-wrap"><table><thead><tr><th>칸</th><th>뜻</th></tr></thead><tbody>
<tr><td>USER</td><td>프로세스를 실행한 사용자(권한)</td></tr>
<tr><td>PID</td><td>프로세스 번호</td></tr>
<tr><td>%CPU / %MEM</td><td>CPU 사용률 / 메모리 사용률. <b>문제의 프로세스를 찾을 때 가장 먼저 보는 칸</b></td></tr>
<tr><td>RSS</td><td>실제로 쓰고 있는 메모리 양(KB)</td></tr>
<tr><td>TTY</td><td>연결된 터미널. <code>?</code>는 터미널 없음 = 데몬</td></tr>
<tr><td>STAT</td><td>상태. R 실행 중, S 대기(잠자는 중), D 디스크 기다림, Z 좀비(끝났는데 정리 안 됨)</td></tr>
<tr><td>COMMAND</td><td>실행한 명령</td></tr>
</tbody></table></div>
<h3>프로세스 종료: kill</h3>
<pre class="code">kill 4120          <span class="c"># 정상 종료 요청 (시그널 15, TERM). 프로그램이 정리하고 끝낼 기회를 줌</span>
kill -9 4120       <span class="c"># 강제 종료 (시그널 9, KILL). 정리 없이 즉시 죽임</span>
pkill stress-test  <span class="c"># 이름으로 종료</span></pre>
<div class="box warn"><span class="lbl">kill -9는 마지막 수단</span><p>-9로 죽이면 프로그램이 저장 중이던 데이터를 정리하지 못해 파일이 깨질 수 있습니다(특히 DB). <b>먼저 그냥 kill(15)</b>, 그래도 안 죽을 때만 -9. 그리고 서비스(nginx 등)는 kill보다 <code>systemctl stop</code>으로 멈추는 것이 정석입니다. 남의 프로세스는 root만 종료할 수 있습니다.</p></div>

<h2 id="s3">데몬: 뒤에서 일하는 프로세스</h2>
<p><b>데몬(Daemon)</b>은 화면 없이 백그라운드에서 계속 돌면서 요청을 기다리고 서비스를 제공하는 프로세스입니다. 이름 끝에 <b>d</b>가 붙는 경우가 많습니다.</p>
<div class="tbl-wrap"><table><thead><tr><th>데몬</th><th>하는 일</th></tr></thead><tbody>
<tr><td><code>sshd</code></td><td>SSH 접속을 기다림 (22번 포트)</td></tr>
<tr><td><code>nginx</code> / <code>httpd</code></td><td>웹 요청을 기다림 (80·443번 포트)</td></tr>
<tr><td><code>crond</code></td><td>정해진 시간에 작업을 실행 (예약 작업)</td></tr>
<tr><td><code>chronyd</code></td><td>서버 시각을 정확하게 맞춤 (로그 시각이 틀리면 장애 분석이 어려움)</td></tr>
<tr><td><code>rsyslogd</code>, <code>systemd-journald</code></td><td>로그 수집·기록</td></tr>
<tr><td><code>firewalld</code></td><td>서버 자체 방화벽</td></tr>
</tbody></table></div>
<div class="box analogy"><span class="lbl">비유로 보면</span>데몬은 <b>24시간 편의점 직원</b>입니다. 손님(요청)이 없어도 자리를 지키고 있다가, 손님이 오면 바로 응대합니다. 이 직원들의 출퇴근을 관리하는 점장이 <b>systemd</b>입니다.</div>

<h2 id="s4">systemd와 systemctl: 서비스 관리</h2>
<p>systemd는 부팅할 때 서비스들을 순서대로 켜고, 실행 중에도 서비스를 감시하고 관리합니다. 관리 대상 하나하나를 <b>유닛(unit)</b>이라 하고, 데몬은 <b>서비스 유닛</b>(<code>nginx.service</code>)입니다. 우리는 <b>systemctl</b>로 systemd에게 명령합니다.</p>
<div class="tbl-wrap"><table><thead><tr><th>명령</th><th>하는 일</th><th>권한</th></tr></thead><tbody>
<tr><td><code>systemctl status nginx</code></td><td>상태 보기 (가장 많이 씀)</td><td>누구나</td></tr>
<tr><td><code>sudo systemctl start nginx</code></td><td>지금 켜기</td><td>root</td></tr>
<tr><td><code>sudo systemctl stop nginx</code></td><td>지금 끄기</td><td>root</td></tr>
<tr><td><code>sudo systemctl restart nginx</code></td><td>껐다 켜기 (설정 변경 적용, 잠깐 끊김)</td><td>root</td></tr>
<tr><td><code>sudo systemctl reload nginx</code></td><td>끊지 않고 설정만 다시 읽기 (지원하는 서비스만)</td><td>root</td></tr>
<tr><td><code>sudo systemctl enable nginx</code></td><td>부팅 시 자동 시작 등록</td><td>root</td></tr>
<tr><td><code>sudo systemctl disable nginx</code></td><td>자동 시작 해제</td><td>root</td></tr>
<tr><td><code>sudo systemctl enable --now nginx</code></td><td>자동 시작 등록 + 지금 켜기를 한 번에</td><td>root</td></tr>
<tr><td><code>systemctl is-active nginx</code> / <code>is-enabled</code></td><td>켜져 있나? / 자동 시작인가? 한 단어로 답</td><td>누구나</td></tr>
<tr><td><code>systemctl list-units --type=service</code></td><td>서비스 목록</td><td>누구나</td></tr>
<tr><td><code>systemctl --failed</code></td><td>실패한 서비스만</td><td>누구나</td></tr>
</tbody></table></div>
<div class="box mem"><span class="lbl">꼭 구분할 것: start ≠ enable</span><p><b>start</b>는 "지금 켜라", <b>enable</b>은 "다음 부팅부터 자동으로 켜라"입니다. start만 하고 enable을 안 하면 <b>재부팅 후 서비스가 안 올라옵니다.</b> 실무에서 정말 자주 나는 실수입니다. 새 서비스를 설치하면 <code>enable --now</code>로 둘 다 하세요.</p></div>
<h3>systemctl status 결과 읽기</h3>
<pre class="code">● nginx.service - The nginx HTTP and reverse proxy server
     Loaded: loaded (/usr/lib/systemd/system/nginx.service; <b>enabled</b>; preset: disabled)
     Active: <b>active (running)</b> since Wed 2026-11-04 13:05:00 KST; 2min ago
   Main PID: 2301 (nginx)
      Tasks: 3
     Memory: 4.1M
     CGroup: /system.slice/nginx.service
             ├─2301 "nginx: master process /usr/sbin/nginx"
             └─2302 "nginx: worker process"

Nov 04 13:05:00 ojt-web01 systemd[1]: Starting nginx.service...
Nov 04 13:05:00 ojt-web01 systemd[1]: Started nginx.service.</pre>
<div class="tbl-wrap"><table><thead><tr><th>줄</th><th>보는 법</th></tr></thead><tbody>
<tr><td>●</td><td>초록 = 실행 중, 흰색 = 꺼짐, 빨강 = 실패</td></tr>
<tr><td>Loaded</td><td>유닛 파일 위치, <b>enabled/disabled</b> = 부팅 시 자동 시작 여부</td></tr>
<tr><td>Active</td><td><b>active (running)</b> 정상 실행 / <b>inactive (dead)</b> 꺼짐 / <b>failed</b> 실패. 언제부터인지도 나옴</td></tr>
<tr><td>Main PID</td><td>메인 프로세스 번호</td></tr>
<tr><td>맨 아래 몇 줄</td><td>이 서비스의 <b>최근 로그</b>. failed일 때 원인이 여기 찍혀 있는 경우가 많음</td></tr>
</tbody></table></div>
<p>서비스 설정(유닛 파일)은 <code>/usr/lib/systemd/system/</code>(패키지가 설치한 원본)과 <code>/etc/systemd/system/</code>(관리자가 바꾼 것, 우선)에 있습니다. 유닛 파일을 고치면 <code>sudo systemctl daemon-reload</code>로 다시 읽게 합니다.</p>

<h2 id="s5">System Log: 무슨 일이 있었는지 기록</h2>
<p>로그는 서버의 <b>블랙박스</b>입니다. 장애가 나면 "언제, 무엇이, 왜"를 로그에서 찾습니다. 리눅스에서 로그를 보는 길은 두 가지입니다.</p>
<h3>① journalctl: systemd가 모은 로그</h3>
<pre class="code">journalctl                       <span class="c"># 전체 로그 (오래된 것부터, less처럼 넘김)</span>
journalctl -u nginx              <span class="c"># nginx 서비스 로그만 (가장 많이 씀)</span>
journalctl -u nginx -n 20        <span class="c"># 최근 20줄만</span>
journalctl -f                    <span class="c"># 새 로그를 실시간으로 계속 보기 (Ctrl+C로 나감)</span>
journalctl -b                    <span class="c"># 이번 부팅 이후 로그</span>
journalctl -p err                <span class="c"># 오류(err) 이상 심각한 것만</span>
journalctl --since "1 hour ago"  <span class="c"># 최근 1시간</span></pre>
<h3>② /var/log의 텍스트 로그 파일</h3>
<div class="tbl-wrap"><table><thead><tr><th>파일 (Rocky 기준)</th><th>Ubuntu</th><th>내용</th></tr></thead><tbody>
<tr><td><code>/var/log/messages</code></td><td><code>/var/log/syslog</code></td><td>시스템 전반</td></tr>
<tr><td><code>/var/log/secure</code></td><td><code>/var/log/auth.log</code></td><td>로그인, SSH, sudo 기록</td></tr>
<tr><td><code>/var/log/dnf.log</code></td><td><code>/var/log/apt/</code></td><td>프로그램 설치 기록</td></tr>
<tr><td><code>/var/log/nginx/access.log</code>, <code>error.log</code></td><td>같음</td><td>웹 접속 기록, 웹 오류</td></tr>
<tr><td><code>/var/log/cron</code></td><td>syslog에 포함</td><td>예약 작업 실행 기록</td></tr>
</tbody></table></div>
<pre class="code">sudo tail -n 50 /var/log/messages          <span class="c"># 최근 50줄 (로그 파일은 대부분 root만 읽기 가능)</span>
sudo tail -f /var/log/nginx/error.log      <span class="c"># 실시간으로 계속 보기</span>
sudo grep -i "fail" /var/log/secure        <span class="c"># 실패한 로그인 찾기</span></pre>
<h3>로그 한 줄 읽기</h3>
<pre class="code">Nov  4 09:20:13 ojt-web01 sshd[2210]: Failed password for invalid user admin from 203.0.113.50 port 40022 ssh2
<span class="c">시각            서버이름  프로그램[PID]  메시지 → "없는 사용자 admin으로 203.0.113.50에서 비밀번호 로그인 시도 실패"</span></pre>
<p>이런 줄이 수백 개 있다면 누군가 무작위로 비밀번호를 대입하고 있는 것입니다. 일차 04에서 배운 "비밀번호 로그인 끄기"가 필요한 이유입니다.</p>
<p>로그는 계속 쌓이므로 <b>logrotate</b>가 날짜별로 잘라 보관하고(<code>messages-20261101</code>처럼) 오래된 것은 지웁니다. 그래도 로그가 디스크를 가득 채우는 일이 흔해서, 일차 06의 용량 확인과 연결됩니다.</p>

<h2 id="s6">CPU와 메모리 모니터링</h2>
<h3>uptime: 한 줄 건강 상태</h3>
<pre class="code">$ uptime
 13:05:12 up 3 days,  4:12,  1 user,  load average: 1.95, 1.60, 1.02
<span class="c">현재시각   켜진 지 3일 4시간   접속자 1명   부하 평균: 최근 1분, 5분, 15분</span></pre>
<p><b>Load Average</b>는 "CPU를 쓰고 있거나 쓰려고 줄 서 있는 작업 수"의 평균입니다. <mark>CPU 코어 수와 비교</mark>해서 판단합니다. 코어가 2개(<code>nproc</code> = 2)라면 load 2.0이 꽉 찬 상태, 4.0이면 작업이 두 배로 밀려 있는 상태입니다. 1분 값이 15분 값보다 크면 부하가 올라가는 중입니다.</p>
<div class="box analogy"><span class="lbl">비유로 보면</span>계산대(코어)가 2개인 마트에서 load 1.95는 "계산대 두 곳이 거의 쉬지 않고 바쁜 상태", load 4.0은 "계산 중인 손님 2명 + 줄 선 손님 2명"입니다.</div>
<h3>top: 실시간 작업 관리자</h3>
<pre class="code">top - 13:05:12 up 3 days,  4:12,  1 user,  load average: 1.95, 1.60, 1.02
Tasks: 112 total,   2 running, 110 sleeping,   0 stopped,   0 zombie
%Cpu(s): 49.6 us,  0.8 sy,  0.0 ni, 49.1 id,  0.3 wa,  0.0 hi,  0.2 si,  0.0 st
MiB Mem :   3932.2 total,   1640.5 free,   1102.4 used,   1189.3 buff/cache
MiB Swap:   2048.0 total,   2048.0 free,      0.0 used.   2481.0 avail Mem

    PID USER      PR  NI    VIRT    RES    SHR S  %CPU  %MEM     TIME+ COMMAND
   4120 trainee   20   0    7600   1200    900 R  97.8   0.0  12:41.07 stress-test
   2301 root      20   0   12345   4100   2900 S   0.3   0.1   0:00.12 nginx</pre>
<div class="tbl-wrap"><table><thead><tr><th>줄</th><th>보는 법</th></tr></thead><tbody>
<tr><td>1줄</td><td>uptime과 같음</td></tr>
<tr><td>Tasks</td><td>프로세스 수. <b>zombie</b>가 계속 늘면 문제</td></tr>
<tr><td>%Cpu(s)</td><td><b>us</b> 사용자 프로그램, <b>sy</b> 커널, <b>id</b> 놀고 있음(idle), <b>wa</b> 디스크를 기다리는 시간. <b>id가 낮으면 CPU가 바쁨</b>, <b>wa가 높으면 디스크가 느림</b>, <b>st</b>가 높으면 VM이 하이퍼바이저에게 CPU를 못 받는 중(일차 02의 계층)</td></tr>
<tr><td>MiB Mem / Swap</td><td>메모리·스왑 요약. avail Mem이 실제로 더 쓸 수 있는 양</td></tr>
<tr><td>목록</td><td>기본은 CPU 많이 쓰는 순서. 범인 프로세스를 찾는 곳</td></tr>
</tbody></table></div>
<p>top 안에서: <kbd>P</kbd> CPU 순 정렬, <kbd>M</kbd> 메모리 순 정렬, <kbd>1</kbd> 코어별로 보기, <kbd>q</kbd> 나가기. 위 예시는 trainee가 실행한 <code>stress-test</code>가 CPU 한 코어를 거의 다 쓰고 있는 상황입니다(코어 2개라 전체 us는 약 50%).</p>
<h3>free: 메모리 사용량</h3>
<pre class="code">$ free -h
               total        used        free      shared  buff/cache   available
Mem:           3.8Gi       1.1Gi       1.6Gi        16Mi       1.2Gi       2.4Gi
Swap:          2.0Gi          0B       2.0Gi</pre>
<div class="box mem"><span class="lbl">free에서 볼 것은 available</span><p>리눅스는 남는 메모리를 파일 캐시(<b>buff/cache</b>)로 써서 <b>free</b>가 작게 보이는 게 정상입니다. 실제로 더 쓸 수 있는 양은 <b>available</b>입니다. available이 계속 줄고 <b>Swap used</b>가 늘어나면 메모리 부족 신호입니다(일차 02: 스왑 → OOM Killer).</p></div>
<h3>그 밖의 확인 명령</h3>
<div class="tbl-wrap"><table><thead><tr><th>명령</th><th>보는 것</th></tr></thead><tbody>
<tr><td><code>nproc</code>, <code>lscpu</code></td><td>CPU 개수와 정보 (load와 비교할 기준)</td></tr>
<tr><td><code>vmstat 1</code></td><td>1초마다 CPU·메모리·디스크 대기 요약</td></tr>
<tr><td><code>htop</code></td><td>top을 보기 좋게 만든 도구 (따로 설치)</td></tr>
<tr><td><code>dmesg</code></td><td>커널 메시지 (OOM Killer 기록 등)</td></tr>
</tbody></table></div>

<h2 id="s7">종합: "웹이 안 돼요" 점검 순서</h2>
<p>오늘 배운 명령을 실제 장애 상황 순서로 묶으면 이렇습니다. 손노트에 옮겨 적어 두세요.</p>
<ol>
<li><code>systemctl status nginx</code> → 서비스가 active (running)인가? failed면 아래 로그 줄 확인</li>
<li><code>journalctl -u nginx -n 50</code>, <code>sudo tail /var/log/nginx/error.log</code> → 오류 메시지 확인</li>
<li><code>uptime</code>, <code>top</code> → CPU가 꽉 찼나? 어떤 프로세스가 범인인가?</li>
<li><code>free -h</code> → available이 바닥났나? 스왑을 쓰고 있나?</li>
<li><code>df -h</code> → 디스크가 꽉 찼나? (일차 06)</li>
<li>조치 후 <code>sudo systemctl restart nginx</code> → 다시 status 확인 → 작업 로그 기록 → 보고</li>
</ol>
<p class="small muted">재부팅 후 서비스가 안 올라왔다면 <code>systemctl is-enabled nginx</code>부터 확인합니다(start ≠ enable).</p>

<h2 id="s8">직접 해 보기</h2>
<p>연습 터미널의 <b>"미션 C: 서비스·로그·자원"</b>에서 CPU를 독차지하는 프로세스를 찾아 종료하고, nginx를 켜고, 로그를 확인해 봅니다.</p>
<div class="btn-row"><a class="btn pri" href="#term">연습 터미널 열기 (미션 C)</a></div>
`,

body:`
<h2 id="s1">큰 그림: 디스크를 쓰려면 4단계가 필요하다</h2>
<p>새 디스크를 서버에 붙였다고 바로 파일을 저장할 수는 없습니다. Windows는 이 과정을 자동으로 해 주지만, 서버 엔지니어는 직접 합니다.</p>
<div class="flow"><div class="n"><b>① 디스크</b><small>/dev/vdb</small></div><span class="ar">→</span><div class="n"><b>② 파티션</b><small>구역 나누기 (선택)</small></div><span class="ar">→</span><div class="n k"><b>③ 파일시스템</b><small>mkfs로 포맷</small></div><span class="ar">→</span><div class="n k"><b>④ 마운트</b><small>/data 에 연결</small></div></div>
<div class="box analogy"><span class="lbl">비유로 보면 (땅과 건물)</span>① 새 디스크는 <b>빈 땅</b>입니다. ② 파티션은 땅에 <b>구획선</b>을 긋는 것. ③ 파일시스템은 그 위에 <b>건물을 짓고 호실 번호 체계</b>를 만드는 것(어디에 무엇을 둘지 찾을 수 있게). ④ 마운트는 그 건물을 <b>도로(디렉터리 트리)에 연결하는 출입문</b>을 내는 것입니다. 출입문이 없으면 건물이 있어도 들어갈 수 없습니다.</div>
<p>일차 03에서 리눅스는 드라이브 문자(C:, D:) 없이 <code>/</code> 하나의 나무라고 배웠습니다. 새 디스크도 이 나무의 한 가지(<code>/data</code>)에 붙입니다. 그것이 마운트입니다.</p>

<h2 id="s2">디스크: 장치 이름과 lsblk</h2>
<p>리눅스에서 디스크는 <code>/dev</code> 아래 파일로 보입니다(일차 03 "모든 것은 파일").</p>
<div class="tbl-wrap"><table><thead><tr><th>이름</th><th>어떤 디스크</th><th>파티션 이름</th></tr></thead><tbody>
<tr><td><code>/dev/sda</code>, <code>/dev/sdb</code></td><td>SATA·SAS·SCSI 디스크, iSCSI로 붙인 디스크</td><td>sda1, sda2</td></tr>
<tr><td><code>/dev/vda</code>, <code>/dev/vdb</code></td><td><b>KVM 가상 머신의 가상 디스크</b> (클라우드 VM에서 자주 봄)</td><td>vda1, vda2</td></tr>
<tr><td><code>/dev/nvme0n1</code></td><td>NVMe SSD</td><td>nvme0n1p1</td></tr>
</tbody></table></div>
<p>a, b, c는 붙은 순서입니다. 첫 번째 디스크가 vda, 두 번째가 vdb입니다. 순서는 상황에 따라 바뀔 수 있어서, 나중에 fstab에는 이름 대신 <b>UUID</b>를 씁니다.</p>
<pre class="code">$ lsblk
NAME   MAJ:MIN RM  SIZE RO TYPE MOUNTPOINTS
vda    252:0    0   20G  0 disk
├─vda1 252:1    0    1G  0 part /boot
└─vda2 252:2    0   19G  0 part /
vdb    252:16   0   10G  0 disk              <span class="c">← 새로 붙인 디스크. 파티션도, 마운트 위치도 없음</span></pre>
<ul><li><b>TYPE</b>: disk(디스크 통째) / part(파티션)</li><li><b>SIZE</b>: 크기</li><li><b>MOUNTPOINTS</b>: 어디에 연결되어 있나. 비어 있으면 아직 쓸 수 없는 상태</li></ul>
<p><code>lsblk -f</code>를 하면 파일시스템 종류(FSTYPE)와 UUID까지 보입니다.</p>
<p>클라우드에서는 콘솔에서 <b>볼륨을 만들어 VM에 연결(Attach)</b>하면 VM 안에서 이렇게 새 디스크(vdb)가 나타납니다. 6주차 실습("Volume 연결")과 7주차 zStorage의 Block 볼륨 연결이 바로 이 상황입니다.</p>

<h2 id="s3">파티션: 디스크를 구역으로 나누기</h2>
<p>디스크 하나를 용도별로 나눕니다. 예를 들어 OS 디스크(vda)는 부팅용 <code>/boot</code>(vda1)와 나머지 <code>/</code>(vda2)로 나뉘어 있습니다.</p>
<div class="tbl-wrap"><table><thead><tr><th>파티션 테이블</th><th>최대 디스크 크기</th><th>파티션 개수</th><th>짝이 되는 부팅 방식</th></tr></thead><tbody>
<tr><td><b>MBR</b> (옛날)</td><td>2TB</td><td>주 파티션 4개</td><td>BIOS</td></tr>
<tr><td><b>GPT</b> (요즘 표준)</td><td>사실상 제한 없음</td><td>128개</td><td>UEFI</td></tr>
</tbody></table></div>
<pre class="code">sudo fdisk -l                 <span class="c"># 모든 디스크의 파티션 정보 보기</span>
sudo parted /dev/vdb print    <span class="c"># 특정 디스크의 파티션 정보</span>
sudo fdisk /dev/vdb           <span class="c"># 대화형으로 파티션 만들기 (n 새로, w 저장)</span></pre>
<p class="small muted">데이터 전용으로 붙인 디스크는 파티션을 나누지 않고 <b>디스크 통째로</b> 파일시스템을 만드는 경우도 많습니다. 클라우드 볼륨은 필요하면 볼륨 자체를 늘릴 수 있기 때문입니다. 이 레슨의 실습도 통째로 씁니다.</p>
<h3>LVM (이름만 알아 두기)</h3>
<p>디스크 여러 개를 하나의 큰 저장 풀(Volume Group)로 묶고, 거기서 필요한 만큼 잘라(Logical Volume) 씁니다. 나중에 디스크를 추가해 <b>크기를 늘리기 쉽다</b>는 것이 장점입니다. RHEL 계열 설치 기본값이 LVM인 경우가 많아서 <code>/dev/mapper/rl-root</code> 같은 이름을 보게 됩니다.</p>

<h2 id="s4">파일시스템: 파일을 저장하는 규칙</h2>
<p>디스크는 그냥 거대한 숫자 칸들의 모음입니다. "memo.txt는 몇 번째 칸부터 몇 칸"을 기록하고 찾는 규칙이 <b>파일시스템</b>입니다. 파일시스템을 만드는 것을 <b>포맷</b>이라고 하며, <b>그 안에 있던 데이터는 모두 사라집니다.</b></p>
<div class="tbl-wrap"><table><thead><tr><th>파일시스템</th><th>어디서 기본</th><th>특징</th></tr></thead><tbody>
<tr><td><b>xfs</b></td><td>RHEL, Rocky Linux</td><td>대용량·고성능. 크기를 늘릴 수는 있지만 줄일 수는 없음</td></tr>
<tr><td><b>ext4</b></td><td>Ubuntu, Debian</td><td>오래 검증됨. 늘리기·줄이기 모두 가능</td></tr>
<tr><td>swap</td><td>공통</td><td>파일 저장용이 아니라 메모리 보조용 공간</td></tr>
<tr><td>vfat</td><td>UEFI 부팅 파티션</td><td>/boot/efi에 씀</td></tr>
</tbody></table></div>
<pre class="code">sudo mkfs.xfs /dev/vdb        <span class="c"># vdb 전체에 xfs 파일시스템 만들기</span>
sudo mkfs.ext4 /dev/vdb1      <span class="c"># 파티션 vdb1에 ext4 만들기</span>
sudo blkid /dev/vdb           <span class="c"># 만들어진 파일시스템의 UUID와 종류 확인</span></pre>
<div class="box warn"><span class="lbl">포맷 전에 반드시 확인</span><p>mkfs는 확인 질문 없이 실행되는 경우가 많습니다. <b>장치 이름을 한 글자만 틀려도(vda ↔ vdb) OS 디스크를 날립니다.</b> 실행 전에 <code>lsblk</code>로 크기와 마운트 위치를 보고, "비어 있고 마운트되지 않은 그 디스크"가 맞는지 두 번 확인하세요.</p></div>

<h2 id="s5">마운트: 디렉터리에 연결하기</h2>
<pre class="code">sudo mkdir /data                 <span class="c"># 1. 연결할 자리(마운트 포인트) 만들기</span>
sudo mount /dev/vdb /data        <span class="c"># 2. vdb의 파일시스템을 /data에 연결</span>
df -h /data                      <span class="c"># 3. 확인</span>
sudo umount /data                <span class="c"># 연결 해제 (u-mount, n이 없음에 주의)</span></pre>
<ul>
<li>마운트하면 <b>/data 안에 넣는 파일은 vdb 디스크에 저장</b>됩니다. 다른 디렉터리는 계속 vda2(/)에 저장됩니다.</li>
<li>마운트 포인트에 원래 파일이 있었다면, 마운트하는 동안은 가려져서 안 보입니다(지워진 건 아님). 그래서 빈 디렉터리에 마운트합니다.</li>
<li><code>umount</code> 할 때 그 디렉터리 안에 내가 들어가 있거나 어떤 프로그램이 파일을 쓰고 있으면 <code>target is busy</code> 오류가 납니다. <code>cd</code>로 밖으로 나와서 다시 합니다.</li>
<li><code>mount</code> 명령만 치면 지금 연결된 목록이 나옵니다.</li>
</ul>
<div class="box mem"><span class="lbl">중요: mount 명령은 재부팅하면 사라진다</span><p>mount로 연결한 것은 <b>지금만</b> 유효합니다. 재부팅해도 자동으로 연결되게 하려면 <b>/etc/fstab에 등록</b>해야 합니다. (일차 05의 start ≠ enable과 같은 이야기입니다.)</p></div>

<h2 id="s6">새 디스크 연결 전체 절차</h2>
<p>실무 요청: <b>"웹 서버에 10GB 디스크를 추가해서 /data로 쓰게 해 주세요."</b> 이 순서를 손노트에 그대로 적으세요.</p>
<pre class="code">lsblk                                       <span class="c"># 1. 새 디스크 확인 (vdb, 10G, 마운트 없음)</span>
sudo mkfs.xfs /dev/vdb                      <span class="c"># 2. 파일시스템 만들기 (장치 이름 두 번 확인!)</span>
sudo mkdir /data                            <span class="c"># 3. 마운트 포인트 만들기</span>
sudo mount /dev/vdb /data                   <span class="c"># 4. 연결</span>
df -h                                       <span class="c"># 5. /data 가 10G로 보이는지 확인</span>
sudo blkid /dev/vdb                         <span class="c"># 6. UUID 확인</span>
sudo cp /etc/fstab /etc/fstab.bak           <span class="c"># 7. fstab 백업</span>
echo "UUID=복사한값 /data xfs defaults 0 0" | sudo tee -a /etc/fstab   <span class="c"># 8. fstab에 한 줄 추가</span>
sudo umount /data                           <span class="c"># 9. 한 번 풀고</span>
sudo mount -a                               <span class="c"># 10. fstab대로 다시 연결 → 오류 없이 붙으면 fstab이 맞다는 뜻</span>
df -h /data                                 <span class="c"># 11. 최종 확인 → 작업 로그 기록</span></pre>
<div class="box warn"><span class="lbl">왜 sudo echo &gt;&gt; /etc/fstab 은 안 될까</span><p><code>sudo echo "..." &gt;&gt; /etc/fstab</code>은 <b>Permission denied</b>가 납니다. sudo는 echo에만 붙고, 파일에 쓰는 <code>&gt;&gt;</code>는 내 셸(일반 사용자)이 하기 때문입니다. 그래서 <code>echo "..." | sudo tee -a 파일</code> 형태를 씁니다. tee가 root 권한으로 파일에 이어 씁니다. (또는 <code>sudo vi /etc/fstab</code>으로 직접 편집)</p></div>

<h2 id="s7">/etc/fstab: 부팅 때 자동으로 연결할 목록</h2>
<pre class="code">UUID=3f9c2d1e-8a7b-4c5d-9e0f-1a2b3c4d5e6f  /data  xfs  defaults  0 0
<span class="c">① 무엇을                                   ② 어디에 ③ 종류 ④ 옵션    ⑤ ⑥</span></pre>
<div class="tbl-wrap"><table><thead><tr><th>칸</th><th>뜻</th><th>예</th></tr></thead><tbody>
<tr><td>① 장치</td><td>연결할 파일시스템. <b>UUID 권장</b>(장치 이름은 바뀔 수 있음)</td><td><code>UUID=...</code>, <code>/dev/vdb</code></td></tr>
<tr><td>② 마운트 포인트</td><td>연결할 디렉터리 (미리 만들어 둬야 함)</td><td><code>/data</code></td></tr>
<tr><td>③ 파일시스템 종류</td><td>mkfs로 만든 종류와 같아야 함</td><td><code>xfs</code>, <code>ext4</code>, <code>swap</code></td></tr>
<tr><td>④ 옵션</td><td>보통 defaults. 읽기 전용은 ro, 네트워크 디스크는 _netdev, 없어도 부팅되게 하려면 nofail</td><td><code>defaults</code></td></tr>
<tr><td>⑤ dump</td><td>옛 백업 도구용. 거의 0</td><td><code>0</code></td></tr>
<tr><td>⑥ fsck 순서</td><td>부팅 때 검사 순서. / 는 1, 나머지 2, xfs는 보통 0</td><td><code>0</code></td></tr>
</tbody></table></div>
<div class="box warn"><span class="lbl">fstab을 틀리면 서버가 안 켜진다</span><p>UUID 오타, 없는 디렉터리, 잘못된 파일시스템 종류를 적고 재부팅하면, systemd가 마운트에 실패해 <b>emergency mode</b>로 들어갑니다(일차 03 부팅 장애 표). 클라우드 VM이면 SSH도 안 됩니다. 그래서 반드시 <b>① 백업 → ② 수정 → ③ <code>sudo mount -a</code>로 오류 없는지 검증</b> 후에만 재부팅합니다. 중요하지 않은 추가 디스크에는 <code>nofail</code> 옵션을 넣어 두면 그 디스크가 없어도 부팅은 됩니다.</p></div>

<h2 id="s8">디스크 용량 확인: df와 du</h2>
<h3>df: 파일시스템별 용량</h3>
<pre class="code">$ df -h
Filesystem      Size  Used Avail Use% Mounted on
devtmpfs        4.0M     0  4.0M   0% /dev
tmpfs           1.9G     0  1.9G   0% /dev/shm
/dev/vda2        19G  4.2G   15G  22% /
/dev/vda1      1014M  220M  795M  22% /boot
/dev/vdb         10G  104M  9.9G   2% /data</pre>
<ul><li><b>-h</b>: 사람이 읽기 쉬운 단위(G, M)로. 거의 항상 붙입니다.</li><li><b>Use%</b>가 핵심. 보통 <b>80%를 넘으면 주의, 90%를 넘으면 조치</b>합니다(회사 기준에 따름).</li><li>tmpfs, devtmpfs는 메모리 위의 임시 파일시스템이라 무시해도 됩니다.</li><li><code>df -T</code>: 파일시스템 종류도 표시. <code>df -i</code>: inode 사용률(작은 파일이 엄청 많을 때 용량은 남아도 꽉 찰 수 있음).</li></ul>
<h3>du: 무엇이 공간을 차지하나</h3>
<pre class="code">du -sh /var/log                    <span class="c"># /var/log 전체 크기 (-s 합계만, -h 단위)</span>
sudo du -sh /var/log/* | sort -h   <span class="c"># /var/log 안의 항목별 크기를 작은 것부터 정렬 → 맨 아래가 범인</span>
sudo du -sh /* 2&gt;/dev/null | sort -h   <span class="c"># 루트 아래 어디가 큰지 (권한 오류 메시지는 버림)</span></pre>
<h3>디스크가 꽉 차면 생기는 일</h3>
<ul><li>로그를 못 써서 서비스가 멈추거나 이상하게 동작합니다.</li><li>DB가 데이터를 저장하지 못합니다.</li><li>SSH 로그인조차 안 되는 경우도 있습니다.</li></ul>
<p><b>흔한 범인</b>: 정리되지 않은 오래된 로그(<code>/var/log</code>), 애플리케이션 로그, 백업 파일, <code>/tmp</code>의 임시 파일. 지우기 전에 <b>무엇인지 확인하고 사수에게 물어보세요</b>. 실행 중인 프로그램이 쓰고 있는 로그 파일을 rm으로 지우면 공간이 바로 돌아오지 않을 수도 있습니다.</p>

<h2 id="s9">종합: 디스크 관련 명령 한눈에</h2>
<div class="tbl-wrap"><table><thead><tr><th>하고 싶은 것</th><th>명령</th></tr></thead><tbody>
<tr><td>디스크·파티션·마운트 위치 보기</td><td><code>lsblk</code>, <code>lsblk -f</code></td></tr>
<tr><td>UUID·파일시스템 종류 보기</td><td><code>sudo blkid</code></td></tr>
<tr><td>파티션 보기·만들기</td><td><code>sudo fdisk -l</code>, <code>sudo fdisk /dev/vdb</code>, <code>parted</code></td></tr>
<tr><td>파일시스템 만들기(포맷)</td><td><code>sudo mkfs.xfs /dev/vdb</code>, <code>mkfs.ext4</code></td></tr>
<tr><td>연결 / 해제</td><td><code>sudo mount 장치 디렉터리</code> / <code>sudo umount 디렉터리</code></td></tr>
<tr><td>지금 연결된 목록</td><td><code>mount</code>, <code>findmnt</code></td></tr>
<tr><td>부팅 시 자동 연결 등록·검증</td><td><code>/etc/fstab</code> 수정 → <code>sudo mount -a</code></td></tr>
<tr><td>용량 확인</td><td><code>df -h</code> (파일시스템별), <code>du -sh 경로</code> (디렉터리별)</td></tr>
</tbody></table></div>
<p>4주차(Storage 기초)에서는 이 디스크가 네트워크 너머의 스토리지(SAN, iSCSI)에서 올 때를, 7주차(zStorage)에서는 VPSA 볼륨을 VM에 연결해 마운트하는 실습을 합니다. <b>오늘 절차가 그대로 반복됩니다.</b></p>

<h2 id="s10">직접 해 보기</h2>
<p>연습 터미널의 <b>"미션 D: 디스크 연결"</b>에서 새 디스크 vdb를 포맷하고, /data에 마운트하고, fstab에 등록해 검증까지 해 봅니다.</p>
<div class="btn-row"><a class="btn pri" href="#term">연습 터미널 열기 (미션 D)</a></div>
`,
summary:['디스크 → 파티션(선택) → 파일시스템(mkfs, 포맷) → 마운트(디렉터리에 연결). 빈 땅 → 구획 → 건물 → 출입문.','장치 이름: sda(물리·iSCSI), vda(KVM VM), nvme0n1. lsblk로 크기·TYPE·MOUNTPOINTS 확인.','파티션 테이블 MBR(2TB) vs GPT. 파일시스템 xfs(RHEL 기본) vs ext4(Ubuntu 기본). 포맷하면 데이터가 사라진다 → 장치 이름 두 번 확인.','mount는 지금만 유효. 재부팅 후에도 연결하려면 /etc/fstab(UUID 마운트포인트 종류 옵션 0 0)에 등록.','fstab 수정: 백업 → 수정 → mount -a로 검증 → 그다음 재부팅. 틀리면 emergency mode. sudo echo >> 대신 | sudo tee -a.','df -h = 파일시스템별 용량(Use% 80·90% 기준), du -sh 경로 | sort -h = 무엇이 큰지. 흔한 범인은 /var/log.'],
essay:[

    l.terms.map(t => '<div class="term"><dt>' + esc(t[0]) + '<small>' + esc(t[1]) + '</small></dt><dd>' + esc(t[2]) + '</dd></div>').join('') + '</dl>';

      '<div class="btn-row"><button class="btn sm" data-act="show">' + (g != null ? '모범 답안 다시 보기' : '모범 답안 보기') + '</button></div>' +
      '<div class="model" hidden>' + esc(e.a) + '</div>' +
      '<div class="grade" ' + (g == null ? 'hidden' : '') + '><span class="small muted">스스로 채점:</span>' +
      [[2, '○ 설명할 수 있다'], [1, '△ 일부만'], [0, '× 못 했다']].map(([k, t]) => '<button class="g' + k + (g === k ? ' on' : '') + '" data-g="' + k + '">' + t + '</button>').join('') + '</div></div>';
  }).join('');

    const i = +el.dataset.i, ta = $('textarea', el);
    let t; ta.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => { p.et[i] = ta.value; save(true); }, 600); });
    $('[data-act="show"]', el).onclick = () => { $('.model', el).hidden = !$('.model', el).hidden; $('.grade', el).hidden = false; };
    $$('[data-g]', el).forEach(b => b.onclick = () => {
      p.es[i] = +b.dataset.g; $$('[data-g]', el).forEach(x => x.classList.toggle('on', x === b)); save(); renderFinish(l);
      if (+b.dataset.g < 2) toast('막힌 부분은 본문을 다시 읽고, 질문 노트에도 적어 두세요');
    });
  });
}

/* generic quiz: immediate feedback */
function renderLessonQuiz(l, p) {
  const box = $('#quizBox');
  const qs = shuffle(l.quiz.map((q, i) => ({ ...q, i })));
  let answered = 0, correct = 0;
  box.innerHTML = qs.map((q, n) => {
    const opts = shuffle(q.o.map((t, k) => ({ t, ok: k === 0 })));
    q._opts = opts;
    return '<div class="q" data-n="' + n + '"><div class="q-h"><span class="qn">' + (n + 1) + '.</span><span>' + esc(q.q) + '</span></div><div class="opts">' +
      opts.map((o, k) => '<button class="opt" data-k="' + k + '">' + esc(o.t) + '</button>').join('') + '</div><div class="expl" hidden></div></div>';
  }).join('') + '<div id="qScore"></div>';
  $$('.q', box).forEach(el => {
    const q = qs[+el.dataset.n];
    $$('.opt', el).forEach(b => b.onclick = () => {
      const k = +b.dataset.k, ok = q._opts[k].ok;
      $$('.opt', el).forEach((x, j) => { x.disabled = true; if (q._opts[j].ok) x.classList.add('ok'); });
      if (!ok) b.classList.add('no');
      const ex = $('.expl', el); ex.hidden = false;
      ex.innerHTML = (ok ? '<b class="ok">정답입니다.</b> ' : '<b class="no">아쉬워요.</b> ') + esc(q.e);
      answered++; if (ok) correct++;
      if (answered === qs.length) {
        const sc = Math.round(correct / qs.length * 100);
        p.qlast = sc; p.quiz = Math.max(p.quiz || 0, sc); save(); renderFinish(l);
        const pass = sc >= 80;
        $('#qScore').innerHTML = '<div class="box" style="border-color:' + (pass ? 'var(--good)' : 'var(--bad)') + '"><div class="score"><span class="big">' + sc + '</span><div><b>' + correct + ' / ' + qs.length + ' 정답</b><br><span class="small">' + (pass ? '통과입니다. 틀린 문제의 해설은 손노트에 한 줄씩 적어 두세요.' : '80점 미만입니다. 틀린 문제와 관련된 본문을 다시 읽고 재도전하세요.') + '</span></div></div><div class="btn-row"><button class="btn sm" id="qAgain">다시 풀기 (순서 섞기)</button></div></div>';
        $('#qAgain').onclick = () => { renderLessonQuiz(l, p); $('#quiz').scrollIntoView({ behavior: 'smooth' }); };
      }
    });
  });
}

function renderFinish(l) {
  const box = $('#finBox'); if (!box) return;
  const st = lstat(l.id), p = st.p;
  const cond = (ok, html) => '<div class="cond' + (ok ? ' ok' : '') + '"><span class="ck">' + (ok ? '✓' : '') + '</span><div>' + html + '</div></div>';
  let h = '<div class="done-box">';
  h += cond(st.quizOk, '퀴즈 80점 이상 <span class="muted small">(현재 최고 ' + (p.quiz == null ? '–' : p.quiz) + '점)</span>');
  h += cond(st.essOk, '셀프체크 ' + l.essay.length + '문항 모두 채점 <span class="muted small">(' + st.graded + ' / ' + l.essay.length + ')</span>');
  h += '<div class="cond' + (st.note ? ' ok' : '') + '"><span class="ck">' + (st.note ? '✓' : '') + '</span><div><label><input type="checkbox" id="noteCk" ' + (st.note ? 'checked' : '') + '> 핵심 정리를 손노트에 옮겨 적고, 용어를 온라인 노트에 정리했다</label></div></div>';
  if (st.done) {
    h += '<p style="margin-bottom:0"><span class="chip good">완료 ' + niceD(p.done) + '</span> ' + (p.rv && p.rv.next ? '다음 복습: <b>' + niceD(p.rv.next) + '</b>' : '복습 일정을 모두 마쳤습니다') + '</p>';
  } else {
    const ready = st.quizOk && st.essOk && st.note;
    h += '<div class="btn-row"><button class="btn pri" id="finBtn" ' + (ready ? '' : 'disabled') + '>레슨 완료</button>' + (ready ? '' : '<span class="small muted" style="align-self:center">위 세 가지를 모두 채우면 눌립니다</span>') + '</div>';
  }
  if (l.id === 'l4') h += '<p class="small" style="margin-bottom:0">1주차 레슨이 끝났다면 <a href="#exam1">1주차 종합시험</a>으로 마무리하세요.</p>';
  if (l.id === 'l10') h += '<p class="small" style="margin-bottom:0">일차 01~06이 끝났다면 <a href="#exam2">일차 01–06 종합시험</a>으로 마무리하세요.</p>';
  h += '</div>';
  box.innerHTML = h;
  $('#noteCk').onchange = e => { p.note = e.target.checked; save(); renderFinish(l); };
  if ($('#finBtn')) $('#finBtn').onclick = () => {
    p.done = today(); p.rv = { stage: 0, next: addDays(today(), INTERVALS[0]) }; save(); renderFinish(l);
    toast('레슨 완료! 내일(' + niceD(p.rv.next) + ') 첫 복습이 잡혔습니다');
  };
}

/* ---------- permission calculator ---------- */
function mountPermCalc(el) {
  const rows = [['소유자', 'u'], ['그룹', 'g'], ['기타', 'o']], bits = [['r', 4], ['w', 2], ['x', 1]];
  let st = [6, 4, 4], target = null;
  el.className = 'pc';
  const draw = () => {
    let h = '<b class="small">권한 계산기</b> <span class="small muted">칸을 눌러 켜고 끄세요</span><div class="pc-grid" style="margin-top:10px"><span></span>' + bits.map(b => '<span class="h">' + b[0] + ' (' + b[1] + ')</span>').join('') + '<span class="h">합</span>';
    rows.forEach((r, ri) => {
      h += '<span class="small">' + r[0] + ' <span class="muted mono">' + r[1] + '</span></span>';
      bits.forEach(b => { const on = (st[ri] & b[1]) !== 0; h += '<label class="' + (on ? 'on' : '') + '"><input type="checkbox" data-r="' + ri + '" data-b="' + b[1] + '" ' + (on ? 'checked' : '') + '>' + (on ? b[0] : '-') + '</label>'; });
      h += '<span class="num">' + st[ri] + '</span>';
    });
    const sym = st.map(d => (d & 4 ? 'r' : '-') + (d & 2 ? 'w' : '-') + (d & 1 ? 'x' : '-')).join('');
    const num = st.join('');
    h += '</div><div class="pc-out"><span>' + num + '</span><span>' + sym + '</span><small>chmod ' + num + ' 파일명</small></div>';

function startExam(eid, pool, nQ) {

    '<div class="btn-row"><button class="btn pri" id="exSubmit">제출하고 채점</button><span class="small muted" id="exLeft" style="align-self:center"></span></div><div id="exRes"></div>';
  const sel = new Array(qs.length).fill(null);

  left();
  $$('.exam-q', box).forEach(el => {
    const n = +el.dataset.n;
    $$('.opt', el).forEach(b => b.onclick = () => { if (sel[n] === 'locked') return; sel[n] = +b.dataset.k; $$('.opt', el).forEach(x => x.classList.toggle('sel', x === b)); left(); });
  });
  $('#exSubmit').onclick = () => {
    if (sel.some(x => x == null) && !$('#exSubmit').dataset.warned) { $('#exSubmit').dataset.warned = '1'; $('#exSubmit').textContent = '안 푼 문제가 있어요. 그래도 제출'; return; }
    let correct = 0; const per = {};
    qs.forEach((q, n) => {
      const el = $('.exam-q[data-n="' + n + '"]', box), pick = sel[n], ok = pick != null && q._opts[pick].ok;
      per[q.lid] = per[q.lid] || [0, 0]; per[q.lid][1]++; if (ok) { per[q.lid][0]++; correct++; }
      $$('.opt', el).forEach((x, j) => { x.disabled = true; x.classList.remove('sel'); if (q._opts[j].ok) x.classList.add('ok'); else if (j === pick) x.classList.add('no'); });
      const ex = $('.expl', el); ex.hidden = false; ex.innerHTML = (ok ? '<b class="ok">정답</b> ' : '<b class="no">오답</b> ') + esc(q.e) + ' <a class="small" href="#' + q.lid + '">레슨 보기</a>';
    });
    const sc = Math.round(correct / qs.length * 100);
    const pr = S.exams[eid] || { best: 0 };
    S.exams[eid] = { best: Math.max(pr.best || 0, sc), last: sc, date: today() }; save();
    $('#exSubmit').parentElement.hidden = true;
    const weak = Object.entries(per).filter(([id, [a, b]]) => a / b < 0.8).map(([id]) => id);
    $('#exRes').innerHTML = '';
    const res = '<div class="box" style="border-color:' + (sc >= 80 ? 'var(--good)' : 'var(--bad)') + '"><div class="score"><span class="big">' + sc + '</span><div><b>' + correct + ' / ' + qs.length + ' 정답</b><br><span class="small">' + (sc >= 80 ? '통과입니다.' : '80점 미만입니다. 아래에서 점수가 낮은 레슨을 다시 보고 재도전하세요.') + '</span></div></div>' +
      '<div style="margin-top:12px">' + Object.entries(per).map(([id, [a, b]]) => '<div class="res-l"><a href="#' + id + '">' + esc(LMAP[id].title) + '</a><span class="mono small">' + a + '/' + b + '</span><div class="mini-bar"><i style="width:' + (a / b * 100) + '%;background:' + (a / b >= 0.8 ? 'var(--good)' : 'var(--bad)') + '"></i></div></div>').join('') + '</div>' +
      (weak.length ? '<p class="small">다시 볼 레슨: ' + weak.map(id => '<a href="#' + id + '">' + esc(LMAP[id].title) + '</a>').join(', ') + '</p>' : '') +
      '<div class="btn-row"><button class="btn" id="exAgain">새 문제로 다시 보기</button></div></div>';
    box.insertAdjacentHTML('afterbegin', '<div id="exTop">' + res + '</div>');
    $('#exAgain').onclick = () => route();
    $('#exTop').scrollIntoView({ behavior: 'smooth' });
  };
}

    { t: '로그인 실패 기록 찾기 (누가 무작위로 비밀번호를 대입하고 있나?)', h: 'sudo grep Failed /var/log/secure', c: () => anyCmd('grep') && has('/var/log/secure') && info.ok !== false && !info.denied }
  ] },
  d: { name: 'D 디스크', lesson: 'l10', items: [
    { t: '디스크 목록 보기: 새로 붙은 빈 디스크는?', h: 'lsblk  → vdb (10G, 마운트 위치 없음)', c: () => info.cmd === 'lsblk' },
    { t: '지금 연결된 파일시스템과 용량 보기', h: 'df -h', c: () => info.cmd === 'df' && info.flags.includes('h') },
    { t: 'vdb에 xfs 파일시스템 만들기 (장치 이름 두 번 확인!)', h: 'sudo mkfs.xfs /dev/vdb', c: () => !!T.devs.vdb.fs },
    { t: '연결할 자리 /data 만들기', h: 'sudo mkdir /data', c: () => { const n = getNode('/data'); return !!n && n.t === 'd'; } },
    { t: 'vdb를 /data에 연결하기', h: 'sudo mount /dev/vdb /data', c: () => T.devs.vdb.mnt === '/data' },
    { t: '연결됐는지 용량으로 확인하기', h: 'df -h   (/dev/vdb 10G /data 가 보이나요?)', c: () => info.cmd === 'df' && T.devs.vdb.mnt === '/data' },
    { t: 'vdb의 UUID 확인하기', h: 'sudo blkid /dev/vdb', c: () => info.cmd === 'blkid' && info.ok !== false && !!T.devs.vdb.uuid },
    { t: '/etc/fstab에 자동 연결 줄 추가하기', h: 'echo "UUID=복사한값 /data xfs defaults 0 0" | sudo tee -a /etc/fstab   (cat /etc/fstab 으로 확인)', c: () => { const d = T.devs.vdb; return !!d.uuid && getNode('/etc/fstab').x.split('\n').some(l => { const f = l.trim().split(/\s+/); return (f[0] === 'UUID=' + d.uuid || f[0] === '/dev/vdb') && f[1] === '/data' && f[2] === d.fs; }); } },
    { t: 'fstab을 검증하려고 /data 연결을 한 번 풀기', h: 'sudo umount /data   (target is busy 가 나오면 cd 로 밖에 나와서)', c: () => info.cmd === 'umount' && !T.devs.vdb.mnt },
    { t: 'fstab대로 다시 연결해서 검증하기 (오류 없이 붙으면 성공)', h: 'sudo mount -a  →  df -h /data', c: () => info.cmd === 'mount' && info.flags.includes('a') && T.devs.vdb.mnt === '/data' && info.ok !== false },
    { t: '/var/log에서 가장 큰 파일 찾기', h: 'sudo du -sh /var/log/* | sort -h', c: () => info.cmd === 'du' && anyCmd('sort') }
  ] }
};
const MSETS = ['a', 'b', 'c', 'd'];
function checkMission() {
  const set = MISSIONS[TMSET].items, k = S.term[TMSET] || 0;
  if (k >= set.length) return;
  let ok = false; try { ok = !!set[k].c(); } catch (e) {}
  if (ok) {
    S.term[TMSET] = k + 1; save(true);
    tPrint('<span class="t-y">✓ 미션 ' + (k + 1) + ' 완료: ' + esc(set[k].t) + '</span>', true);
    if (k + 1 === set.length) { tPrint('<span class="t-y">★ 미션 ' + TMSET.toUpperCase() + ' 전부 완료! 잘했습니다.</span>', true); toast('미션 ' + TMSET.toUpperCase() + ' 완료!'); }
    drawMissions(); renderNav();
  }
}
function drawMissions() {
  const box = $('#mBox'); if (!box) return;
  const M = MISSIONS[TMSET], set = M.items, k = S.term[TMSET] || 0;
  box.innerHTML = '<div class="seg" id="mSet" style="margin-bottom:10px">' + MSETS.map(s => '<button data-v="' + s + '" class="' + (TMSET === s ? 'on' : '') + '">' + MISSIONS[s].name + ((S.term[s] || 0) >= MISSIONS[s].items.length ? ' ✓' : '') + '</button>').join('') + '</div>' +
    '<div class="small muted" style="margin-bottom:6px">' + Math.min(k, set.length) + ' / ' + set.length + ' 완료 · <a href="#' + M.lesson + '">' + esc(LMAP[M.lesson].tag) + ' 레슨</a> 연습</div>' +
    set.map((m, i) => '<div class="mi ' + (i < k ? 'ok' : i === k ? 'cur' : 'todo') + '"><span class="ck">' + (i < k ? '✓' : i + 1) + '</span><div>' + esc(m.t) + (i === k ? '<div class="hint"><button class="btn sm" data-hint style="padding:2px 8px;font-size:.76rem">힌트 보기</button><span data-ht hidden> <code>' + esc(m.h) + '</code></span></div>' : '') + '</div></div>').join('') +
    '<div class="btn-row"><button class="btn sm" id="mReset">이 미션 처음부터</button></div>';
  $$('#mSet button').forEach(b => b.onclick = () => { TMSET = b.dataset.v; drawMissions(); $('#ttyIn').focus(); });
  const hb = $('[data-hint]', box); if (hb) hb.onclick = () => { $('[data-ht]', box).hidden = false; hb.hidden = true; };
  $('#mReset').onclick = () => { S.term[TMSET] = 0; save(); T = initT(); vTerm(); };
}
function vTerm() {
  let h = '<div class="eyebrow">셀프 테스트 · 일차 03–06</div><h1>연습 터미널</h1><p class="lede">진짜 서버(Rocky Linux 9 VM)처럼 명령어를 입력해 보는 곳입니다. 이 페이지 안에서만 동작하는 가짜 리눅스라서 무엇을 지워도 괜찮습니다.</p>';
  h += '<p class="small muted">오른쪽 미션을 순서대로 하세요. 막히면 <code>help</code>, <code>man 명령어</code>, 또는 미션의 "힌트 보기". 명령어를 친 뒤 <kbd>Enter</kbd>, 이름 일부만 치고 <kbd>Tab</kbd>을 누르면 자동 완성됩니다. 파이프(<code>|</code>)와 <code>&gt;</code>도 됩니다.</p>';
  h += '<div class="term-wrap"><div class="tty" id="tty"><div class="tty-bar"><i></i><i></i><i></i><span style="margin-left:6px">trainee@ojt-web01 — 연습용 (Rocky Linux 9 · KVM VM)</span></div><div class="tty-out" id="ttyOut"></div><div class="tty-in"><span id="ttyPs"></span><input id="ttyIn" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="명령어 입력"></div></div><div class="missions" id="mBox"></div></div>';
  h += '<div class="btn-row"><button class="btn sm" id="tReset">터미널 초기화 (파일·서비스·디스크 원래대로)</button></div>';
  h += '<h2>기억할 것</h2><ul><li>에러 메시지는 영어지만 읽으면 이유가 적혀 있습니다. <code>No such file or directory</code> = 그런 파일 없음, <code>Permission denied</code> = 권한 없음, <code>command not found</code> = 그런 명령 없음(오타 확인), <code>target is busy</code> = 사용 중.</li><li>리눅스는 성공하면 대개 아무 말도 하지 않습니다. 결과는 <code>ls</code>, <code>id</code>, <code>systemctl status</code>, <code>df -h</code> 같은 명령으로 직접 확인하는 습관을 들이세요.</li><li>대소문자를 구분합니다. <code>Memo.txt</code>와 <code>memo.txt</code>는 다른 파일입니다.</li><li>미션은 순서대로만 인정됩니다. 앞 미션을 먼저 끝내세요.</li></ul>';
  $('#view').innerHTML = h;
  const out = $('#ttyOut');
  if (!T.out.length) T.out.push('<span class="t-m">Rocky Linux 9.4 · 연습 터미널에 오신 것을 환영합니다.\nhelp 를 입력하면 쓸 수 있는 명령어가 나옵니다.\nLast login: Wed Nov  4 12:40:05 2026 from 10.0.0.25</span>\n');
  out.innerHTML = T.out.join('\n') + '\n'; out.scrollTop = out.scrollHeight;
  const inp = $('#ttyIn');
  const ps = () => { $('#ttyPs').innerHTML = promptHTML(); };
  ps();
  $('#tty').addEventListener('click', () => { if (!window.getSelection().toString()) inp.focus(); });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const v = inp.value; inp.value = ''; run(v); if (v.trim()) checkMission(); ps(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (T.hi > 0) { T.hi--; inp.value = T.hist[T.hi] || ''; } }
    else if (e.key === 'ArrowDown') { e.preventDefault(); if (T.hi < T.hist.length) { T.hi++; inp.value = T.hist[T.hi] || ''; } }
    else if (e.key === 'Tab') { e.preventDefault(); complete(inp); }
    else if (e.key === 'c' && e.ctrlKey && !window.getSelection().toString()) { e.preventDefault(); tPrint(promptHTML() + ' ' + esc(inp.value) + '^C', true); inp.value = ''; }
    else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); T.out = []; out.innerHTML = ''; }
  });
  $('#tReset').onclick = () => { T = initT(); vTerm(); toast('파일·서비스·디스크를 처음 상태로 돌렸습니다 (미션 진도는 유지)'); };
  drawMissions();
  if (window.matchMedia('(min-width: 881px)').matches) inp.focus({ preventScroll: true });
}
function complete(inp) {
  const v = inp.value, parts = v.split(' '), last = parts[parts.length - 1];
  let cands;
  const prev = parts[parts.length - 2], prev2 = parts[parts.length - 3];
  const first = parts.length === 1 || (parts.length === 2 && parts[0] === 'sudo') || prev === '|' || (prev === 'sudo' && prev2 === '|');
  if (first) cands = Object.keys(MAN).concat(['sudo', 'll', 'exit', 'man', 'help']).filter(c => c.startsWith(last));
  else {
    const i = last.lastIndexOf('/'); const dirPart = i >= 0 ? last.slice(0, i + 1) : ''; const base = i >= 0 ? last.slice(i + 1) : last;
    const dn = getNode(norm(dirPart || '.', curUser()));
    if (!dn || dn.t !== 'd') return;
    cands = Object.keys(dn.c).filter(k => k.startsWith(base) && (base.startsWith('.') || !k.startsWith('.'))).map(k => dirPart + k + (dn.c[k].t === 'd' ? '/' : ''));
  }
  if (cands.length === 1) { parts[parts.length - 1] = cands[0]; inp.value = parts.join(' ') + (cands[0].endsWith('/') ? '' : ' '); }
  else if (cands.length > 1) {
    tPrint(promptHTML() + ' ' + esc(v) + '\n' + cands.map(esc).join('  '), true);
    let pre = cands[0]; cands.forEach(c => { while (!c.startsWith(pre)) pre = pre.slice(0, -1); });
    if (pre.length > last.length) { parts[parts.length - 1] = pre; inp.value = parts.join(' '); }
  }
}

route(true);
initCloud();
